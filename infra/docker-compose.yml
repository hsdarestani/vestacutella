services:
  redis:
    image: redis:7.4-alpine
    container_name: vc-redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "4"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 384m
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  db-cutella:
    image: mariadb:10.11
    container_name: vc-db-cutella
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "4"
    environment:
      MARIADB_DATABASE: vestacos_cutella
      MARIADB_USER: vestacos_cutella
      MARIADB_PASSWORD: ${CUTELLA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${CUTELLA_DB_ROOT_PASSWORD}
    volumes:
      - /srv/vestacutella/runtime/db-cutella:/var/lib/mysql
      - /srv/vestacutella/runtime/init-cutella:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  db-vesta:
    image: mariadb:10.11
    container_name: vc-db-vesta
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "4"
    environment:
      MARIADB_DATABASE: vestacos_m
      MARIADB_USER: vestacos_m
      MARIADB_PASSWORD: ${VESTA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${VESTA_DB_ROOT_PASSWORD}
    volumes:
      - /srv/vestacutella/runtime/db-vesta:/var/lib/mysql
      - /srv/vestacutella/runtime/init-vesta:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  cutella:
    build:
      context: ./wordpress
    image: vestacutella-wordpress:php8.1-ioncube
    container_name: vc-cutella
    restart: unless-stopped
    mem_limit: 1500m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "4"
    depends_on:
      db-cutella:
        condition: service_healthy
    volumes:
      - /srv/vestacutella/runtime/cutella:/var/www/html
    networks: [backend]

  vesta:
    build:
      context: ./wordpress74
    image: vestacutella-wordpress:php7.4-ioncube
    container_name: vc-vesta
    restart: unless-stopped
    mem_limit: 2900m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "4"
    depends_on:
      db-vesta:
        condition: service_healthy
    volumes:
      - /srv/vestacutella/runtime/vesta:/var/www/html
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    container_name: vc-nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "4"
    depends_on: [cutella, vesta]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/vestacutella/repo/infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/vestacutella/runtime/certs:/etc/nginx/certs:ro
      - /srv/vestacutella/runtime/cutella:/var/www/cutella:ro
      - /srv/vestacutella/runtime/vesta:/var/www/vesta:ro
    networks: [backend]

networks:
  backend:
    name: vestacutella-backend
