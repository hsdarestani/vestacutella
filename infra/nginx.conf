worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_tokens off;

  client_max_body_size 128m;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_buffering on;
  proxy_buffer_size 32k;
  proxy_buffers 16 32k;
  proxy_busy_buffers_size 64k;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/manifest+json;

  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  upstream cutella_backend {
    server cutella:80;
    keepalive 32;
  }

  upstream vesta_backend {
    server vesta:80;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/cutella/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cutella/privkey.pem;
    return 444;
  }

  server {
    listen 80;
    server_name cutellashop.ir www.cutellashop.ir;
    return 301 https://cutellashop.ir$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name cutellashop.ir www.cutellashop.ir;

    ssl_certificate /etc/nginx/certs/cutella/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cutella/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
      root /var/www/cutella;
      try_files $uri @cutella_app;
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location @cutella_app {
      proxy_pass http://cutella_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    # Keep product/account HTML fresh at the CDN/browser layer while
    # WordPress/WP Rocket can still serve its fast origin-side page cache.
    location ^~ /product/ {
      proxy_pass http://cutella_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    location ~ ^/(cart|checkout|my-account)(/|$) {
      proxy_pass http://cutella_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    location / {
      proxy_pass http://cutella_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  server {
    listen 80;
    server_name vesta-cosmetics.ir www.vesta-cosmetics.ir;
    return 301 https://vesta-cosmetics.ir$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name vesta-cosmetics.ir www.vesta-cosmetics.ir;

    ssl_certificate /etc/nginx/certs/vesta/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vesta/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
      root /var/www/vesta;
      try_files $uri @vesta_app;
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location @vesta_app {
      proxy_pass http://vesta_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }

    # Keep product/account HTML fresh at the CDN/browser layer while
    # WordPress/WP Rocket can still serve its fast origin-side page cache.
    location ^~ /product/ {
      proxy_pass http://vesta_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    location ~ ^/(cart|checkout|my-account)(/|$) {
      proxy_pass http://vesta_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
      add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    location / {
      proxy_pass http://vesta_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
    # BEGIN VESTAAPP ISOLATED ROUTING
  server {
    listen 80;
    server_name app.vesta-cosmetics.ir;
    location ^~ /.well-known/acme-challenge/ {
      proxy_pass http://vc-vestaapp-web:8080;
      proxy_set_header Host $host;
    }
    location / { return 301 https://app.vesta-cosmetics.ir$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name app.vesta-cosmetics.ir;
    ssl_certificate /etc/nginx/certs/app-vesta/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app-vesta/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://vc-vestaapp-web:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 90s;
    }
  }
    # END VESTAAPP ISOLATED ROUTING

}
