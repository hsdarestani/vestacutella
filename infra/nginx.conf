events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 128m;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/certs/cutella/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cutella/privkey.pem;
    return 444;
  }

  server {
    listen 80;
    server_name cutellashop.ir www.cutellashop.ir;
    return 301 https://cutellashop.ir$request_uri;
  }

  server {
    listen 443 ssl;
    server_name cutellashop.ir www.cutellashop.ir;

    ssl_certificate /etc/nginx/certs/cutella/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cutella/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://cutella:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  server {
    listen 80;
    server_name vesta-cosmetics.ir www.vesta-cosmetics.ir;
    return 301 https://vesta-cosmetics.ir$request_uri;
  }

  server {
    listen 443 ssl;
    server_name vesta-cosmetics.ir www.vesta-cosmetics.ir;

    ssl_certificate /etc/nginx/certs/vesta/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vesta/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://vesta:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
