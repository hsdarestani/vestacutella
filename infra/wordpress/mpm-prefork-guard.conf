# VestaCutella memory-safe Apache prefork defaults for the 6 GiB host.
# The live service guard additionally enforces and monitors these values.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 6
    MaxConnectionsPerChild 400
</IfModule>
