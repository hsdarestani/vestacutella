name: Vesta fix two blocked washbag orders via exact ERP detail transfer from unused draft
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-restore-unmapped-washbag-70337-to-real-erp-detail-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-exact-washbag-70337-draft-remap
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and stage exact single ERP detail remap
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l scripts/vesta-transfer-washbag-mapping-draft-103568-to-variation-70337-20261117.php
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-transfer-washbag-mapping-draft-103568-to-variation-70337-20261117.php "root@$HOST:/tmp/vesta-remap-washbag-70337.php"
      - name: Verify no past orders on dormant draft, exact matching ERP detail and full Woo DB snapshot
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-bazara-repair-full-catalog.lock
          flock -n 9
          backup=/srv/backups/vesta-exact-draft-washbag-70337-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$backup"
          docker exec -i -e VC_WASHBAG_REMAP_COMMIT=no vc-vesta php -d display_errors=0 -d memory_limit=512M < /tmp/vesta-remap-washbag-70337.php | tee "$backup/dryrun.log"
          grep -Fq 'WASHBAG_REMAP_DRYRUN_NO_WRITES=yes' "$backup/dryrun.log"
          docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw' > "$backup/before-two-products-and-links.tsv" <<'SQL'
          SELECT meta_id,post_id,meta_key,meta_value FROM wp_postmeta WHERE post_id IN (103568,70337) ORDER BY meta_id;
          SELECT ProductId,ProductDetailId,Properties,Deleted FROM wp_bazara_product_details WHERE ProductId=10685058;
          SQL
          (cd "$backup";sha256sum before-two-products-and-links.tsv > SHA256SUMS;sha256sum -c SHA256SUMS)
          echo 'WASHBAG_PRE_REMAP_EXACT_METADATA_BACKUP_VERIFIED=yes'
          docker exec -i -e VC_WASHBAG_REMAP_COMMIT=yes -e VC_WASHBAG_REMAP_BACKUP_VERIFIED=yes vc-vesta php -d display_errors=0 -d memory_limit=768M < /tmp/vesta-remap-washbag-70337.php | tee "$backup/result.log"
          grep -Fq 'WASHBAG_70337_EXACT_GOOD_AND_DETAIL_MOVED_FROM_UNUSED_DRAFT_READBACK_VERIFIED=yes' "$backup/result.log"
          grep -Fq 'WASHBAG_PRICE_STOCK_IMAGES_AND_ERP_INVOICES_UNCHANGED=yes' "$backup/result.log"
          echo 'WASHBAG_70337_ONE_PRECISE_MAPPING_MOVED_NO_OTHER_PRODUCTS_WRITTEN=yes'
          REMOTE
      - name: Independent production readback and public storefronts
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          if((int)get_post_meta(70337,'mahak_id',true)!==10685058 ||
            (int)get_post_meta(70337,'mahak_product_detail_id',true)!==12183120 ||
            metadata_exists('post',103568,'mahak_id') ||
            metadata_exists('post',103568,'mahak_product_detail_id'))exit(41);
          $refs=(int)$wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->postmeta} WHERE meta_key='mahak_product_detail_id' AND meta_value='12183120'");
          if($refs!==1||!get_option('vcar_sender_enabled',false))exit(42);
          echo "WASHBAG_CORRECT_PUBLISHED_VARIANT_MAPPED_WITH_UNIQUE_DETAIL=yes\n";
          echo "OUTBOX_SENDER_PRESERVED_GUARDED=yes\n";
          PHP
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl -LsS --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code";test "$code" = 200
          done
