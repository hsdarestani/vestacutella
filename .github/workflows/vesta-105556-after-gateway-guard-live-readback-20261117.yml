name: Vesta exact 105556 live outbox and cloud readback after gateway identity fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-105556-after-gateway-guard-live-readback-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Examine existing protected queue, remote invoice status, coupon and receipt for exactly one order
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $id=105556;$o=wc_get_order($id);
          if(!$o||!class_exists('Vesta_Accounting_Reliability'))exit(11);
          $settings=get_option('bazara_visitor_settings',[]);
          $bank=vcar_bank($settings,$o->get_payment_method());
          $q=$wpdb->get_row($wpdb->prepare('SELECT state,reason,attempts,submitted_at,remote_id,next_attempt FROM '.Vesta_Accounting_Reliability::table().' WHERE order_id=%d',$id),ARRAY_A);
          $api=new BazaraApi(true);$cloud=Vesta_Accounting_Reliability::cloud($api);
          $inv=$cloud['orders'][$id]??[];
          echo 'POST_GUARD_105556='.json_encode([
            'order_id'=>$id,'buyer_id'=>(int)$o->get_customer_id(),
            'erp_person_id'=>(int)get_user_meta((int)$o->get_customer_id(),'mahak_id',true),
            'real_name_verified'=>vcar_identity_guard($o)==='',
            'preflight'=>Vesta_Accounting_Reliability::preflight($o,$bank)?:'verified',
            'gateway'=>$o->get_payment_method(),'paid'=>(bool)$o->get_date_paid(),
            'total_toman'=>(float)$o->get_total(),'discount_toman'=>(float)$o->get_discount_total(),
            'outbox'=>$q,'cloud_invoice_count'=>count($inv),
            'vendor_cache_rows'=>(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->prefix}bazara_orders WHERE OrderClientId=%d",$id)),
            'sender_enabled'=>(bool)get_option('vcar_sender_enabled',false)
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          foreach($inv as $row){
            $erp=(int)($row['OrderId']??0);
            $reason=vcar_verify($o,$row,$cloud['details'][$erp]??[],$cloud['receipts'][$erp]??[],$bank,$cloud['transfers'],(int)($o->get_meta('_vcar_money_multiplier')?:10));
            echo 'POST_GUARD_105556_INVOICE='.json_encode([
              'invoice_id'=>$erp,'person_correct'=>(int)($row['PersonId']??0)===(int)get_user_meta((int)$o->get_customer_id(),'mahak_id',true),
              'financial_verification'=>$reason?:'verified',
              'receipts'=>count($cloud['receipts'][$erp]??[])
            ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          echo 'POST_GUARD_READBACK_NO_WRITES=yes'.PHP_EOL;
          PHP
