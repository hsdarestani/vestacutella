name: Reconcile five Shopino paid orders with dedicated ERP bank
on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-vesta-shopino-five-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Serially reconcile five Shopino paid invoices to existing bank 471168 with cloud verification
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M -d max_execution_time=0' \
            < scripts/reconcile-vesta-five-shopino-20261112.php
