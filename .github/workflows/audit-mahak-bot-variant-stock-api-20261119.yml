name: Audit Mahak variant and stock write APIs for unified bot
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-mahak-bot-variant-stock-api-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read Bazara methods and cloud export property definitions without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara')
          paths=list(root.rglob('*.php'))
          print('AUDIT_PHP_FILES=',len(paths))
          matches=[]
          for p in paths:
            try:
              content=p.read_text(encoding='utf-8',errors='replace')
            except:continue
            for n,line in enumerate(content.splitlines(),1):
              if re.search(r'function\s+[A-Za-z_]*(warehouse|inventory|factor|receipt|stock|asset|store|product|property|feature)[A-Za-z_]*\s*\(',line,re.I):
                matches.append([str(p.relative_to(root)),n,re.sub(r'\s+',' ',line.strip())[:185]])
          print('AUDIT_RELEVANT_API_METHODS='+json.dumps(matches[:95],ensure_ascii=False))
          src=root/'classes/class.bazara.api.php'
          if src.exists():
            a=src.read_text(encoding='utf-8',errors='replace').splitlines()
            for n,line in enumerate(a,1):
              if re.search(r'function\s+(set_all_data|get_all_data|get_.*data|save.*)\s*\(',line,re.I):
                out=[]
                for x in a[n-1:n+32]:
                  if re.search(r'token|password|key|authorization|secret|base_url|url',x,re.I):continue
                  out.append(x.strip()[:165])
                print('AUDIT_API_FN='+str(n)+' '+json.dumps(out,ensure_ascii=False))
          print('AUDIT_NO_MUTATIONS=yes')
          PY
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(250);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $api=vmb_api();$r=$api->get_all_data('',[
            'fromProductVersion'=>0,
            'fromProductDetailVersion'=>0,
            'fromProductPropertyVersion'=>0,
            'fromStoreVersion'=>0,
          ]);
          if(!is_array($r)||empty($r['success']))exit(51);
          $cat=$r['message']??[];
          $info=[];
          foreach($cat as $key=>$value){
            if(!is_array($value))continue;
            $inf=['count'=>count($value)];
            if(preg_match('/propert|color|varia|stock|store|warehouse|receipt|inventory|factor|asset|product|unit/i',$key)){
              $sample=array_slice($value,0,2);
              $inf['sample_fields']=array_map('array_keys',$sample);
              if(preg_match('/propert|store|warehouse/i',$key))
                 $inf['samples']=$sample;
            }
            $info[$key]=$inf;
          }
          echo 'AUDIT_CLOUD_MODEL_KEYS='.wp_json_encode($info,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $pids=[10755492,10684982];$matches=[];
          foreach(($cat['ProductDetails']??[]) as $d){
            if(in_array((int)($d['ProductId']??0),$pids,true) && empty($d['Deleted'])){
              $matches[]=[
                'productId'=>(int)$d['ProductId'],'detailId'=>(int)$d['ProductDetailId'],
                'detailCode'=>$d['ProductDetailCode']??null,
                'properties'=>$d['Properties']??null,
                'price1'=>$d['Price1']??null,
                'asset_count1'=>$d['Count1']??null
              ];
            }
          }
          echo 'AUDIT_LIVE_VARIANT_DETAIL_SAMPLES='.wp_json_encode($matches,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'AUDIT_MAHAK_NO_WRITES=yes'.PHP_EOL;
          PHP
          REMOTE
