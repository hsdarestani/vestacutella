name: Verify native Mahak bot queue and auto-completion hooks
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-vesta-unified-mahak-auto-queue-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check installed product source, editor stage, ActionScheduler worker and native sync status without mutations
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(180);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php'; global $wpdb;
          $need=[
            'vmb_submit','vmb_status','vmb_template',
            'vesta_mcb_stage','vesta_mcb_pending_status',
            'vesta_mcb_apply_pending_worker','vesta_mcb_schedule_pending',
            'vesta_mhi_auto_run','vesta_mhi_auto_schedule',
          ];
          foreach($need as $name)if(!function_exists($name))exit(50);
          if(!has_action('vesta_mcb_apply_pending') ||
             !has_action('bazara_run_product_sync') ||
             !function_exists('as_schedule_single_action') ||
             !function_exists('as_next_scheduled_action'))exit(51);
          $cfg=get_option('bazara_visitor_settings',[]);
          if(($cfg['selectCurrencySoftware']??'')!=='toman'||
             ($cfg['selectCurrencyPlugin']??'')!=='toman'||
             ($cfg['publishStatus']??'')!=='draft')exit(52);
          $status=vesta_mcb_pending_status(['request_key'=>str_repeat('0',32)]);
          if(($status['status']??'')!=='not_staged')exit(53);
          $n=count((array)get_option('vesta_mcb_pending_index',[]));
          echo 'UNIFIED_MAHAK_PENDING_QUEUE_COUNT='.$n.PHP_EOL;
          echo 'UNIFIED_MAHAK_AUTO_WORKER_REGISTERED=yes'.PHP_EOL;
          echo 'UNIFIED_MAHAK_CREATION_SOURCE_BRIDGE_READY=yes'.PHP_EOL;
          echo 'UNIFIED_MAHAK_TOMAN_DRAFT_POLICY=yes'.PHP_EOL;
          echo 'UNIFIED_MAHAK_CONTENT_AUTH_STATUS_READONLY=yes'.PHP_EOL;
          echo 'UNIFIED_MAHAK_NO_PRODUCT_WRITES=yes'.PHP_EOL;
          PHP
