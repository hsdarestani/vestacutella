name: Repair 18 exact Vesta variant mappings safely
on:
  push:
    branches: [main]
    paths: [".github/workflows/repair-vesta-bazara-28-exact-variations-20261111.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Backup, exact-match dry run, repair, read-back and health check
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
           scripts/repair-vesta-18-normalized-exact-bazara-variations-20261114.php \
           "root@$HOST:/tmp/repair-vesta-18-normalized-exact-bazara-variations-20261114.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
           "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/run/lock/vesta-bazara-repair-18-variations.lock
          flock -n 9 || exit 11
          backup=/srv/backups/vesta-bazara-18-verified-variants-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          ids=76565,85731,36675,36673,54111,36669,42932,37112,87719,87720,37737,42933,102363,94710,54139,39916,35812,46843
          echo "BACKUP_DIR=$backup"
          docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw' > "$backup/variations-meta-before.tsv" <<SQL
          SELECT post_id,meta_key,meta_value FROM wp_postmeta
          WHERE post_id IN ($ids) AND meta_key IN ('mahak_id','mahak_product_detail_id') ORDER BY post_id,meta_key;
          SQL
          echo "EXISTING_METADATA_SNAPSHOT_SAVED=yes"
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "BEFORE=$host HTTP=$code";test "$code" = 200
          done
          echo '===== STRICT VERIFICATION DRY RUN ====='
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M < /tmp/repair-vesta-18-normalized-exact-bazara-variations-20261114.php | tee "$backup/mapping-run.log"
          grep -Fx 'EXACT_VARIATIONS_VALIDATED=18' "$backup/mapping-run.log"
          grep -Fx 'DRY_RUN_ONLY=yes' "$backup/mapping-run.log"
          echo '===== COMMIT ONLY STRICT VERIFIED EXACT MATCHES ====='
          docker exec -e VC_MAP_COMMIT=yes -i vc-vesta php -d display_errors=0 -d memory_limit=384M < /tmp/repair-vesta-18-normalized-exact-bazara-variations-20261114.php | tee "$backup/map-apply.log"
          grep -Fx 'MAPPING_REPAIR_VERIFIED=yes' "$backup/map-apply.log"
          echo '===== READ BACK ====='
          docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw' <<SQL
          SELECT 'VERIFIED_MAPPING_ROWS',COUNT(*),COUNT(DISTINCT post_id)
          FROM wp_postmeta WHERE post_id IN ($ids) AND meta_key IN ('mahak_id','mahak_product_detail_id');
          SQL
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "AFTER=$host HTTP=$code";test "$code" = 200
          done
          echo "REPAIR_18_EXACT_VARIANTS_DEPLOY_COMPLETE=yes"
          echo "UNVERIFIED_VARIANTS_NOT_TOUCHED=yes"
          echo "NO_ORDER_REPLAYS_IN_THIS_JOB=yes"
          REMOTE
