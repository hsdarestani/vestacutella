name: Audit Vesta Bazaar sync scheduling (read-only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-vesta-bazaar-sync-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-bazaar-cron-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect current production scheduling without modifications
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C
          echo "AUDIT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if systemctl is-active --quiet cron; then echo HOST_CRON_ACTIVE=yes;else echo HOST_CRON_ACTIVE=no;fi
          C=/etc/cron.d/vestacutella-wp-cron
          if [[ -r "$C" ]];then
            echo VESTA_CRON_FILE_PRESENT=yes
            awk '/vesta-wp-cron.lock/ {n++;if($1=="*"&&$2=="*"&&$3=="*"&&$4=="*"&&$5=="*") every++;if(index($0,"curl")) https++;if(index($0,"docker exec")) cli++}END{printf "VESTA_CRON_ENTRIES=%d\nVESTA_EVERY_MINUTE=%d\nVESTA_HTTPS_ENTRIES=%d\nVESTA_CLI_ENTRIES=%d\n",n,every,https,cli}' "$C"
          else echo VESTA_CRON_FILE_PRESENT=no;fi
          if [[ -f /var/log/vesta-wp-cron-errors.log ]];then
             echo "CRON_ERROR_LINE_COUNT=$(wc -l </var/log/vesta-wp-cron-errors.log)"
             echo "CRON_ERROR_LOG_MTIME=$(date -u -r /var/log/vesta-wp-cron-errors.log +%Y-%m-%dT%H:%M:%SZ)"
          else echo CRON_ERROR_LOG_PRESENT=no;fi
          echo "VESTA_CONTAINER_UP=$(docker inspect -f '{{.State.Running}}' vc-vesta)"
          echo "VESTA_DB_UP=$(docker inspect -f '{{.State.Running}}' vc-db-vesta)"
          echo '===== RELEVANT PLUGIN DIRECTORIES ====='
          find /srv/vestacutella/runtime/vesta/wp-content/plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -Ei 'bazar|bazaar|maha|market|sync|inventory|connector|erp' | head -50 || true
          db() { docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4'; }
          echo '===== ACTION SCHEDULER COUNTS AND AGE ====='
          cat <<'SQL' | db
          SELECT status,COUNT(*) AS actions FROM wp_actionscheduler_actions GROUP BY status ORDER BY actions DESC;
          SELECT 'PENDING_OLDER_THAN_5MIN',COUNT(*) FROM wp_actionscheduler_actions WHERE status='pending' AND scheduled_date_gmt < UTC_TIMESTAMP() - INTERVAL 5 MINUTE;
          SELECT 'PENDING_OLDER_THAN_60MIN',COUNT(*) FROM wp_actionscheduler_actions WHERE status='pending' AND scheduled_date_gmt < UTC_TIMESTAMP() - INTERVAL 60 MINUTE;
          SELECT 'IN_PROGRESS_OLDER_THAN_10MIN',COUNT(*) FROM wp_actionscheduler_actions WHERE status='in-progress' AND last_attempt_gmt < UTC_TIMESTAMP() - INTERVAL 10 MINUTE;
          SELECT 'LATEST_ACTION_LOG',MAX(log_date_gmt) FROM wp_actionscheduler_logs;
          SQL
          echo '===== OVERDUE HOOKS TOP 30 ====='
          cat <<'SQL' | db
          SELECT hook,status,COUNT(*) AS total,MIN(scheduled_date_gmt) AS earliest_due
          FROM wp_actionscheduler_actions WHERE status IN ('pending','in-progress') AND scheduled_date_gmt < UTC_TIMESTAMP()
          GROUP BY hook,status ORDER BY total DESC LIMIT 30;
          SQL
          echo '===== RELATED INTEGRATION HOOKS ====='
          cat <<'SQL' | db
          SELECT hook,status,COUNT(*) AS total,MIN(scheduled_date_gmt) AS oldest,MAX(last_attempt_gmt) AS recent_attempt
          FROM wp_actionscheduler_actions WHERE hook REGEXP 'bazar|bazaar|market|maha|stock|sync|inventory|erp'
          GROUP BY hook,status ORDER BY total DESC LIMIT 35;
          SQL
          echo '===== REGISTERED WP CRON HOOKS ====='
          db <<'SQL' | docker exec -i vc-vesta php -d memory_limit=256M -r '
          $raw=trim(stream_get_contents(STDIN));$cr=@unserialize($raw,["allowed_classes"=>false]);
          if(!is_array($cr)){echo "CRON_OPTION_PARSE_FAILED\n";exit;}
          $now=time();$total=0;$due=0;$matches=[];
          foreach($cr as $ts=>$hooks){if(!is_numeric($ts)||!is_array($hooks))continue;
            foreach($hooks as $hook=>$jobs){$num=is_array($jobs)?count($jobs):0;$total+=$num;if((int)$ts<$now)$due+=$num;
              if(preg_match("/bazar|bazaar|market|maha|stock|sync|inventory|erp/i",$hook)){
                if(!isset($matches[$hook]))$matches[$hook]=[0,(int)$ts];
                $matches[$hook][0]+=$num;$matches[$hook][1]=min($matches[$hook][1],(int)$ts);
              }
            }
          }
          echo "WP_CRON_TOTAL=$total\nWP_CRON_DUE=$due\n";
          foreach($matches as $name=>$entry){echo preg_replace("/[^a-zA-Z0-9_:.-]/","?",$name)." count=".$entry[0]." earliest_utc=".gmdate("Y-m-d H:i:s",$entry[1])."\n";}
          '
          SELECT option_value FROM wp_options WHERE option_name='cron' LIMIT 1;
          SQL
          echo '===== BAZARA FAILURE LOG CATEGORIES (NO RAW MESSAGES) ====='
          cat <<'SQL' | db
          SELECT CASE
            WHEN LOWER(l.message) LIKE '%timeout%' OR LOWER(l.message) LIKE '%timed out%' THEN 'timeout'
            WHEN LOWER(l.message) LIKE '%canceled%' THEN 'canceled'
            WHEN LOWER(l.message) LIKE '%no callbacks%' THEN 'missing_handler'
            WHEN LOWER(l.message) LIKE '%fatal%' THEN 'fatal'
            WHEN LOWER(l.message) LIKE '%exception%' THEN 'exception'
            WHEN LOWER(l.message) LIKE '%failed%' THEN 'failed_generic'
            WHEN LOWER(l.message) LIKE '%error%' THEN 'error_generic'
            ELSE 'other' END AS message_category,COUNT(*) AS total,
            MIN(l.log_date_gmt) oldest,MAX(l.log_date_gmt) newest
          FROM wp_actionscheduler_logs l
          JOIN wp_actionscheduler_actions a ON a.action_id=l.action_id
          WHERE a.hook='bazara_run_sending_orders' AND a.status='failed'
          GROUP BY message_category ORDER BY total DESC;
          SQL
          echo '===== LAST 10 FAILED BAZARA SEND ACTION IDS / TIMESTAMPS ====='
          cat <<'SQL' | db
          SELECT action_id,scheduled_date_gmt,last_attempt_gmt,attempts
          FROM wp_actionscheduler_actions WHERE hook='bazara_run_sending_orders' AND status='failed'
          ORDER BY last_attempt_gmt DESC LIMIT 10;
          SQL
          echo '===== HOST CRON ERROR CODE FREQUENCIES ====='
          if [[ -f /var/log/vesta-wp-cron-errors.log ]];then
            tail -n 100 /var/log/vesta-wp-cron-errors.log |
            grep -oE 'curl: \([0-9]+\)' | sort | uniq -c || true
          fi
          echo '===== WP CLI PRESENCE ====='
          docker exec vc-vesta sh -c 'if command -v wp >/dev/null;then echo WP_CLI_PRESENT=yes;else echo WP_CLI_PRESENT=no;fi'
          echo '===== BAZARA SCHEDULING REFERENCES ====='
          grep -RlnE 'bazara_run_sending_orders|bazara_run_product_sync|action_scheduler_queue_runner_batch_size|as_schedule_recurring_action' /srv/vestacutella/runtime/vesta/wp-content/plugins/bazara --include='*.php' | sed 's@.*/plugins/bazara/@bazara/@' | head -25 || true
          echo '===== CRON OPTION DECODE BASE64 ====='
          db <<'SQL' | docker exec -i vc-vesta php -d memory_limit=256M -r '
          $encoded=trim(stream_get_contents(STDIN));$lines=explode("\n",$encoded);$encoded=implode("",array_slice($lines,1));
          $data=@unserialize(base64_decode($encoded),["allowed_classes"=>false]);
          if(!is_array($data)){echo "WP_CRON_BASE64_PARSE_FAILED\n";exit(0);}
          $now=time();$due=0;$all=0;
          foreach($data as $t=>$hooks){if(!is_numeric($t)||!is_array($hooks))continue;
            foreach($hooks as $hook=>$events){$n=is_array($events)?count($events):0;$all+=$n;if((int)$t<$now)$due+=$n;
            if(preg_match("/bazar|bazaar|market|maha|sync|inventory/i",$hook))echo "MATCHED_HOOK=".preg_replace("/[^a-zA-Z0-9_:.-]/","?",$hook)." due_utc=".gmdate("Y-m-d H:i:s",(int)$t)." num=$n\n";}
          }
          echo "WP_CRON_EVENTS=$all WP_CRON_OVERDUE=$due\n";'
          SELECT TO_BASE64(option_value) FROM wp_options WHERE option_name='cron' LIMIT 1;
          SQL
          echo '===== SYSTEM CAPACITY ====='
          uptime
          free -m | head -2
          echo '===== BAZARA REGISTRATION LINES (NO KEYS OR CONFIG) ====='
          grep -nE 'bazara_run_sending_orders|bazara_run_product_sync|as_schedule_recurring_action|as_schedule_single_action|as_enqueue_async_action' \
            /srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/functions.php |
            sed -E 's@https?://[^[:space:]'"'"'"]+@[URL]@g;s@(["'"'"'])[^"'"'"']{35,}\1@[STRING]@g' |
            head -45 || true
          echo '===== BAZARA ACTION SCHEDULE SHAPES ====='
          cat <<'SQL' | db
          SELECT hook,status,LEFT(schedule,95) AS schedule_prefix,COUNT(*) AS total
          FROM wp_actionscheduler_actions WHERE hook IN ('bazara_run_sending_orders','bazara_run_product_sync')
          GROUP BY hook,status,schedule_prefix ORDER BY hook,status,total DESC LIMIT 20;
          SQL
          echo '===== ACTION LOG TEMPLATE CATEGORIES ====='
          cat <<'SQL' | db
          SELECT CASE
            WHEN LOWER(message) LIKE '%started%' THEN 'started'
            WHEN LOWER(message) LIKE '%completed%' THEN 'completed'
            WHEN LOWER(message) LIKE '%failed%' THEN 'failed'
            WHEN LOWER(message) LIKE '%timeout%' THEN 'timeout'
            WHEN LOWER(message) LIKE '%wp cron%' THEN 'wp_cron'
            WHEN LOWER(message) LIKE '%async%' THEN 'async'
            WHEN LOWER(message) LIKE '%registered%' THEN 'registered'
            ELSE 'not_english_template' END AS category,
            COUNT(*) AS total, MAX(log_date_gmt) AS last_seen
          FROM wp_actionscheduler_logs
          WHERE action_id IN (SELECT action_id FROM wp_actionscheduler_actions WHERE hook='bazara_run_sending_orders' AND status='failed')
          GROUP BY category ORDER BY total DESC;
          SQL
          echo '===== BAZARA HANDLER STRUCTURE (NON-SENSITIVE KEYWORDS ONLY) ====='
          python3 - <<'PY'
          import re
          p='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/functions.php'
          s=open(p,encoding='utf8',errors='replace').read().splitlines()
          for name in ('send_bazara_orders','bazara_run_product_synchronize'):
              matches=[(i,line) for i,line in enumerate(s) if re.search(r'^\s*function\s+'+re.escape(name)+r'\s*\(',line)]
              print('FUNCTION',name,'declarations',len(matches))
              for i,_ in matches[:1]:
                  print('LINE',i+1)
                  brace=0;started=False;body=[]
                  for j in range(i,min(i+900,len(s))):
                      l=s[j];brace+=l.count('{')-l.count('}')
                      if '{' in l:started=True
                      body.append(l)
                      if started and brace<=0:break
                  b='\n'.join(body)
                  print('BODY_LINES',len(body))
                  words=('wp_remote_post','wp_remote_get','wp_remote_request','curl_init','curl_exec','timeout','sleep','usleep','get_orders','wc_get_orders','get_posts','foreach','while','wp_die','wp_send_json','wp_remote_retrieve_response_code','as_schedule','wp_schedule','wp_json_encode','is_wp_error','try','catch','throw','return')
                  for word in words:
                      count=len(re.findall(r'\b'+re.escape(word)+r'\b',b,re.I))
                      if count:print(word,count)
                  for m in re.finditer(r'["'+"']"+r'(https?://[^"'+ "'" +r'\s]+)',b):
                      host=re.search(r'https?://([^/]+)',m.group(1))
                      if host:print('REMOTE_HOST_PRESENT=yes')
          PY
          echo '===== DURATION DISTRIBUTION FOR FAILED BAZARA ORDER ACTIONS ====='
          cat <<'SQL' | db
          SELECT CASE WHEN TIMESTAMPDIFF(SECOND,MIN(l.log_date_gmt),MAX(l.log_date_gmt))>=300 THEN '300s_plus'
          WHEN TIMESTAMPDIFF(SECOND,MIN(l.log_date_gmt),MAX(l.log_date_gmt))>=120 THEN '120_to_299s'
          WHEN TIMESTAMPDIFF(SECOND,MIN(l.log_date_gmt),MAX(l.log_date_gmt))>=30 THEN '30_to_119s'
          ELSE 'below_30s' END AS duration_bucket,
          COUNT(DISTINCT a.action_id) actions
          FROM wp_actionscheduler_actions a JOIN wp_actionscheduler_logs l ON a.action_id=l.action_id
          WHERE a.hook='bazara_run_sending_orders' AND a.status='failed'
          GROUP BY a.action_id
          ORDER BY a.action_id DESC LIMIT 20;
          SQL
          echo '===== SCHEDULER GROUP COUNTS ====='
          cat <<'SQL' | db
          SELECT g.slug,a.hook,a.status,COUNT(*) num FROM wp_actionscheduler_actions a JOIN wp_actionscheduler_groups g ON g.group_id=a.group_id
          WHERE a.hook IN ('bazara_run_sending_orders','bazara_run_product_sync') GROUP BY g.slug,a.hook,a.status;
          SQL
          echo '===== BAZARA ORDER DISPATCH CALL GRAPH (IDENTIFIERS ONLY) ====='
          python3 - <<'PY'
          import re,os
          root='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara'
          files=[]
          for base,dirs,fs in os.walk(root):
            for f in fs:
              if f.endswith('.php'):
                p=os.path.join(base,f)
                try:s=open(p,encoding='utf8',errors='replace').read()
                except:continue
                files.append((p,s))
          found=set()
          frontier=['send_bazara_orders']
          for depth in range(3):
            nxt=[]
            for func in frontier[:20]:
              if func in found:continue
              found.add(func)
              pat=r'\bfunction\s+'+re.escape(func)+r'\s*\('
              for path,s in files:
                m=re.search(pat,s)
                if not m:continue
                begin=s.find('{',m.end());brace=1;idx=begin+1
                while idx<len(s) and brace:
                  brace+=1 if s[idx]=='{' else (-1 if s[idx]=='}' else 0)
                  idx+=1
                body=s[begin+1:idx-1]
                calls=re.findall(r'(?<!function\s)(?<!\$)([A-Za-z_][A-Za-z0-9_]*)\s*\(',body)
                methods=re.findall(r'->([A-Za-z_][A-Za-z0-9_]*)\s*\(',body)
                print('DEPTH',depth,'FUNCTION',func,'FILE',os.path.relpath(path,root),'BODY_LINES',body.count('\n')+1,'CALLS',','.join(sorted(set(calls))[:35]),'METHODS',','.join(sorted(set(methods))[:35]))
                for candidate in calls:
                  if candidate.startswith(('bazara','send_','sync_','get_bazara','order_')):nxt.append(candidate)
                break
            frontier=nxt
          print('PHP_FILES',len(files))
          PY
          echo '===== BAZARA SCHEDULE INTERVALS FROM RECENT ACTIONS ====='
          cat <<'SQL' | db
          SELECT hook,status,MAX(action_id) as latest_id,
          MAX(scheduled_date_gmt) as latest_scheduled,
          SUBSTRING_INDEX(SUBSTRING_INDEX(REPLACE(REPLACE(HEX(schedule),'00',''),'696E74657276616C',1),'',1),'',1) as placeholder
          FROM wp_actionscheduler_actions WHERE hook IN ('bazara_run_sending_orders','bazara_run_product_sync')
          GROUP BY hook,status ORDER BY hook,status;
          SQL
          echo '===== BAZARA API ORDER SENDER STRUCTURE ====='
          python3 - <<'PY'
          import re,os,collections
          root='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara'
          src=[]
          for d,_,fs in os.walk(root):
              for fn in fs:
                  if fn.endswith('.php'):
                      p=os.path.join(d,fn)
                      try:s=open(p,encoding='utf8',errors='replace').read()
                      except:continue
                      src.append((p,s))
          todo=['start_sync_orders'];done=set()
          for depth in range(3):
              next_todo=[]
              for method in todo[:30]:
                  if method in done:continue
                  done.add(method)
                  for p,s in src:
                      m=re.search(r'\bfunction\s+'+re.escape(method)+r'\s*\(',s)
                      if not m:continue
                      start=s.find('{',m.end());n=1;i=start+1
                      while i<len(s) and n:
                          n+=int(s[i]=='{')-int(s[i]=='}');i+=1
                      body=s[start+1:i-1]
                      calls=re.findall(r'->([A-Za-z_][A-Za-z0-9_]*)\s*\(',body)
                      static_calls=re.findall(r'(?:::)([A-Za-z_][A-Za-z0-9_]*)\s*\(',body)
                      funcs=re.findall(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*\(',body)
                      print('DEPTH',depth,'METHOD',method,'FILE',os.path.relpath(p,root),'LINES',body.count('\n')+1)
                      print('METHOD_CALLS',','.join(sorted(set(calls))[:55]),'STATIC_CALLS',','.join(sorted(set(static_calls))[:40]))
                      for w in ['curl_exec','curl_setopt','wp_remote_get','wp_remote_post','wp_remote_request','wc_get_orders','get_posts','sleep','usleep','timeout','foreach','while','wpdb','wp_schedule','as_schedule','update_option','add_option','get_option','wpdb','break','return','try','catch']:
                          k=len(re.findall(r'\b'+w+r'\b',body,re.I))
                          if k:print('KEYWORD',w,k)
                      for candidate in calls+static_calls:
                          if candidate not in ('get_option','update_option','get_posts','get_orders','get','post','request','send','log','error','success','get_id','get_meta','is_wp_error','get_message','json_encode','add','set','get_product'):
                              next_todo.append(candidate)
                      break
              todo=next_todo
          PY
          echo '===== BAZARA SEND CONTROL FLOW SANITIZED ====='
          python3 - <<'PY'
          import re
          p='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php'
          text=open(p,encoding='utf8',errors='replace').read()
          for name in ('start_sync_orders','http_post','bazara_save_order'):
              m=re.search(r'function\s+'+name+r'\s*\(',text)
              if not m:continue
              i=text.find('{',m.end());depth=1;j=i+1
              while j<len(text) and depth:
                  depth+=(text[j]=='{')-(text[j]=='}');j+=1
              chunk=text[i+1:j-1]
              print('METHOD',name,'START_LINE',text[:i].count('\n')+1)
              if name=='bazara_save_order':
                  print('ORDER_SAVER_LINES',chunk.count('\n')+1,'HTTP_METHOD_CALLS',len(re.findall(r'->(?:http_post|set_all_data|login_token)\s*\(',chunk)))
                  continue
              start=text[:i].count('\n')
              for k,line in enumerate(chunk.splitlines()):
                  if not re.search(r'\b(if|else|foreach|for|while|break|continue|return|limit|count|posts_per_page|wc_get_orders|WP_Query|bazara_save_order|get_posts|post_status|meta_query|update_option|get_option|timeout|wp_remote_request|http_post|login_token)\b',line,re.I):continue
                  clean=re.sub(r"'(?:\\.|[^'\\])*'|\"(?:\\.|[^\"\\])*\"",'[STR]',line)
                  clean=re.sub(r'\s+',' ',clean).strip()
                  if clean:print('L',start+k+2,clean[:160])
          PY
          echo '===== BAZARA TABLE NAMES / NUMERIC OPTIONS ONLY ====='
          cat <<'SQL' | db
          SHOW TABLES LIKE '%bazar%';
          SELECT option_name,CASE WHEN option_value NOT REGEXP '[^0-9]' AND LENGTH(option_value)>0 THEN option_value ELSE '[non-numeric]' END AS numeric_value
          FROM wp_options WHERE option_name LIKE '%bazara%' AND (option_name LIKE '%cron%' OR option_name LIKE '%minute%' OR option_name LIKE '%interval%')
          LIMIT 25;
          SQL
          echo '===== BAZARA ORDER SELECTION / CURSOR FLOW ====='
          python3 - <<'PY'
          import re
          p='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php'
          lines=open(p,encoding='utf8',errors='replace').read().splitlines()
          for i in range(2615,2748):
              line=lines[i-1]
              if re.search(r'order|max_id|left_behind|limit|query|result|success|option|wpdb|return|foreach|for\s*\(',line,re.I):
                  s=re.sub(r"'(?:\\.|[^'\\])*'|\"(?:\\.|[^\"\\])*\"",'[STR]',line)
                  s=re.sub(r'\s+',' ',s).strip()
                  if s:print(i,s[:165])
          PY
          echo '===== BAZARA ORDER STORAGE SCHEMA SUMMARY ====='
          cat <<'SQL' | db
          SHOW COLUMNS FROM wp_bazara_orders;
          SELECT 'bazara_order_rows',COUNT(*) FROM wp_bazara_orders;
          SELECT 'woo_legacy_orders',COUNT(*) FROM wp_posts WHERE post_type='shop_order';
          SQL
          echo '===== BAZARA API NETWORK DIAGNOSTICS (NO CREDENTIALS) ====='
          python3 - <<'PY'
          import re,os,urllib.parse
          root='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara'
          hosts=set()
          for d,_,fs in os.walk(root):
            for fn in fs:
              if not fn.endswith('.php'):continue
              try:s=open(os.path.join(d,fn),encoding='utf8',errors='ignore').read()
              except:continue
              for url in re.findall(r'https?://[a-zA-Z0-9_.:-]+',s):
                try:host=urllib.parse.urlsplit(url).hostname
                except:continue
                if host and re.search(r'bazar|api',host,re.I) and not host.startswith('127.') and host!='localhost':hosts.add(host)
          print('BAZARA_API_HOST_COUNT',len(hosts))
          with open('/tmp/vesta-bazara-audit-hosts.txt','w') as p:
            for host in sorted(hosts):
              p.write(host+'\n')
              print('PUBLIC_API_HOST',host)
          PY
          if [[ -s /tmp/vesta-bazara-audit-hosts.txt ]];then
            while IFS= read -r h;do
              echo "HOST_PROBE=$h"
              getent ahostsv4 "$h" >/dev/null && echo 'DNS_RESOLUTION=ok' || echo 'DNS_RESOLUTION=failed'
              curl -k -sS -I --connect-timeout 5 --max-time 9 -o /dev/null -w 'HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}\n' "https://$h/" || echo 'HTTP_PROBE_FAILED'
            done </tmp/vesta-bazara-audit-hosts.txt
          fi
          rm -f /tmp/vesta-bazara-audit-hosts.txt
          echo '===== ORDER QUERY FUNCTION SHAPES ====='
          python3 - <<'PY'
          import re,os
          root='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara'
          targets=['get_orders','get_orders_hpos','get_left_behind_orders_from_limit','get_left_behind_orders_from_limit_hpos']
          for method in targets:
            for d,_,fs in os.walk(root):
              for fn in fs:
                if not fn.endswith('.php'):continue
                p=os.path.join(d,fn)
                try:s=open(p,encoding='utf8',errors='replace').read()
                except:continue
                m=re.search(r'\bfunction\s+'+method+r'\s*\(',s)
                if not m:continue
                a=s.find('{',m.end());n=1;i=a+1
                while i<len(s) and n:
                  n+=(s[i]=='{')-(s[i]=='}');i+=1
                body=s[a+1:i-1]
