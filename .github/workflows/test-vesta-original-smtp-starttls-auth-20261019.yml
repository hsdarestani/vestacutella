name: Test Vesta original SMTP with secure STARTTLS only
on:
  push:
    branches: [main]
    paths:
      - scripts/test-vesta-original-smtp-starttls-auth-20261019.sh
      - .github/workflows/test-vesta-original-smtp-starttls-auth-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/test-vesta-original-smtp-starttls-auth-20261019.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: One SMTP authentication attempt with secure STARTTLS (no messages)
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/test-vesta-original-smtp-starttls-auth-20261019.sh "root@$HOST:/tmp/test-vesta-original-smtp-starttls-auth-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/test-vesta-original-smtp-starttls-auth-20261019.sh'
