name: Apply Vesta resource stability safeguards
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-vesta-stability-20261024.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-resource-stability-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload guarded scripts only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 60 sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/apply-vesta-stability-20261024.sh "root@$HOST:/tmp/apply-vesta-stability-20261024.sh"
          timeout 60 sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-runtime-limits-enforcer-20261024.sh "root@$HOST:/tmp/vesta-runtime-limits-enforcer-20261024.sh"
      - name: Deploy and verify with backup and rollback
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          timeout 380 sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/apply-vesta-stability-20261024.sh'
