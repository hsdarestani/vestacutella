name: Vesta HTTP read-only incident diagnostics
on:
  push:
    branches: [diagnostics/vesta-http-20261125]
    paths: [.github/workflows/vesta-http-incident-20261125.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production service log summaries
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -z "$KNOWN_HOSTS" ]; then echo 'No pinned SSH host key available'; exit 1; fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/incident_key
            chmod 600 ~/.ssh/incident_key
            SSH=(ssh -i ~/.ssh/incident_key -o BatchMode=yes)
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH=(sshpass -e ssh)
          fi
          "${SSH[@]}" -o ConnectTimeout=12 -o StrictHostKeyChecking=yes "root@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== Containers ==='
          docker ps --format '{{.Names}} {{.Status}}'
          echo '=== Incident service error classes (UTC 08:40–08:55) ==='
          for c in $(docker ps --format '{{.Names}}' | grep -Ei 'vesta|nginx|proxy|maria|mysql|redis'); do
            echo "SERVICE=$c"
            docker logs --since 2026-11-25T08:40:00Z --until 2026-11-25T08:55:00Z "$c" 2>&1 | python3 -c 'import sys,re,collections; a=collections.Counter(); patterns={"oom":r"out of memory|oom.kill","timeout":r"timed? ?out|timeout","upstream":r"upstream.*(error|fail|closed|reset)","php_fatal":r"PHP Fatal|Uncaught","db":r"database connection|too many connections|deadlock|server has gone away","workers":r"max_children|worker_connections|resource temporarily unavailable","http_500":r"\s500\s","http_499":r"\s499\s","http_502_504":r"\s50[234]\s"}; n=0; exec("for l in sys.stdin:\n n+=1\n for k,p in patterns.items():\n  if re.search(p,l,re.I): a[k]+=1"); print("lines",n,"classes",dict(a))'
          done
          echo '=== Kernel resource error classes ==='
          journalctl -k --since '2026-11-25 08:40:00 UTC' --until '2026-11-25 08:55:00 UTC' --no-pager 2>/dev/null | grep -Eic 'out of memory|oom.kill|blocked for more than|segfault' || true
          echo '=== Host Nginx error classes ==='
          for f in /var/log/nginx/*error*.log; do
            [ -f "$f" ] || continue
            echo "LOG=$(basename "$f")"
            grep -E '2026/11/25 (08:(4[0-9]|5[0-5])|12:(1[0-9]|2[0-5])):' "$f" | python3 -c 'import sys,re,collections; a=collections.Counter(); n=0; exec("for l in sys.stdin:\n n+=1\n for k,p in {\"timeout\":r\"timed out\",\"upstream\":r\"upstream\",\"connection\":r\"connect\\(\\) failed|reset by peer\",\"worker\":r\"worker_connections\",\"php_fatal\":r\"PHP Fatal|Uncaught\"}.items():\n  if re.search(p,l,re.I): a[k]+=1"); print("lines",n,"classes",dict(a))'
          done
          REMOTE
