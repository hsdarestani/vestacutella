name: Safely reconcile Vesta paid accounting backlog in bounded batches
on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-vesta-seven-paid-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Cloud-existence dry run then bounded verified invoice submission
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          echo '===== CHECK ELIGIBILITY WITHOUT WRITING ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M -d max_execution_time=0' \
            < scripts/reconcile-vesta-new-paid-backlog-20261114.php
          for n in 1 2;do
            echo "===== VERIFIED BACKLOG BATCH=$n ====="
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
              "root@$HOST" 'docker exec -i -e VC_BACKFILL_COMMIT=yes vc-vesta php -d display_errors=0 -d memory_limit=768M -d max_execution_time=0' \
              < scripts/reconcile-vesta-new-paid-backlog-20261114.php
          done
          echo '===== INDEPENDENT CLOUD RECEIPT AND TOTAL AUDIT ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M -d max_execution_time=0' \
            < scripts/audit-vesta-erp-verified-orders-20261114.php
