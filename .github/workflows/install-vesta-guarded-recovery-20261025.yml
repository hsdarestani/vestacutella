name: Activate Vesta guarded recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/install-vesta-guarded-recovery-20261025.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/vesta-guarded-recovery-20261025.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Copy verified script to production
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 60 sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-guarded-recovery-20261025.sh "root@$HOST:/tmp/vesta-guarded-recovery-20261025.sh"
      - name: Install monitoring and guarded recovery
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          timeout 120 sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -n /tmp/vesta-guarded-recovery-20261025.sh && install -m 700 /tmp/vesta-guarded-recovery-20261025.sh /usr/local/sbin/vesta-guarded-recovery && echo "* * * * * root /usr/bin/timeout 110 /usr/local/sbin/vesta-guarded-recovery >/dev/null 2>&1" > /etc/cron.d/vesta-guarded-recovery && chmod 644 /etc/cron.d/vesta-guarded-recovery && systemctl reload cron && echo INSTALL_OK'
