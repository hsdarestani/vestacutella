name: Test real order bot Telegram notification
on:
  push:
    branches: [main]
    paths:
      - "scripts/test-vesta-real-telegram-bot.sh"
      - ".github/workflows/test-vesta-real-telegram-bot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Test configured Telegram bot without touching any order
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/test-vesta-real-telegram-bot.sh "root@$HOST:/tmp/test-vesta-real-telegram-bot.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/test-vesta-real-telegram-bot.sh'
