name: Vesta safe hotfix disable legacy Hesabfa auto product sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vesta-fix-product-publish-hesabfa-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-product-publish-hotfix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Back up and disable only obsolete auto-product sync, smoke-test or rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 7m
          script: |
            set -Eeuo pipefail
            umask 077
            exec 9>/run/lock/vesta-product-publish-hesabfa-hotfix.lock
            flock -w 100 9
            backup=/srv/backups/vesta-hesabfa-product-autosync-20261122.json
            test ! -e "$backup" || { echo 'PREVIOUS_BACKUP_EXISTS_ABORT=yes'; exit 5; }
            function restore() {
              code=$?
              trap - ERR
              if test -s "$backup"; then
                docker exec -i vc-vesta php -d display_errors=0 -r '
                  $_SERVER["HTTP_HOST"]="vesta-cosmetics.ir";$_SERVER["HTTPS"]="on";$_SERVER["SERVER_PORT"]="443";$_SERVER["REQUEST_URI"]="/";
                  require "/var/www/html/wp-load.php";
                  $data=json_decode(stream_get_contents(STDIN),true);
                  if (!is_array($data)) exit(1);
                  $key="ssbhesabfa_do_not_submit_product_automatically";
                  if (!empty($data["exists"])) update_option($key,$data["original"]); else delete_option($key);
                  echo "HESABFA_AUTOPRODUCT_ROLLED_BACK=yes\n";
                ' < "$backup" || true
              fi
              exit "$code"
            }
            trap restore ERR
            docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
            <?php
            error_reporting(E_ERROR|E_PARSE);
            $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';
            $_SERVER['HTTPS']='on';
            $_SERVER['SERVER_PORT']='443';
            $_SERVER['REQUEST_URI']='/';
            require '/var/www/html/wp-load.php';
            $ref=new ReflectionMethod('Ssbhesabfa_Admin','ssbhesabfa_hook_new_product');
            $code=implode('',array_slice(file($ref->getFileName()),$ref->getStartLine()-1,$ref->getEndLine()-$ref->getStartLine()+1));
            if (!preg_match('/get_option\\s*\\(\\s*[\\x27"]([^\\x27"]+)[\\x27"]\\s*,\\s*[\\x27"]([^\\x27"]*)[\\x27"]\\s*\\)\\s*===\\s*[\\x27"]([^\\x27"]*)[\\x27"]/',$code,$m))
              exit(11);
            $key='ssbhesabfa_do_not_submit_product_automatically';
            if($m[1]!==$key) exit(12);
            global $wpdb;
            $exists=(bool)$wpdb->get_var($wpdb->prepare("SELECT option_id FROM `{$wpdb->options}` WHERE option_name=%s LIMIT 1",$key));
            $before=get_option($key,$m[2]);
            $backup=['exists'=>$exists,'original'=>$before,'created_utc'=>gmdate('c')];
            $path='/srv/backups/vesta-hesabfa-product-autosync-20261122.json';
            // This script runs inside the PHP container, where /srv/backups
            // is not mounted. Store the backup on the shared WordPress volume.
            $path='/var/www/html/wp-content/.vesta-hesabfa-autosync-backup-20261122.json';
            if(file_exists($path)) exit(13);
            if(!file_put_contents($path,wp_json_encode($backup),LOCK_EX)) exit(14);
            chmod($path,0600);
            if(!update_option($key,$m[3],false) && get_option($key)!==$m[3]) exit(15);
            if(get_option($key)!==$m[3]) exit(16);
            echo 'HESABFA_AUTO_PRODUCT_SYNC=disabled'.PHP_EOL;
            echo 'LEGACY_HESABFA_PRODUCT_HOOK_GUARD_RETURNS=yes'.PHP_EOL;
            echo 'PRODUCT_DATA_NOT_MODIFIED=yes'.PHP_EOL;
            echo 'BACKUP_STORED_IN_PRIVATE_WORDPRESS_VOLUME=yes'.PHP_EOL;
            PHP
            test -s /srv/vestacutella/runtime/vesta/wp-content/.vesta-hesabfa-autosync-backup-20261122.json
            cp /srv/vestacutella/runtime/vesta/wp-content/.vesta-hesabfa-autosync-backup-20261122.json "$backup"
            chmod 0600 "$backup"
            code=$(curl --noproxy '*' -ksS -m 15 --resolve 'vesta-cosmetics.ir:443:127.0.0.1' -o /dev/null -w '%{http_code}' 'https://vesta-cosmetics.ir/')
            test "$code" = 200
            admin=$(curl --noproxy '*' -ksS -m 15 --resolve 'vesta-cosmetics.ir:443:127.0.0.1' -o /dev/null -w '%{http_code}' 'https://vesta-cosmetics.ir/wp-admin/post-new.php?post_type=product')
            test "$admin" = 302 || test "$admin" = 200
            echo "FRONTEND_SMOKE_HTTP=$code"
            echo "PRODUCT_EDITOR_ROUTE_HTTP=$admin"
            echo "HOTFIX_SUCCESS=yes"
            trap - ERR
