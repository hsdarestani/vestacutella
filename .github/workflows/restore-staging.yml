name: Restore staging

on:
  push:
    branches: [main]
    paths:
      - "scripts/restore-staging.sh"
      - "infra/**"
      - ".github/workflows/restore-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Run restore
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'rm -rf /srv/vestacutella/repo && git clone --depth 1 https://github.com/hsdarestani/vestacutella.git /srv/vestacutella/repo && chmod +x /srv/vestacutella/repo/scripts/restore-staging.sh && /srv/vestacutella/repo/scripts/restore-staging.sh'
