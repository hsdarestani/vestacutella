name: Restore staging

on:
  push:
    branches: [main]
    paths:
      - "scripts/restore-staging.sh"
      - "infra/**"
      - ".github/workflows/restore-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vestacutella-wordpress-restore
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload current deployment files
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          tar -czf /tmp/vestacutella-deploy.tar.gz infra scripts
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/vestacutella-deploy.tar.gz "root@$HOST:/tmp/vestacutella-deploy.tar.gz"
      - name: Run restore
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" '
            set -e
            rm -rf /srv/vestacutella/repo.new
            mkdir -p /srv/vestacutella/repo.new
            tar -xzf /tmp/vestacutella-deploy.tar.gz -C /srv/vestacutella/repo.new
            rm -rf /srv/vestacutella/repo
            mv /srv/vestacutella/repo.new /srv/vestacutella/repo
            chmod +x /srv/vestacutella/repo/scripts/restore-staging.sh
            /srv/vestacutella/repo/scripts/restore-staging.sh
          '
