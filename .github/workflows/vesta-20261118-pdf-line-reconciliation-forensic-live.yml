name: Vesta 96 Mahak desktop invoice exact product identity and Woo accounting fingerprint audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-20261118-pdf-line-reconciliation-forensic-live.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read only inspect Mahak-code identity and paid Woo orders around the desktop PDF time frame
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $example=[];
          foreach([105203,105225,105429,105545,105540,105537] as $id){
            $o=wc_get_order($id);if(!$o)continue;
            $it=[];
            foreach($o->get_items('line_item') as $x){
              $v=$x->get_variation_id()?:$x->get_product_id();
              $p=wc_get_product($v);$parent=$p&&$p->is_type('variation')?wc_get_product($p->get_parent_id()):null;
              $pid=(int)get_post_meta($v,'mahak_id',true);
              $goodCode=$pid?$wpdb->get_var($wpdb->prepare("SELECT ProductCode FROM {$wpdb->prefix}bazara_products WHERE ProductId=%d",$pid)):null;
              $it[]=['woo_item'=>$v,'sku'=>$p?$p->get_sku():null,'parent_sku'=>$parent?$parent->get_sku():null,
                 'mahak_good_code'=>$goodCode,'quantity'=>(float)$x->get_quantity(),
                 'gross'=>(float)$x->get_subtotal(),'net'=>(float)$x->get_total()];
            }
            $q=$wpdb->get_row($wpdb->prepare("SELECT state,reason,remote_id,attempts FROM ".Vesta_Accounting_Reliability::table()." WHERE order_id=%d",$id),ARRAY_A);
            $example[]=['order'=>$id,'date'=>$o->get_date_created()?$o->get_date_created()->date('Y-m-d'):null,
              'total'=>(float)$o->get_total(),'shipping'=>(float)$o->get_shipping_total(),
              'discount'=>(float)$o->get_discount_total(),'paid'=>!!$o->get_date_paid(),
              'outbox'=>$q,'items'=>$it];
          }
          echo 'PDF_MATCH_DEBUG_NONPERSONAL_TARGET_ORDERS='.json_encode($example,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $rows=$wpdb->get_results("SELECT o.ID,o.post_date FROM {$wpdb->posts} o
               WHERE o.post_type='shop_order' AND o.post_date>='2026-11-06 00:00:00' AND o.post_date<'2026-11-19 00:00:00'
               ORDER BY o.ID",ARRAY_A);
          $result=[];
          foreach($rows as $r){
            $id=(int)$r['ID'];$o=wc_get_order($id);
            if(!$o||!in_array($o->get_status(),['processing','completed','on-hold'],true))continue;
            $out=[];
            foreach($o->get_items('line_item') as $it){
              $vid=$it->get_variation_id()?:$it->get_product_id();
              $p=wc_get_product($vid);$erpId=(int)get_post_meta($vid,'mahak_id',true);
              $code=$erpId?(string)$wpdb->get_var($wpdb->prepare("SELECT ProductCode FROM {$wpdb->prefix}bazara_products WHERE ProductId=%d",$erpId)):'';
              if(!$code)$code=$p?(string)$p->get_sku():'';
              if(!$code)$code=(string)$vid;
              $out[]=[$code,(int)$it->get_quantity()];
            }
            sort($out);
            $fingerprint=hash('sha256',json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
            $q=$wpdb->get_row($wpdb->prepare("SELECT state,reason,remote_id FROM ".Vesta_Accounting_Reliability::table()." WHERE order_id=%d",$id),ARRAY_A);
            $result[]=['id'=>$id,'date'=>$o->get_date_created()?$o->get_date_created()->date('Y-m-d'):null,
              'purchased_lines'=>count($out),'item_count'=>array_sum(array_column($out,1)),
              'fingerprint_sha256'=>$fingerprint,'order_total'=>(int)round($o->get_total()),
              'item_net_total'=>(int)round(array_sum(array_map(fn($t)=>(float)$t->get_total(),$o->get_items('line_item')))),
              'state'=>$q['state']??null,'remote_id'=>(int)($q['remote_id']??0)];
          }
          echo 'PDF_MATCH_PERIOD_SUMMARY='.json_encode(['eligible_order_count'=>count($result),'window_start'=>'2026-11-06','window_end'=>'2026-11-18']).PHP_EOL;
          echo 'PDF_MATCH_WINDOW_FINGERPRINTS='.json_encode($result,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'WORDPRESS_MAHAK_READ_ONLY_EXACT_RECON=yes'.PHP_EOL;
          PHP