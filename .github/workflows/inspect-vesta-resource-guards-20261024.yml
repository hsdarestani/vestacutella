name: Inspect Vesta resource guard prerequisites
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-vesta-resource-guards-20261024.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect guard prerequisites
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 55 sshpass -e scp -o ConnectTimeout=14 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/inspect-guard-integration-20261024.sh "root@$HOST:/tmp/inspect-guard-integration-20261024.sh"
          timeout 110 sshpass -e ssh -o ConnectTimeout=14 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/inspect-guard-integration-20261024.sh'
