name: Audit Vesta slowdown after Cutella import
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-vesta-post-cutella-speed-20261019.sh
      - .github/workflows/audit-vesta-post-cutella-speed-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only audit
        run: bash -n scripts/audit-vesta-post-cutella-speed-20261019.sh
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Measure live origin and database health without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/audit-vesta-post-cutella-speed-20261019.sh "root@$HOST:/tmp/audit-vesta-post-cutella-speed-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/audit-vesta-post-cutella-speed-20261019.sh'
