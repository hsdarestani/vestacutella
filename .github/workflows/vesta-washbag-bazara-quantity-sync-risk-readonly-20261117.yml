name: Vesta check current two-size inventory and Bazaar quantity sync direction, read only
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-washbag-bazara-quantity-sync-risk-readonly-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect current mapped stock and vendor stock-sync code branches and cron names, no changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $v=[];
          foreach([70299,70300] as $id){$p=wc_get_product($id);
            $v[]=['variation_id'=>$id,'sku'=>$p->get_sku(),'woo_stock'=>$p->get_stock_quantity(),
              'erp_product_id'=>(int)get_post_meta($id,'mahak_id',true),
              'erp_detail_id'=>(int)get_post_meta($id,'mahak_product_detail_id',true)];
          }
          $s=get_option('bazara_visitor_settings',[]);
          echo 'NOW_WOO_STOCK_AND_ERP_LINKS='.json_encode($v,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'NOW_BAZARA_CHK_QUANTITY='.json_encode($s['chkQuantity']??null).PHP_EOL;
          $ds=$wpdb->get_results("SELECT * FROM {$wpdb->prefix}bazara_product_details WHERE ProductDetailId IN (12269302,12269303)",ARRAY_A);
          $fields=[];
          foreach($ds as $r){
            $safe=['ProductDetailId'=>(int)$r['ProductDetailId'],'ProductId'=>(int)$r['ProductId']];
            foreach($r as $k=>$value)if(preg_match('/qty|count|exist|stock|quantity|inventory/i',(string)$k))
              $safe[$k]=is_scalar($value)&&strlen((string)$value)<32?$value:null;
            $fields[]=$safe;
          }
          echo 'BAZARA_CACHED_QUANTITY_FIELDS='.json_encode($fields,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $cron=_get_cron_array();$names=[];
          foreach(is_array($cron)?$cron:[] as $timestamp=>$events)
            foreach($events as $hook=>$args)
              if(preg_match('/bazara|stock|quantity|product.sync|inventory/i',$hook))
                $names[$hook]=isset($names[$hook])?min($names[$hook],(int)$timestamp):(int)$timestamp;
          echo 'BAZARA_STOCK_RELATED_CRON_NAMES='.json_encode($names,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'STOCK_SYNC_RISK_AUDIT_READ_ONLY=yes'.PHP_EOL;
          PHP
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/functions.php')
          lines=f.read_text(encoding='utf8',errors='replace').splitlines()
          for start,end in ((1244,1268),(1458,1499),(1906,1925),(1944,1983)):
            print('VENDOR_STOCK_FUNCTION_SOURCE_RANGE=',start,end)
            for i in range(start-1,min(len(lines),end)):
              x=lines[i]
              if re.search(r'api.?key|secret|password|token|https?://',x,re.I):continue
              x=re.sub(r"""(["'])(?:\\.|(?!\1).)*?\1""","'<literal>'",x)
              print('VENDOR_STOCK_CODE',i+1,x.strip()[:195])
          PY
          REMOTE