name: Inspect verified Woo color taxonomy and product 102942 sync prerequisites
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-102942-woo-color-taxonomy-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read official Woo taxonomy, term slug, source and mapping status
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1300M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(180);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          foreach([105592,102940,104001,62823] as $id){
            $p=wc_get_product($id);if(!$p)continue;
            $out=[];foreach((array)$p->get_attributes() as $name=>$attr) {
              if(!is_object($attr))continue;
              $tax=$attr->get_name();
              $terms=[];
              foreach((array)$attr->get_options() as $option) {
                $term=get_term((int)$option,$tax);
                if($term&&!is_wp_error($term))$terms[]=['id'=>$term->term_id,'slug'=>$term->slug,'name'=>$term->name];
              }
              $out[]=['taxonomy'=>$tax,'id'=>$attr->get_id(),'variation'=>$attr->get_variation(),
                      'options'=>$attr->get_options(),'terms'=>$terms];
            }
            echo 'COLOR_TAXONOMY_SOURCE='.wp_json_encode([
              'id'=>$id,'name'=>$p->get_name(),'type'=>$p->get_type(),
              'attributes'=>$out,'categories'=>$p->get_category_ids(),
              'status'=>$p->get_status()
            ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          $c=vesta_mhi_catalog();$rows=[];
          foreach($c['ProductDetails']??[] as $d)
            if((int)($d['ProductId']??0)===10755480&&!$d['Deleted'])
              $rows[]=['id'=>$d['ProductDetailId'],'properties'=>$d['Properties'],
                'price'=>$d['Price1']];
          echo 'LIPGLOSS_102942_ERP_DETAILS='.wp_json_encode($rows,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $ledger=vesta_mhi_cloud_photo_ledger();
          $photos=[];foreach($ledger['PhotoGalleries']??[] as $rel)
             if(empty($rel['Deleted'])&&(int)($rel['ItemCode']??0)===10755480)$photos[]=(int)$rel['PictureId'];
          echo 'LIPGLOSS_102942_CLOUD_PHOTO_IDS='.wp_json_encode(array_values(array_unique($photos)),JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'LIPGLOSS_102942_TAXONOMY_AUDIT_READONLY=yes'.PHP_EOL;
          PHP
