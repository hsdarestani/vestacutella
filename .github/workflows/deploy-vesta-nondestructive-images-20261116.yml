name: Safely patch Bazara image sync to preserve all existing Woo photos
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-vesta-nondestructive-images-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate local patch syntax
        run: python3 -m py_compile scripts/patch-vesta-bazara-image-preserve-20261116.py
      - name: Upload patch to server and atomically protect 2 vendor files with rollback
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/patch-vesta-bazara-image-preserve-20261116.py "root@$HOST:/tmp/patch-vesta-bazara-image-preserve-20261116.py"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'SHELL'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-image-safe-deploy.lock
          flock -n 9
          BASE=/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara
          BACKUP=/srv/backups/vesta-nondestructive-image-patch-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$BACKUP"
          test -f "$BASE/classes/class.bazara.api.php"
          test -f "$BASE/classes/class.products.table.php"
          test "$(df -Pk /srv | awk 'NR==2{print $4}')" -gt 700000
          # Full original implementation and image association metadata are preserved.
          cp -p "$BASE/classes/class.bazara.api.php" "$BACKUP/class.bazara.api.php"
          cp -p "$BASE/classes/class.products.table.php" "$BACKUP/class.products.table.php"
          docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb-dump -uroot --single-transaction --quick "$MARIADB_DATABASE" wp_posts wp_postmeta' | gzip -1 > "$BACKUP/product-and-media-meta.sql.gz"
          gzip -t "$BACKUP/product-and-media-meta.sql.gz"
          sha256sum "$BACKUP"/*.php "$BACKUP/product-and-media-meta.sql.gz" > "$BACKUP/SHA256SUMS"
          (cd "$BACKUP";sha256sum -c SHA256SUMS)
          echo "IMAGE_BACKUP_VERIFIED=$BACKUP"
          python3 /tmp/patch-vesta-bazara-image-preserve-20261116.py --plugin-root "$BASE"
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $settings=get_option('bazara_visitor_settings',[]);
          if(!empty($settings['chkPicture']))throw new RuntimeException('PICTURE_SYNC_MUST_BE_DISABLED_DURING_PATCH');
          $pairs=$wpdb->get_results("SELECT post_id,meta_key,meta_value FROM {$wpdb->postmeta} WHERE meta_key IN('_thumbnail_id','_product_image_gallery') ORDER BY post_id,meta_key,meta_id",ARRAY_A);
          echo 'IMAGE_RELATIONS_BEFORE_HASH='.hash('sha256',json_encode($pairs)).PHP_EOL;
          echo 'IMAGE_RELATIONS_BEFORE_COUNT='.count($pairs).PHP_EOL;
          PHP
          touched=no
          rollback(){
            code=$?
            trap - ERR
            if [[ "$touched" = yes ]];then
              cp -p "$BACKUP/class.bazara.api.php" "$BASE/classes/class.bazara.api.php"
              cp -p "$BACKUP/class.products.table.php" "$BASE/classes/class.products.table.php"
              echo IMAGE_VENDOR_CODE_RESTORED_FROM_BACKUP=yes
            fi
            exit "$code"
          }
          trap rollback ERR
          touched=yes
          python3 /tmp/patch-vesta-bazara-image-preserve-20261116.py --plugin-root "$BASE" --apply
          docker exec vc-vesta php -l /var/www/html/wp-content/plugins/bazara/classes/class.bazara.api.php
          docker exec vc-vesta php -l /var/www/html/wp-content/plugins/bazara/classes/class.products.table.php
          python3 /tmp/patch-vesta-bazara-image-preserve-20261116.py --plugin-root "$BASE"
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "ORIGIN=$host HTTP=$code"; test "$code" = 200
          done
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $settings=get_option('bazara_visitor_settings',[]);
          if(!empty($settings['chkPicture']))throw new RuntimeException('PICTURE_SYNC_ENABLED_UNEXPECTED');
          $pairs=$wpdb->get_results("SELECT post_id,meta_key,meta_value FROM {$wpdb->postmeta} WHERE meta_key IN('_thumbnail_id','_product_image_gallery') ORDER BY post_id,meta_key,meta_id",ARRAY_A);
          echo 'IMAGE_RELATIONS_AFTER_HASH='.hash('sha256',json_encode($pairs)).PHP_EOL;
          echo 'IMAGE_RELATIONS_AFTER_COUNT='.count($pairs).PHP_EOL;
          echo 'PICTURE_SYNC_STILL_DISABLED_PENDING_SMALL_CANARY=yes'.PHP_EOL;
          PHP
          trap - ERR
          echo IMAGE_PRESERVATION_PATCH_DEPLOYED_WITHOUT_MEDIA_WRITES=yes
          SHELL
