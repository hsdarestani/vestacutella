name: Verify native Bazara new-variable draft creation pipeline
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-bazara-native-variable-sync-20261119.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read exact native Woo/Bazara variable creation logic and scheduled hook
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara')
          sections=[
           ('classes/class.bazara.api.php',724,870),
           ('classes/functions.php',1222,1370),
           ('classes/product/import.php',65,180),
           ('classes/product/import.php',470,610),
          ]
          for name,start,end in sections:
            a=(root/name).read_text(encoding='utf8',errors='replace').splitlines()
            clean=[]
            for i in range(start,min(end,len(a))+1):
              line=a[i-1].strip()
              if re.search(r'password|token|secret|authorization|base_url|username|apikey|api_key|curl|header',line,re.I):continue
              if len(line)>220:line=line[:220]
              clean.append([i,line])
            print('NATIVE_VARIABLE_METHOD_FRAGMENT='+json.dumps(
               {'file':name,'start':start,'lines':clean},ensure_ascii=False))
          PY
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $settings=get_bazara_visitor_settings();
          echo 'NATIVE_NEW_VARIABLE_POLICY='.wp_json_encode([
             'chkProduct'=>$settings['chkProduct']??null,
             'publishStatus'=>$settings['publishStatus']??null,
             'chkRegularPrice'=>$settings['chkRegularPrice']??null,
             'chkQuantity'=>$settings['chkQuantity']??null,
             'chkVariation'=>$settings['chkVariation']??null
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          $table=$wpdb->prefix.'actionscheduler_actions';
          foreach(['bazara_run_product_sync','vesta_mhi_auto_tick'] as $h){
            $items=$wpdb->get_results($wpdb->prepare("SELECT action_id,status,scheduled_date_gmt,last_attempt_gmt,attempts FROM {$table} WHERE hook=%s ORDER BY action_id DESC LIMIT 3",$h),ARRAY_A);
            echo 'NATIVE_NEW_VARIABLE_ACTIONS_'.$h.'='.wp_json_encode($items).PHP_EOL;
          }
          echo 'NATIVE_READ_ONLY=yes'.PHP_EOL;
          PHP
          REMOTE
