name: Audit product category targets
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-category-refactor-20261018.sh
      - .github/workflows/audit-category-refactor-20261018.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/audit-category-refactor-20261018.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read only two store taxonomy map
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/audit-category-refactor-20261018.sh "root@$HOST:/tmp/audit-category-refactor-20261018.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/audit-category-refactor-20261018.sh'
