name: Vesta inspect Mehrona parent and variation Mahak detail identities
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-mehrona-parent-variant-detail-audit-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify exact variant code 13 under Mahak parent 103200 and Woo 103201 read-only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $goods=vmb_catalog(vmb_api());$targetId=10685134;
          $cloudDetails=[];
          foreach($goods['ProductDetails']??[] as $d){
            if((int)($d['ProductId']??0)!==$targetId || !empty($d['Deleted']))continue;
            $cloudDetails[]=['id'=>(int)($d['ProductDetailId']??0),
              'detail_code'=>$d['ProductDetailCode']??null,
              'properties'=>$d['Properties']??null,
              'properties2'=>$d['Properties2']??null,
              'barcode'=>$d['Barcode']??null,
              'count1'=>$d['Count1']??null];
          }
          echo 'MEHRONA_CLOUD_DETAILS='.json_encode($cloudDetails,JSON_UNESCAPED_UNICODE).PHP_EOL;
          foreach([103200,103201] as $wid){
            $p=wc_get_product($wid);
            if(!$p)continue;
            $attrs=$p->get_attributes();
            echo 'MEHRONA_WOO_META='.json_encode([
              'woo_id'=>$wid,'type'=>$p->get_type(),'name'=>$p->get_name(),
              'sku'=>$p->get_sku(),'attrs'=>$attrs,'parent_id'=>$p->get_parent_id(),
              'mahak_id'=>(int)$p->get_meta('mahak_id',true),
              'mahak_detail_id'=>(int)$p->get_meta('mahak_product_detail_id',true),
              'children'=>method_exists($p,'get_children')?array_slice($p->get_children(),0,30):null
            ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          $p=wc_get_product(103200);
          if($p&&method_exists($p,'get_children')){
            $summary=[];
            foreach($p->get_children() as $vid){
              $v=wc_get_product($vid);if(!$v)continue;
              $summary[]=['id'=>$vid,'sku'=>$v->get_sku(),'attrs'=>$v->get_attributes(),
              'erp_id'=>(int)$v->get_meta('mahak_id',true),
              'erp_detail'=>(int)$v->get_meta('mahak_product_detail_id',true)];
            }
            echo 'MEHRONA_ALL_WOO_VARIATIONS='.json_encode($summary,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          $count=(int)$wpdb->get_var("SELECT COUNT(DISTINCT order_item_id) FROM {$wpdb->prefix}woocommerce_order_itemmeta
             WHERE meta_key='_variation_id' AND meta_value='103201'");
          echo 'MEHRONA_WOO_VARIANT_PURCHASED_LINE_COUNT='.$count.PHP_EOL;
          $pictures=$wpdb->get_results($wpdb->prepare("SELECT PictureId,ItemCode,Deleted FROM {$wpdb->prefix}bazara_photo_gallery WHERE ItemCode=%d OR ItemCode=%d",10685134,10755477),ARRAY_A);
          echo 'MEHRONA_PHOTO_SOURCE_KEYS='.json_encode($pictures).PHP_EOL;
          echo 'NO_PRODUCT_INVENTORY_ORDER_OR_MEDIA_WRITES=yes'.PHP_EOL;
          PHP
