name: Deploy Vesta Bazaar outgoing Riyal conversion safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vesta-bazara-outbound-rial-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy isolated outgoing order currency conversion
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/deploy-vesta-bazara-outbound-rial-20261110.sh \
            "root@$HOST:/tmp/deploy-vesta-bazara-outbound-rial-20261110.sh"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "root@$HOST" 'bash /tmp/deploy-vesta-bazara-outbound-rial-20261110.sh'
