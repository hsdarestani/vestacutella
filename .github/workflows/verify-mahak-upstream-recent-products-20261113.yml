name: Verify latest Mahak cloud export timestamps and recent sync failures
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-mahak-upstream-recent-products-20261113.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect export timestamps and sync failures without modifying data
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          docker exec -i vc-vesta php -d memory_limit=512M -d max_execution_time=100 -d display_errors=0 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          global $wpdb;
          $cloud=vmb_catalog(vmb_api());
          $rows=$cloud['Products']??[];
          $ordered=$rows;
          usort($ordered,fn($a,$b)=>(int)($b['RowVersion']??0)<=>(int)($a['RowVersion']??0));
          echo 'CLOUD_COUNT='.count($rows)."\n";
          foreach(array_slice($ordered,0,7) as $p){
            echo 'RECENT_PRODUCT='.json_encode([
              'id'=>$p['ProductId']??0,
              'code'=>$p['ProductCode']??'',
              'name'=>$p['Name']??'',
              'created'=>$p['CreateDate']??'',
              'updated'=>$p['UpdateDate']??'',
              'version'=>$p['RowVersion']??'',
            ],JSON_UNESCAPED_UNICODE)."\n";
          }
          $t=$wpdb->prefix.'actionscheduler_actions';
          $rows=$wpdb->get_results("SELECT action_id,status,scheduled_date_gmt,last_attempt_gmt,attempts FROM `".$t."` WHERE hook='bazara_run_product_sync' AND status='failed' ORDER BY action_id DESC LIMIT 6",ARRAY_A);
          echo 'FAILED_PRODUCT_SYNC_ACTIONS='.json_encode($rows)."\n";
          $last=$wpdb->get_row("SELECT action_id,status,scheduled_date_gmt,last_attempt_gmt FROM `".$t."` WHERE hook='bazara_run_product_sync' AND status='complete' ORDER BY action_id DESC LIMIT 1",ARRAY_A);
          echo 'LAST_COMPLETE_PRODUCT_SYNC='.json_encode($last)."\n";
          $tbl=$wpdb->prefix.'bazara_products';
          echo 'LOCAL_CATALOG_COUNT='.(int)$wpdb->get_var("SELECT COUNT(*) FROM `".$tbl."`")."\n";
          echo 'LOCAL_LATEST_VERSION='.(string)$wpdb->get_var("SELECT MAX(RowVersion) FROM `".$tbl."`")."\n";
          echo 'AUDIT_NO_WRITES=yes'."\n";
          PHP
          REMOTE
