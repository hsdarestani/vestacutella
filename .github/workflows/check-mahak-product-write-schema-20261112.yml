name: Check Mahak live API metadata for product create capability without writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-mahak-product-write-schema-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: GET API docs and inspect logged-in permission metadata without exposing account identifiers
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "CHECKED_UTC=$(date -u +%FT%TZ)"
          python3 - <<'PY'
          from pathlib import Path
          import re,urllib.request,urllib.error,urllib.parse,json
          src=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php').read_text(encoding='utf-8',errors='replace')
          m=re.search(r'private\s+\$base_url\s*=\s*[\x27\x22](https?://[^\x27\x22]+)',src)
          if not m:
           print('REMOTE_API_BASE_STATIC_UNAVAILABLE=yes');raise SystemExit(0)
          base=m.group(1).rstrip('/')
          # Do not output base domain or credentials; GET only.
          u=urllib.parse.urlsplit(base)
          root=u.scheme+'://'+u.netloc
          candidates=['/swagger/v1/swagger.json','/swagger/docs/v1','/swagger.json','/openapi.json','/api-docs','/help']
          found=0
          for suffix in candidates:
           url=root+suffix
           try:
            req=urllib.request.Request(url,method='GET',headers={'Accept':'application/json','User-Agent':'Vesta-ReadOnly-Contract-Audit'})
            with urllib.request.urlopen(req,timeout=5) as f:
             code=f.status
             ctype=f.headers.get('Content-Type','')
             data=f.read(180000)
            print('API_SCHEMA_PATH='+suffix+' STATUS='+str(code)+' JSON='+str('json' in ctype.lower()).lower())
            if 'json' not in ctype.lower():continue
            obj=json.loads(data)
            paths=obj.get('paths',{})
            if isinstance(paths,dict):
             found+=1
             print('SWAGGER_DISCOVERED_PATH_COUNT='+str(len(paths)))
             for k,v in paths.items():
              if any(q in k.lower() for q in ('product','saveall','getall','catalog','stock')):
               print('SWAGGER_RELEVANT_ROUTE='+re.sub('[^a-zA-Z0-9_/.-]','',k)[:110]+' METHODS='+','.join([t.upper() for t in v if t.lower() in ('get','post','put','patch','delete')]))
             schemas=json.dumps(obj.get('definitions',obj.get('components',{})),ensure_ascii=False)
             print('SWAGGER_PRODUCT_SCHEMA_REFERENCED='+str(any(x in schemas for x in ('ProductDetail','ProductCode','ProductName'))).lower())
           except urllib.error.HTTPError as e:print('API_SCHEMA_PATH='+suffix+' HTTP='+str(e.code))
           except Exception as e:print('API_SCHEMA_PATH='+suffix+' UNAVAILABLE='+e.__class__.__name__)
          print('SWAGGER_DOCUMENTS_DISCOVERED='+str(found))
          PY
          echo '=== AUTHORISATION METADATA FIELD NAMES ONLY ==='
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=256M -d max_execution_time=70 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $api=new BazaraApi(true);
          $auth=$api->login_token();
          if(!is_array($auth)||empty($auth['success'])){echo "API_LOGIN=failed\n";exit(21);}
          echo "API_LOGIN=success\n";
          foreach(['extra','object'] as $key){
            $x=$auth[$key]??null;
            echo "LOGIN_META_".$key."_TYPE=".gettype($x)."\n";
            if(is_array($x)){
              foreach(array_keys($x) as $name){
                if(preg_match('/product|write|create|permission|allow|access|role|feature|scope/i',(string)$name)){
                  echo 'PERMISSION_RELATED_KEY_'.preg_replace('/[^a-zA-Z_]/','',(string)$name)."_EXISTS=yes\n";
                }
              }
            }
          }
          PHP
          echo "NO_WRITE_REQUESTS_SENT=yes"
          echo "PRODUCT_CREATE_CAPABILITY_METADATA_AUDIT_FINISHED=yes"
          REMOTE
