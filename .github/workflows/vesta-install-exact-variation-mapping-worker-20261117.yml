name: Vesta deploy strict existing Mahak variation matcher without changing stock photos or invoices
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-install-exact-variation-mapping-worker-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-verified-variation-mapper-install
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and exact Woo variation metadata preflight
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l scripts/vesta-auto-map-verified-existing-variations-20261117.php
      - name: Stage tested mapper
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-auto-map-verified-existing-variations-20261117.php "root@$HOST:/tmp/vesta-auto-map-verified-variations-20261117.php"
      - name: Live dry run, backup, install bounded hourly matcher with safe rollback
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-verified-variation-mapper-deploy-20261117.lock
          flock -n 9
          path=/srv/vestacutella/repo/scripts/vesta-auto-map-verified-existing-variations-20261117.php
          wrapper=/usr/local/sbin/vesta-map-verified-existing-variations
          cron=/etc/cron.d/vesta-verified-variation-catalog
          backup=/srv/backups/vesta-verified-variation-mapper-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$backup"
          for file in "$path" "$wrapper" "$cron";do
            if test -f "$file";then cp -p "$file" "$backup/$(basename "$file")";fi
          done
          docker exec -i vc-vesta php -l < /tmp/vesta-auto-map-verified-variations-20261117.php
          docker exec -u www-data -i -e VCAR_VARIANT_COMMIT=no vc-vesta php -d display_errors=0 -d memory_limit=1024M < /tmp/vesta-auto-map-verified-variations-20261117.php | tee "$backup/canary-dryrun.log"
          grep -Fq 'VERIFIED_VARIATION_DRY_RUN_ONLY_NO_WRITES=yes' "$backup/canary-dryrun.log"
          echo 'EXISTING_VARIATIONS_STRICT_DRYRUN_VERIFIED_NO_WRITES=yes'
          cp /tmp/vesta-auto-map-verified-variations-20261117.php "$path.next"
          chmod 0644 "$path.next"
          chown --reference="$path" "$path.next" 2>/dev/null || true
          mv "$path.next" "$path"
          cat >"$wrapper" <<'SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-bazara-repair-full-catalog.lock
          flock -n 9 || exit 0
          source=/srv/vestacutella/repo/scripts/vesta-auto-map-verified-existing-variations-20261117.php
          probe=$(timeout 180 docker exec -u www-data -i -e VCAR_VARIANT_COMMIT=no vc-vesta php -d display_errors=0 -d memory_limit=1024M < "$source")
          printf '%s\n' "$probe"
          echo "$probe" | grep -Fq 'VERIFIED_VARIATION_DRY_RUN_ONLY_NO_WRITES=yes'
          count=$(printf '%s\n' "$probe" | sed -n 's/.*"safe_candidates":\([0-9][0-9]*\).*/\1/p' | head -1)
          test -n "$count"
          if [[ "$count" == 0 ]];then
             echo 'NO_NEW_EXACT_VARIATION_MATCHES_NO_CHANGES=yes';exit 0
          fi
          backup=/srv/backups/vesta-verified-variation-mapping-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw' > "$backup/all-existing-mahak-ids.tsv" <<'SQL'
          SELECT meta_id,post_id,meta_key,meta_value FROM wp_postmeta WHERE meta_key IN ('mahak_id','mahak_product_detail_id') ORDER BY meta_id;
          SQL
          (cd "$backup";sha256sum all-existing-mahak-ids.tsv > SHA256SUMS;sha256sum -c SHA256SUMS)
          echo 'EXACT_VARIATION_META_BACKUP_VERIFIED=yes'
          timeout 180 docker exec -u www-data -i -e VCAR_VARIANT_COMMIT=yes -e VCAR_VARIANT_BACKUP_VERIFIED=yes vc-vesta php -d display_errors=0 -d memory_limit=1024M < "$source" | tee "$backup/verified-mapping-result.log"
          grep -Fq 'ALL_WOO_PRICES_STOCK_AND_IMAGES_UNCHANGED=yes' "$backup/verified-mapping-result.log"
          echo 'VERIFIED_VARIATION_MAPPING_BATCH_SUCCESS_NO_ERP_WRITES=yes'
          SCRIPT
          chmod 0700 "$wrapper"
          cat >"$cron" <<'CRON'
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          47 * * * * root timeout 420 /usr/local/sbin/vesta-map-verified-existing-variations >>/var/log/vesta-accounting-variation-mapper.log 2>&1
          CRON
          chmod 0644 "$cron"
          "$wrapper" | tee "$backup/first-live-wrapper-run.log"
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          if((int)get_post_meta(101962,'mahak_id',true)!==10755482 ||
             (int)get_post_meta(101962,'mahak_product_detail_id',true)!==12269296 ||
             !get_option('vcar_sender_enabled',false))exit(35);
          echo 'EXACT_VARIANT_101962_MAPPING_PRESERVED=yes'.PHP_EOL;
          echo 'SENDER_REMAINS_GUARDED_AND_ACTIVE=yes'.PHP_EOL;
          PHP
          echo 'HOURLY_EXACT_EXISTING_GOODS_MAPPER_INSTALLED=yes'
          REMOTE
      - name: Storefronts still healthy
        run: |
          set -Eeuo pipefail
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl -LsS --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code";test "$code" = 200
          done
