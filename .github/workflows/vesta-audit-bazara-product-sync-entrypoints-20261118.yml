name: Inspect official Bazara catalog product sync execution paths
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-audit-bazara-product-sync-entrypoints-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read live Bazara product sync entrypoints and controls without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import re
          root=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara')
          files=[('classes/functions.php',[(1040,1175),(1200,1238),(2065,2190)]),
                 ('classes/class.bazara.api.php',[(4010,4175)]),
                 ('classes/class.products.table.php',[(54,122)])]
          for name,ranges in files:
            p=root/name
            if not p.exists():continue
            lines=p.read_text(errors='replace').splitlines()
            for lo,hi in ranges:
              print('SOURCE_REGION',name,lo,hi)
              for n in range(lo,min(hi,len(lines))+1):
                s=lines[n-1].strip()
                if re.search(r'(?i)(password|secret|token|authorization|api.?key|https?://)',s):s='[REDACTED]'
                print('SRC',name,n,s[:230])
          PY
