name: Vesta inspect guarded customer sync health and accounting queue, read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-20261118-person-worker-and-accounting-live-readiness.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify worker cron, guarded queue states and customers eligible for safe relinking
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo 'WORKER_CRON_PRESENT='$(test -f /etc/cron.d/vesta-safe-person-worker && echo yes || echo no)
          echo 'WORKER_SCRIPT_PRESENT='$(test -f /srv/vestacutella/repo/scripts/vesta-safe-person-worker-20261116.php && echo yes || echo no)
          echo 'CRON_SERVICE='$(systemctl is-active cron || true)
          if test -f /var/log/vesta-safe-person-worker.log;then
            echo 'WORKER_LOG_LAST_MOD='$(stat -c '%y' /var/log/vesta-safe-person-worker.log | cut -d'.' -f1)
            echo 'WORKER_SUMMARY_LAST_FIVE'
            grep -E '^PERSON_WORKER_SUMMARY=|^PERSON_WORKER_BUSY=|^PERSON_WORKER_EXCEPTION_CLASS=|^PERSON_WRITE_ACK_UNCERTAIN' /var/log/vesta-safe-person-worker.log | tail -5 || true
          else
            echo 'WORKER_LOG_EXISTS=no'
          fi
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $r=$wpdb->get_results("SELECT state,reason,COUNT(*) n FROM ".Vesta_Accounting_Reliability::table()." WHERE order_id>=105500 GROUP BY state,reason ORDER BY n DESC",ARRAY_A);
          echo 'CURRENT_RECENT_ORDER_OUTBOX_STATES='.json_encode($r,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'CLOUD_SENDER_ENABLED='.json_encode(get_option('vcar_sender_enabled',false)).PHP_EOL;
          echo 'READ_ONLY_WP_ACCOUNTING_PROBE=yes'.PHP_EOL;
          PHP
          REMOTE