name: Diagnose recent Bazaar product sync failures and cron backlog without writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-recent-bazara-product-sync-failures-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect action scheduler product sync errors, sanitize messages
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php'; global $wpdb;
          $actions=$wpdb->prefix.'actionscheduler_actions';$logs=$wpdb->prefix.'actionscheduler_logs';
          $stats=$wpdb->get_results("SELECT status,COUNT(*) n,MAX(last_attempt_gmt) latest
             FROM $actions WHERE hook='bazara_run_product_sync' GROUP BY status",ARRAY_A);
          echo 'BAZARA_SYNC_HISTORY_STATS='.json_encode($stats).PHP_EOL;
          $failed=$wpdb->get_results("SELECT a.action_id,a.scheduled_date_gmt,a.last_attempt_gmt,a.attempts
             FROM $actions a WHERE a.hook='bazara_run_product_sync' AND a.status='failed'
             ORDER BY a.action_id DESC LIMIT 15",ARRAY_A);
          $safe=[];
          foreach($failed as $a){
             $id=(int)$a['action_id'];
             $messages=$wpdb->get_col($wpdb->prepare("SELECT message FROM $logs WHERE action_id=%d ORDER BY log_id DESC LIMIT 3",$id));
             $m=[];
             foreach($messages as $msg){
                $msg=preg_replace('/(?:https?:\/\/|Bearer |Authorization:).*$/i','[redacted]',(string)$msg);
                $msg=preg_replace('/[\w.+-]+@[\w.-]+\.[a-zA-Z]{2,}/','[EMAIL]', $msg);
                $m[]=mb_substr(preg_replace('/\s+/u',' ',$msg),0,160);
             }
             $safe[]=['action'=>$id,'scheduled'=>$a['scheduled_date_gmt'],
                'last_attempt'=>$a['last_attempt_gmt'],'attempts'=>$a['attempts'],'logs'=>$m];
          }
          echo 'BAZARA_SYNC_RECENT_FAILURES='.json_encode($safe,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $now=gmdate('Y-m-d H:i:s');
          $pending=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM $actions
              WHERE hook='bazara_run_product_sync' AND status='pending' AND scheduled_date_gmt < %s",$now));
          $running=(int)$wpdb->get_var("SELECT COUNT(*) FROM $actions
              WHERE hook='bazara_run_product_sync' AND status='in-progress'");
          echo 'BAZARA_SYNC_LIVE_PENDING_DUE='.$pending.' RUNNING='.$running.PHP_EOL;
          echo 'READ_ONLY_ACTION_SCHEDULER_INSPECTION=yes'.PHP_EOL;
          PHP
