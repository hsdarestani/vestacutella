name: Restore and use Vesta Clear Cache button
on:
  push:
    branches: [main]
    paths:
      - infra/plugins/vesta-clear-cache/vesta-clear-cache.php
      - scripts/deploy-vesta-clear-cache-button-20261019.sh
      - .github/workflows/deploy-vesta-clear-cache-button-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-admin-cache-clear
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate files before deployment
        run: |
          php -l infra/plugins/vesta-clear-cache/vesta-clear-cache.php
          bash -n scripts/deploy-vesta-clear-cache-button-20261019.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Clear Vesta WP Rocket cache and restore private admin toolbar button
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/plugins/vesta-clear-cache/vesta-clear-cache.php "root@$HOST:/tmp/vc-vesta-clear-cache.php"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/deploy-vesta-clear-cache-button-20261019.sh "root@$HOST:/tmp/deploy-vesta-clear-cache-button-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/deploy-vesta-clear-cache-button-20261019.sh'
