name: Install fail-closed Mahak image synchronization safety gate
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-vesta-image-sync-safety-gate-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l infra/plugins/vesta-accounting-reliability/vesta-image-sync-safety.php
      - name: Install MU guard and inspect actual vendor patch and photo sync setting
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/plugins/vesta-accounting-reliability/vesta-image-sync-safety.php "root@$HOST:/tmp/vesta-image-sync-safety.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'SHELL'
          set -Eeuo pipefail
          base=/srv/vestacutella/runtime/vesta/wp-content/mu-plugins
          dst="$base/vesta-image-sync-safety.php"
          backup=/srv/backups/vesta-image-safety-gate-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          if test -f "$dst";then cp -p "$dst" "$backup/vesta-image-sync-safety.php";fi
          docker exec -i vc-vesta php -l < /tmp/vesta-image-sync-safety.php
          cp /tmp/vesta-image-sync-safety.php "$base/.vesta-image-sync-safety.php.next"
          chmod 0644 "$base/.vesta-image-sync-safety.php.next"
          mv "$base/.vesta-image-sync-safety.php.next" "$dst"
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          if(!function_exists('vesta_bazara_image_patch_verified'))throw new RuntimeException('image_guard_not_installed');
          if(!vesta_bazara_image_patch_verified())throw new RuntimeException('image_patch_static_guard_failed');
          $s=get_option('bazara_visitor_settings',[]);
          if(!empty($s['chkPicture']))throw new RuntimeException('image_sync_must_still_be_off_pending_canary');
          echo 'IMAGE_PATCH_AND_UPGRADE_GUARD_VERIFIED=yes'.PHP_EOL;
          echo 'PICTURE_SYNC_NOT_YET_ENABLED=yes'.PHP_EOL;
          PHP
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code"; test "$code" = 200
          done
          SHELL
