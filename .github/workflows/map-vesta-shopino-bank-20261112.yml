name: Map Shopino payment gateway to verified ERP bank
on:
  push:
    branches: [main]
    paths: [.github/workflows/map-vesta-shopino-bank-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Backup original bank methods, exact ERP bank dryrun and commit
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            scripts/map-vesta-shopino-verified-erp-bank-20261112.php "root@$HOST:/tmp/map-vesta-shopino-verified-erp-bank-20261112.php"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-verified-shopino-bank-20261112.lock
          flock -n 9
          backup=/srv/backups/vesta-shopino-erp-bank-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          echo "SHOPINO_BANK_BACKUP_DIR=$backup"
          docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --skip-column-names' \
            > "$backup/visitor-settings-before.hex" <<'SQL'
          SELECT HEX(option_value) FROM wp_options WHERE option_name='bazara_visitor_settings';
          SQL
          test -s "$backup/visitor-settings-before.hex"
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=256M < /tmp/map-vesta-shopino-verified-erp-bank-20261112.php | tee "$backup/dryrun.log"
          grep -q 'SHOPINO_BANK_DRYRUN_NO_WRITES=yes' "$backup/dryrun.log"
          docker exec -e VC_SHOPINO_BANK_COMMIT=yes -i vc-vesta php -d display_errors=0 -d memory_limit=256M < /tmp/map-vesta-shopino-verified-erp-bank-20261112.php | tee "$backup/commit.log"
          grep -q 'SHOPINO_BANK_MAPPING_SAVED_AND_VERIFIED=yes' "$backup/commit.log"
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "HOST=$host HTTP=$code";test "$code" = 200
          done
          echo "SHOPINO_BANK_MAPPING_DEPLOY_SUCCESS=yes"
          echo "NO_ORDER_RESENDS_IN_THIS_JOB=yes"
          REMOTE
