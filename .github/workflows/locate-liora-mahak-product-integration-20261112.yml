name: Locate Liora bot Mahak integration target without modifications
on:
  push:
    branches: [main]
    paths: [.github/workflows/locate-liora-mahak-product-integration-20261112.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Locate only Liora service or source directories read-only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== MATCHING SERVICE NAMES ==='
          systemctl list-units --all --type=service --no-pager --no-legend | grep -iE 'liora|telegram.*bot|product.bot' | cut -c1-180 || true
          echo '=== LIORA PATH NAMES UNDER /srv /opt /home ==='
          find /srv /opt /home -maxdepth 5 -iname '*liora*' -print 2>/dev/null | head -40 || true
          echo '=== LIORA PROCESS EXECUTABLE NAMES ==='
          ps -eo comm,args | grep -iE 'liora' | grep -v 'grep -iE' | cut -c1-160 | head -18 || true
          echo 'READ_ONLY_CHECK=complete'
          REMOTE
