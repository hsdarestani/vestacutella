name: Automatic Woo customer panels for Vesta sales channels
# Accept an exact already-staged OTP candidate after independent regression checks.
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-vesta-channel-customers-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-channel-customer-accounts
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass php-cli
      - name: Identity and order lifecycle regression tests
        run: |
          php tests/channel-customers-test.php infra/plugins/vesta-sms-login/vesta-sms-login.php infra/plugins/vesta-channel-customers/vesta-channel-customers.php
          php -l scripts/verify-vesta-channel-customers.php
          bash -n scripts/deploy-vesta-channel-customers.sh
      - name: Back up, install and verify real customer panels without financial changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          stage="/tmp/vesta-channel-accounts-${GITHUB_SHA}"
          echo '222f5b015861e9823e3b0c787670fa8a2e9e3aabc3ce851cacb2bcd60793880a' > /tmp/otp-before.sha256
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "mkdir -m 0700 -p '$stage'"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/otp-before.sha256 infra/plugins/vesta-sms-login/vesta-sms-login.php infra/plugins/vesta-channel-customers/vesta-channel-customers.php tests/channel-customers-test.php scripts/verify-vesta-channel-customers.php scripts/vesta-channel-customer-worker.php scripts/deploy-vesta-channel-customers.sh "root@$HOST:$stage/"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "bash '$stage/deploy-vesta-channel-customers.sh' '$stage'"
