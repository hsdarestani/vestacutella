name: Export full 11-Aban Vesta Woo/Bazara reconciliation facts (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-vesta-nov02-orders-warehouse-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-nov02-readonly-extract
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Extract product inventory and actual Woo stock reductions without mutations
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          mkdir -p audit
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "mkdir -p -m 0700 /tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID"
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/vesta-nov02-stock-orders-readonly-export-20261119.php \
            "root@$HOST:/tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/export.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" \
            "docker exec -e VESTA_AUDIT_RUN_ID=$GITHUB_RUN_ID -i vc-vesta php -d display_errors=0 -d memory_limit=1536M" \
            < scripts/vesta-nov02-stock-orders-readonly-export-20261119.php | tee audit/live_log.txt
          grep -Fq 'VESTA_NOV02_READONLY_EXPORT_SUCCESS=yes' audit/live_log.txt
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" \
             "docker cp vc-vesta:/tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/products.csv /tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/products.csv
              docker cp vc-vesta:/tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/orders.csv /tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/orders.csv
              docker cp vc-vesta:/tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/summary.json /tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/summary.json"
          for name in products.csv orders.csv summary.json;do
            sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
             "root@$HOST:/tmp/vesta-reconcile-nov02-$GITHUB_RUN_ID/$name" "audit/$name"
            test -s "audit/$name"
          done
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('audit')
          summary=json.loads((d/'summary.json').read_text())
          for kind,expected,width in [('products',summary['all_woo_products'],17),
                                      ('orders',summary['order_line_items'],18)]:
              raw=(d/f'{kind}.csv').read_bytes()
              assert b'\x00' not in raw,(kind,'NUL bytes or concurrent corruption')
              with (d/f'{kind}.csv').open(newline='',encoding='utf8') as f:
                  rows=list(csv.reader(f))
              assert len(rows)-1==expected,(kind,len(rows)-1,expected)
              assert all(len(row)==width for row in rows[1:]),(kind,'bad CSV width')
              print(f'RECON_{kind.upper()}_CSV_VALID={expected}')
          print('RECON_DATA_INTEGRITY_VERIFIED=yes')
          PY
          echo "VESTA_RECON_PRODUCTS_ROWS=$(($(wc -l < audit/products.csv)-1))"
          echo "VESTA_RECON_ORDER_ITEMS_ROWS=$(($(wc -l < audit/orders.csv)-1))"
          echo 'VESTA_RECON_NO_ORDER_PRODUCT_STOCK_MUTATION=yes'
      - name: Store short-lived private-access audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesta-11-aban-20261119-readonly-reconcile
          path: |
            audit/products.csv
            audit/orders.csv
            audit/summary.json
          retention-days: 1
          if-no-files-found: error
