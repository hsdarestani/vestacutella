name: Export full 11-Aban Vesta Woo/Bazara reconciliation facts (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-vesta-nov02-orders-warehouse-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Extract product inventory and actual Woo stock reductions without mutations
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          mkdir -p audit
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'mkdir -p -m 0700 /tmp/vesta-reconcile-nov02'
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/vesta-nov02-stock-orders-readonly-export-20261119.php \
            "root@$HOST:/tmp/vesta-reconcile-nov02/export.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" \
            'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' \
            < scripts/vesta-nov02-stock-orders-readonly-export-20261119.php | tee audit/live_log.txt
          grep -Fq 'VESTA_NOV02_READONLY_EXPORT_SUCCESS=yes' audit/live_log.txt
          for name in products.csv orders.csv summary.json;do
            sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
             "root@$HOST:/tmp/vesta-reconcile-nov02/$name" "audit/$name"
            test -s "audit/$name"
          done
          echo "VESTA_RECON_PRODUCTS_ROWS=$(($(wc -l < audit/products.csv)-1))"
          echo "VESTA_RECON_ORDER_ITEMS_ROWS=$(($(wc -l < audit/orders.csv)-1))"
          echo 'VESTA_RECON_NO_ORDER_PRODUCT_STOCK_MUTATION=yes'
      - name: Store short-lived private-access audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesta-11-aban-20261119-readonly-reconcile
          path: |
            audit/products.csv
            audit/orders.csv
            audit/summary.json
          retention-days: 1
          if-no-files-found: error
