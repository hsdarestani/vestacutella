name: Diagnose Mahak codes 102941 102942 Woo updates and missing product
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-vesta-102941-102942-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read cloud ERP, local Bazara and Woo product identity by exact codes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(270);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $codes=['102941','102942'];
          $catalog=vesta_mhi_catalog();
          $cloud=[];$erpids=[];
          foreach($catalog['Products']??[] as $g){
            $code=trim((string)($g['ProductCode']??''));
            $name=trim((string)($g['Name']??''));
            if(!in_array($code,$codes,true)&&
               mb_stripos($name,'شیرآب',0,'UTF-8')===false&&
               mb_stripos($name,'پاپیونی',0,'UTF-8')===false)continue;
            $pid=(int)($g['ProductId']??0);
            $cloud[]=['code'=>$code,'erp_id'=>$pid,'name'=>$name,
              'deleted'=>!empty($g['Deleted']),'RowVersion'=>$g['RowVersion']??null];
            $erpids[$pid]=true;
          }
          $details=[];
          foreach($catalog['ProductDetails']??[] as $d){
            $pid=(int)($d['ProductId']??0);
            if(!isset($erpids[$pid]))continue;
            $details[]=[
              'erp_id'=>$pid,'detail_id'=>(int)($d['ProductDetailId']??0),
              'detail_code'=>$d['ProductDetailCode']??null,
              'price1'=>$d['Price1']??null,'properties'=>$d['Properties']??null,
              'deleted'=>!empty($d['Deleted'])
            ];
          }
          echo 'VESTA_CODES_CLOUD_PRODUCTS='.wp_json_encode($cloud,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'VESTA_CODES_CLOUD_DETAILS='.wp_json_encode($details,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $local=[];
          foreach(['bazara_products','bazara_product_details','bazara_product_assets'] as $short){
            $table=$wpdb->prefix.$short;$cols=$wpdb->get_col("SHOW COLUMNS FROM $table",0);
            $key=$short==='bazara_products'?'ProductCode':($short==='bazara_product_details'?'ProductId':'ProductDetailId');
            $query=$short==='bazara_products'?
                 $wpdb->prepare("SELECT * FROM $table WHERE ProductCode IN (%s,%s)",'102941','102942'):
                 ($short==='bazara_product_details'?
                 "SELECT * FROM $table WHERE ProductId IN (".implode(',',array_map('intval',array_keys($erpids?:[0=>true]))).")":
                 "SELECT * FROM $table WHERE ProductDetailId IN (".implode(',',array_map('intval',array_column($details,'detail_id')?:[0])).")");
            $rows=$wpdb->get_results($query,ARRAY_A);
            $out=[];
            foreach($rows as $r){
              $picked=[];foreach(['ProductCode','ProductId','Name','ProductDetailId','Price1','ProductDetailCode','Properties','StoreId','Count1','Deleted','RowVersion'] as $k)if(array_key_exists($k,$r))$picked[$k]=$r[$k];
              $out[]=$picked;
            }
            $local[$short]=['rows'=>$out,'cols'=>$cols];
          }
          echo 'VESTA_CODES_BAZARA_LOCAL='.wp_json_encode($local,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $woo=[];
          $posts=$wpdb->get_results("SELECT p.ID,p.post_title,p.post_status,p.post_type
          FROM {$wpdb->posts} p WHERE p.post_type IN ('product','product_variation')
           AND (p.post_title LIKE '%شیرآب%' OR p.post_title LIKE '%پاپیونی%'
                OR p.ID IN (102941,102942) OR
                EXISTS(SELECT 1 FROM {$wpdb->postmeta} m WHERE m.post_id=p.ID
                   AND ((m.meta_key='_sku' AND m.meta_value IN ('102941','102942'))
                   OR (m.meta_key IN ('mahak_id','_vesta_mahak_product_id')
                         AND m.meta_value IN (".implode(',',array_map('intval',array_keys($erpids?:[0=>true])))."))))
          ) ORDER BY p.ID DESC LIMIT 80",ARRAY_A);
          foreach($posts as $row){
            $p=wc_get_product((int)$row['ID']);
            $woo[]=['woo_id'=>(int)$row['ID'],'name'=>$row['post_title'],
              'status'=>$row['post_status'],'type'=>$row['post_type'],
              'sku'=>$p?$p->get_sku():get_post_meta($row['ID'],'_sku',true),
              'erp_id'=>get_post_meta($row['ID'],'mahak_id',true),
              'erp_detail'=>get_post_meta($row['ID'],'mahak_product_detail_id',true),
              'parent'=>$p?$p->get_parent_id():$wpdb->get_var($wpdb->prepare(
                "SELECT post_parent FROM {$wpdb->posts} WHERE ID=%d",$row['ID'])),
              'price'=>$p?$p->get_regular_price():null,
              'qty'=>$p?$p->get_stock_quantity():null,
              'stock_status'=>$p?$p->get_stock_status():null,
              'modified_utc'=>get_post_field('post_modified_gmt',$row['ID'])
            ];
          }
          echo 'VESTA_CODES_WOO_PRODUCTS='.wp_json_encode($woo,JSON_UNESCAPED_UNICODE).PHP_EOL;
          foreach($codes as $code){
            $hit=array_values(array_filter($cloud,fn($x)=>$x['code']===$code&&!$x['deleted']));
            $eid=count($hit)===1?$hit[0]['erp_id']:0;
            $resolved=$eid?(int)vms_existing_woo($code,$eid):0;
            echo 'VESTA_CODES_RESOLVE='.wp_json_encode(['code'=>$code,'active_cloud_count'=>count($hit),'resolved_woo'=>$resolved,
                'woo_by_sku'=>wc_get_product_id_by_sku($code)],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          $aut=get_option('vesta_mhi_auto_last_report',[]);
          echo 'VESTA_CODES_LAST_AUTO='.wp_json_encode([
             'completed_at'=>$aut['completed_at']??null,'candidate_count'=>$aut['candidate_count']??null,
             'blocked'=>$aut['blocked']??null,'processed_codes'=>$aut['processed_codes']??null,
             'errors'=>$aut['errors']??null,'new_drafts'=>$aut['new_drafts']??null],JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'VESTA_CODES_DIAGNOSTIC_READONLY_SUCCESS=yes'.PHP_EOL;
          PHP
