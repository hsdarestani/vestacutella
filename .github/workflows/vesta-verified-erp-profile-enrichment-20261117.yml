name: Vesta verified Woo profile enrichment dry run before Mahak person registration
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-verified-erp-profile-enrichment-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
      - name: Verify profile enrichment syntax and isolated dry run
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          php -l scripts/vesta-enrich-verified-erp-profiles-20261117.php
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i -e VC_PROFILE_ENRICH_MAX=10 vc-vesta php -d memory_limit=768M -d display_errors=0' < scripts/vesta-enrich-verified-erp-profiles-20261117.php | tee /tmp/vesta-enrichment-preflight.log
          grep -Fq 'COMMIT=0 NO_MAHAK_INVOICE_PRODUCT_OR_MEDIA_WRITES=yes' /tmp/vesta-enrichment-preflight.log
      - name: Read-only site availability
        run: |
          set -Eeuo pipefail
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir; do
            code=$(curl -LsS --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code";test "$code" = 200
          done
