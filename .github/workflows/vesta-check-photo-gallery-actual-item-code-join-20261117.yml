name: Vesta verify Mahak photo gallery ItemCode join against exact mapped Woo products
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-check-photo-gallery-actual-item-code-join-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect photo-gallery to mapped Woo linkage and canary readiness without changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $table=$wpdb->prefix.'bazara_photo_gallery';
          $columns=$wpdb->get_col("SHOW COLUMNS FROM {$table}",0);
          echo 'MAHAK_PHOTO_GALLERY_COLUMNS='.json_encode($columns).PHP_EOL;
          if(!in_array('ItemCode',$columns,true)||!in_array('PictureId',$columns,true))exit(21);
          $gallery=$wpdb->get_results("SELECT ItemCode,PictureId FROM {$table}",ARRAY_A);
          $out=[];$matched=0;
          foreach($gallery as $g){
            $pictureId=(int)$g['PictureId'];
            $item=(string)$g['ItemCode'];
            $picture=$wpdb->get_row($wpdb->prepare("SELECT Deleted,isSync,Url,FileName FROM {$wpdb->prefix}bazara_pictures WHERE PictureId=%d",$pictureId),ARRAY_A);
            if(!$picture||!empty($picture['Deleted']))continue;
            $ids=$wpdb->get_col($wpdb->prepare("SELECT p.ID FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} m ON m.post_id=p.ID WHERE m.meta_key='mahak_id' AND m.meta_value=%s AND p.post_type IN ('product','product_variation') AND p.post_status='publish'",$item));
            $eligible=[];
            foreach($ids as $id){
              $p=wc_get_product((int)$id);
              if(!$p)continue;
              $eligible[]=['woo_id'=>(int)$id,'featured_exists'=>(bool)$p->get_image_id(),
               'gallery_count'=>count($p->get_gallery_image_ids()),
               'complete_erp_mapping'=>(int)get_post_meta((int)$id,'mahak_product_detail_id',true)>0];
            }
            $matched+=count($eligible);
            $out[]=['picture_id'=>$pictureId,'erp_item_code'=>$item,
              'picture_pending'=>empty($picture['isSync']),'source_exists'=>!empty($picture['Url']),
              'matched_woo_products'=>$eligible];
          }
          echo 'MAHAK_REAL_PHOTO_ITEM_CODE_LINKS='.json_encode($out,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'PHOTO_RECORD_COUNT='.count($out).' MAPPED_WOO_PRODUCTS='.$matched.PHP_EOL;
          echo 'PRESERVATION_GATE='.(function_exists('vesta_bazara_image_patch_verified')&&vesta_bazara_image_patch_verified()?'verified':'not_verified').PHP_EOL;
          echo 'NO_IMAGES_OR_PRODUCTS_CHANGED=yes'.PHP_EOL;
          PHP
