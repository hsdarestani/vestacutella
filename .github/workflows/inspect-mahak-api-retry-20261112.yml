name: Read only Mahak API retry diagnostics for Liora
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-mahak-api-retry-20261112.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect Mahak cloud catalog response twice without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M -d max_execution_time=90 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $api=new BazaraApi(true);
          for($i=1;$i<=2;$i++){
            $login=$api->login_token();
            echo 'ATTEMPT_'.$i.'_LOGIN='.((is_array($login)&&!empty($login['success']))?'ok':'failed')."\n";
            $res=$api->get_all_data('',array('fromProductVersion'=>0,'fromProductDetailVersion'=>0));
            echo 'ATTEMPT_'.$i.'_SUCCESS='.((is_array($res)&&!empty($res['success']))?'yes':'no')."\n";
            if(is_array($res)&&!empty($res['success'])){
              $x=$res['message']??[];
              echo 'ATTEMPT_'.$i.'_COUNT='.count($x['Products']??[])."\n";
              $found=0;
              foreach(($x['Products']??[]) as $p)if((string)($p['ProductCode']??'')==='998812')$found++;
              echo 'ATTEMPT_'.$i.'_TEST_CODE_MATCHES='.$found."\n";
            }else{
              echo 'ATTEMPT_'.$i.'_ERROR_KEYS='.implode(',',array_keys((array)$res))."\n";
              $msg=$res['message']??'';
              if(is_string($msg)){
                $msg=preg_replace('/[^\\p{L}\\p{N} _.:\\-]/u','',$msg);
                echo 'ATTEMPT_'.$i.'_ERROR='.mb_substr($msg,0,150)."\n";
              }
            }
            if($i===1)sleep(2);
          }
          echo 'NO_PRODUCT_WRITES=yes'."\n";
          PHP
          REMOTE
