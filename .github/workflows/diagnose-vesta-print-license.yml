name: Diagnose Vesta print license (read only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-vesta-print-license.yml"
      - "scripts/diagnose-vesta-print-license.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostics syntax
        run: bash -n scripts/diagnose-vesta-print-license.sh
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect Vesta printing infrastructure without mutations
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/diagnose-vesta-print-license.sh "root@$HOST:/tmp/vc-diagnose-print-license.sh"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "bash /tmp/vc-diagnose-print-license.sh"