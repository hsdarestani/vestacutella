name: Deploy isolated Liora Mahak product MU bridge with backup
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-liora-mahak-product-20261112.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Download pinned CI-tested Vesta Mahak MU bridge
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 'https://raw.githubusercontent.com/hsdarestani/ordersvesta/9760c8af16db3f8792f1c4579c6e9a7ecea15b79/wordpress/mu-plugins/vesta-mahak-product-bridge.php' -o /tmp/vesta-mahak-product-bridge.php
          test -s /tmp/vesta-mahak-product-bridge.php
      - name: Stage plugin on Vesta production host
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'cat > /tmp/vesta-mahak-product-bridge.php' < /tmp/vesta-mahak-product-bridge.php
      - name: Install MU plugin atomically and verify live read-only template contract
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BASE=/srv/vestacutella/runtime/vesta/wp-content/mu-plugins
          SRC=/tmp/vesta-mahak-product-bridge.php
          TARGET="$BASE/vesta-mahak-product-bridge.php"
          BACKUP_DIR=/srv/vestacutella/backups/maha-product-bridge
          mkdir -p "$BASE" "$BACKUP_DIR"
          test -s "$SRC"
          if test -f "$TARGET"; then
            cp -a "$TARGET" "$BACKUP_DIR/bridge-$(date -u +%Y%m%dT%H%M%SZ).php"
          fi
          cp "$SRC" "$TARGET.tmp"
          chmod 644 "$TARGET.tmp"
          mv -f "$TARGET.tmp" "$TARGET"
          rm -f "$SRC"
          docker exec vc-vesta php -l /var/www/html/wp-content/mu-plugins/vesta-mahak-product-bridge.php
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M -d max_execution_time=75 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          echo 'MU_BRIDGE_LOADED='.(function_exists('vmb_template')?'yes':'no')."\n";
          if(!function_exists('vmb_template'))exit(22);
          $result=vmb_template(array('template_code'=>'8079'));
          echo 'TEMPLATE_FOUND='.(isset($result['code']) && (string)$result['code']==='8079'?'yes':'no')."\n";
          echo 'TEMPLATE_CATEGORY='.(int)($result['category_id']??0)."\n";
          echo 'MAHAK_READONLY_TEST_COMPLETE=yes'."\n";
          PHP
          REMOTE
