name: Vesta live stock opening catalog - read only 20261121
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vesta-live-opening-catalog-readonly-20261121.yml
      - scripts/vesta-live-opening-catalog-readonly-20261121.php
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-live-opening-catalog-readonly
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read Woo stock and copy bounded temporary export from source host
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass php-cli
          php -l scripts/vesta-live-opening-catalog-readonly-20261121.php
          opts="-o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          src="/tmp/vesta-export-live-$GITHUB_RUN_ID.php"
          csv="/tmp/vesta-export-live-$GITHUB_RUN_ID.csv"
          err="/tmp/vesta-export-live-$GITHUB_RUN_ID.err"
          sshpass -e scp $opts scripts/vesta-live-opening-catalog-readonly-20261121.php "root@$HOST:$src"
          sshpass -e ssh $opts "root@$HOST" "SRC='$src' CSV='$csv' ERR='$err' bash -s" <<'REMOTE'
          set -u
          docker exec -i vc-vesta php -d display_errors=1 -d log_errors=1 -d error_log=/dev/stderr -d memory_limit=512M < "$SRC" > "$CSV" 2> "$ERR"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "EXPORT_EXIT=$status"
            tail -c 3000 "$ERR" | sed -E 's/(password|secret|token)=[^[:space:]]+/REDACTED/Ig'
            exit "$status"
          fi
          test -s "$CSV"
          test "$(wc -l < "$CSV")" -gt 4000
          echo "EXPORT_ROWS=$(($(wc -l < "$CSV")-1))"
          tail -c 2000 "$ERR"
          REMOTE
          sshpass -e scp $opts "root@$HOST:$csv" vesta-live-catalog.csv
          sshpass -e scp $opts "root@$HOST:$err" live-catalog-metadata.txt
          sshpass -e ssh $opts "root@$HOST" "rm -f '$src' '$csv' '$err'"
          echo "CSV_ROWS=$(($(wc -l < vesta-live-catalog.csv)-1))"
          echo "SNAPSHOT_SHA256=$(sha256sum vesta-live-catalog.csv | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: vesta-live-opening-catalog-20261121
          path: |
            vesta-live-catalog.csv
            live-catalog-metadata.txt
          retention-days: 3
          if-no-files-found: error
