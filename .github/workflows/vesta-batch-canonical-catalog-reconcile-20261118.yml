name: Vesta reconcile all deterministic Mahak parent codes and variation details in guarded batches
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-batch-canonical-catalog-reconcile-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-reconcile-canonical-catalog
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact migration worker
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l scripts/vesta-canonical-catalog-reconcile-20261118.php
      - name: Backup each batch and reconcile at most 30 proven products at a time
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/vesta-canonical-catalog-reconcile-20261118.php "root@$HOST:/tmp/vesta-canonical-catalog-reconcile-20261118.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-bazara-repair-full-catalog.lock
          flock -n 9
          source=/tmp/vesta-canonical-catalog-reconcile-20261118.php
          root=/srv/backups/vesta-canonical-sitewide-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$root"
          docker exec -i vc-vesta php -l < "$source"
          totals=0
          for n in $(seq 1 7);do
            dir="$root/batch-$n"
            mkdir -m 0700 -p "$dir"
            timeout 260 docker exec -i -e VESTA_CATALOG_BATCH=30 -e VESTA_CATALOG_COMMIT=no \
              vc-vesta php -d display_errors=0 -d memory_limit=1536M < "$source" | tee "$dir/preflight.log"
            grep -Fq 'CATALOG_CANONICAL_DRY_RUN_NO_CHANGES=yes' "$dir/preflight.log"
            expected=$(grep -F 'VESTA_CANONICAL_CATALOG_PLAN=' "$dir/preflight.log" | tail -1 |
              sed 's/^VESTA_CANONICAL_CATALOG_PLAN=//' |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["eligible"])')
            echo "BATCH=$n ELIGIBLE=$expected"
            if [[ "$expected" == 0 ]];then
               echo 'NO_MORE_STRICTLY_ELIGIBLE_CANONICAL_CATALOG_REPAIRS=yes';break
            fi
            # Every individual group transaction has its own immutable-field verification,
            # and every group is protected by a verified full product/media metadata backup.
            docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb-dump -uroot --single-transaction --quick "$MARIADB_DATABASE" wp_posts wp_postmeta wp_wc_product_meta_lookup' | gzip -1 > "$dir/before.sql.gz"
            gzip -t "$dir/before.sql.gz"
            (cd "$dir";sha256sum before.sql.gz > SHA256SUMS;sha256sum -c SHA256SUMS)
            echo "BATCH=$n BACKUP_VERIFIED=yes"
            timeout 260 docker exec -i -e VESTA_CATALOG_BATCH=30 -e VESTA_CATALOG_COMMIT=yes \
              -e VESTA_CATALOG_BACKUP_VERIFIED=yes \
              vc-vesta php -d display_errors=0 -d memory_limit=1536M < "$source" | tee "$dir/commit.log"
            grep -Fq 'NO_ORDER_PRICE_STOCK_IMAGE_REMOTE_WRITES=yes' "$dir/commit.log"
            count=$(sed -n 's/^CATALOG_CANONICAL_BATCH_DONE=\([0-9]*\) .*/\1/p' "$dir/commit.log" | tail -1)
            [[ "$count" =~ ^[0-9]+$ ]] || exit 31
            test "$count" -le 30
            echo "BATCH=$n MAPPED=$count"
            totals=$((totals+count))
            if [ "$count" = 0 ];then break;fi
          done
          echo "CANONICAL_TOTAL_MIGRATED_THIS_RUN=$totals"
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code";test "$code" = 200
          done
          echo 'CANONICAL_BATCH_WORKFLOW_FINISHED_SAFELY=yes'
          REMOTE
