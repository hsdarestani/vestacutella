name: Vesta verify actual store inventory asset for Woo 105617
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-105617-actual-store-asset-audit-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read inventory assets, selected store and vendor asset totals without mutation
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1280M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $table=$wpdb->prefix.'bazara_product_assets';
          $cols=$wpdb->get_col("SHOW COLUMNS FROM $table",0);
          echo 'ASSET_SCHEMA_FIELDS='.json_encode($cols).PHP_EOL;
          $rows=$wpdb->get_results($wpdb->prepare("SELECT * FROM $table WHERE ProductDetailId=%d ORDER BY StoreId LIMIT 30",12269305),ARRAY_A);
          $safe=[];
          foreach($rows as $r) {
            $item=[];foreach($r as $k=>$v)if(preg_match('/ProductDetail|Count|Store|RowVersion|Deleted|Asset|Id/i',$k))$item[$k]=$v;
            $safe[]=$item;
          }
          echo 'BOOK_105617_STORE_ASSET_ROWS='.json_encode($safe,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $s=get_bazara_visitor_settings();$safeS=[];
          foreach($s as $k=>$v)if(preg_match('/Store|Warehouse|Stock|Quantity/i',$k)&&is_scalar($v))$safeS[$k]=$v;
          echo 'SELECTED_BAZARA_STORE_OPTIONS='.json_encode($safeS).PHP_EOL;
          $api=vmb_api();$catalog=vmb_catalog($api);
          $keys=[];foreach($catalog as $k=>$v)if(preg_match('/store|asset|quantity|stock/i',(string)$k))$keys[$k]=is_array($v)?count($v):gettype($v);
          echo 'CLOUD_CATALOG_ASSET_KEYS='.json_encode($keys).PHP_EOL;
          $check=$wpdb->get_results("SELECT StoreId,COUNT(*) rows_count,COUNT(DISTINCT ProductDetailId) detail_count
             FROM $table WHERE Deleted=0 GROUP BY StoreId ORDER BY rows_count DESC LIMIT 12",ARRAY_A);
          echo 'ACTIVE_ASSET_STORE_SUMMARY='.json_encode($check).PHP_EOL;
          if(function_exists('get_product_asset_quantity')){
            foreach($check as $row) {
              $store=(int)$row['StoreId'];
              echo 'BOOK_NATIVE_ASSET_QUANTITY_FOR_STORE_'.$store.'='.get_product_asset_quantity(12269305,$store).PHP_EOL;
            }
          }
          $p=wc_get_product(105617);
          echo 'CURRENT_BOOK_SITE_STOCK='.json_encode([
            'manage_stock'=>$p->get_manage_stock(),
            'stock_quantity'=>$p->get_stock_quantity(),
            'stock_status'=>$p->get_stock_status(),
            'status'=>$p->get_status()
          ]).PHP_EOL;
          echo 'ACTUAL_ASSET_READ_ONLY=yes'.PHP_EOL;
          PHP
