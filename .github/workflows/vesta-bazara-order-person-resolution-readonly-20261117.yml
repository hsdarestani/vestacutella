name: Vesta inspect person id selection when saving an order to Mahak
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-bazara-order-person-resolution-readonly-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Examine Bazara outbound invoice person's lookup rules without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $r=new ReflectionClass('BazaraApi');$lines=file($r->getFileName());
          foreach(['bazara_save_order','start_sync_orders'] as $name) {
             $ref=$r->getMethod($name);$start=$ref->getStartLine()-1;$end=$ref->getEndLine()-1;
             echo 'METHOD_PERSON_CONTEXT_BEGIN='.$name.' LINES='.($end-$start+1).PHP_EOL;
             $matches=[];
             for($i=$start;$i<=$end;$i++)if(preg_match('/mahak_id|personid|person_id|customer_id|CustomerId|PersonClientId|register_user_in_order|personClientId/i',$lines[$i]))$matches[]=$i;
             $seen=[];foreach($matches as $hit){for($j=max($start,$hit-3);$j<=min($end,$hit+3);$j++){if(isset($seen[$j]))continue;$seen[$j]=1; $s=$lines[$j];if(preg_match('/password|authorization|secret/i',$s))continue;echo ($j+1).' '.trim($s).PHP_EOL;}}
             echo 'METHOD_PERSON_CONTEXT_END='.$name.PHP_EOL;
          }
          echo 'READ_ONLY_NO_FINANCIAL_OR_PERSON_MUTATION=yes'.PHP_EOL;
          PHP
