name: Diagnose four unmatched Vesta Bazaar variations read-only
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-four-vesta-variants-20261111.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Resolve unmatched SKU, remote variant property, current order acknowledgments
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "AUDIT_UTC=$(date -u +%FT%TZ)"
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          global $wpdb;
          foreach([94734,37823,37824,42934] as $vid){
             $p=get_post($vid);$parent=get_post($p->post_parent);
             $sk=get_post_meta($vid,'_sku',true);$skp=get_post_meta($parent->ID,'_sku',true);
             echo "VARIANT=".$vid." PARENT=".$parent->ID." TITLE=".str_replace(["\n","\r"],' ',$parent->post_title)."\n";
             echo "VAR_SKU=".$sk." PARENT_SKU=".$skp."\n";
             foreach(get_post_meta($vid) as $k=>$v)if(str_starts_with($k,'attribute_')) echo "WOO_ATTR=".$k." VALUE=".($v[0]??'')."\n";
             $rows=$wpdb->get_results($wpdb->prepare("SELECT ProductId,ProductName,ProductCode,Deleted FROM {$wpdb->prefix}bazara_products WHERE ProductName=%s OR ProductCode=%s OR ProductCode=%s LIMIT 12",$parent->post_title,$sk,$skp));
             echo "REMOTE_PARENT_EXACT_OR_SKU_MATCHES=".count($rows)."\n";
             foreach($rows as $rr){
               echo "REMOTE_PARENT ProductId=".$rr->ProductId." ProductCode=".$rr->ProductCode." Name=".$rr->ProductName." Deleted=".$rr->Deleted."\n";
               $ds=$wpdb->get_results($wpdb->prepare("SELECT ProductDetailId,Properties,Deleted FROM {$wpdb->prefix}bazara_product_details WHERE ProductId=%d",$rr->ProductId));
               foreach($ds as $d)echo "REMOTE_DETAIL ID=".$d->ProductDetailId." PROPERTIES=".$d->Properties." DELETED=".$d->Deleted."\n";
             }
             if(!$rows){
               $words=explode(' ',trim($parent->post_title));$word=$words[0]??'';
               $look=$wpdb->get_results($wpdb->prepare("SELECT ProductId,ProductName,ProductCode FROM {$wpdb->prefix}bazara_products WHERE ProductName LIKE %s LIMIT 8",'%'.$wpdb->esc_like($word).'%'));
               foreach($look as $rr)echo "SIMILAR_REMOTE_PRODUCT=".$rr->ProductId." CODE=".$rr->ProductCode." NAME=".$rr->ProductName."\n";
             }
          }
          PHP
          echo '===== ORDER SYNC STATE SINCE REPAIR ====='
          docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4' <<'SQL'
          SELECT p.ID,p.post_status,
            COALESCE(MAX(CASE WHEN m.meta_key='mahak_id' THEN m.meta_value END),'') AS mahak,
            (SELECT COUNT(*) FROM wp_bazara_orders b WHERE b.OrderClientId=p.ID) AS bazara_cloud_cached
          FROM wp_posts p LEFT JOIN wp_postmeta m ON m.post_id=p.ID AND m.meta_key='mahak_id'
          WHERE p.ID IN(105219,105220,105221,105223,105225,105226,105227,105228,105230)
          GROUP BY p.ID,p.post_status ORDER BY p.ID;
          SQL
          echo FOUR_UNMATCHED_VARIANT_AUDIT_FINISHED=yes
          REMOTE
