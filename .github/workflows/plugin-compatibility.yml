name: Plugin compatibility check

on:
  push:
    branches: [main]
    paths:
      - "scripts/plugin-compatibility.sh"
      - ".github/workflows/plugin-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Check PHP and disabled plugins
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/plugin-compatibility.sh "root@$HOST:/tmp/plugin-compatibility.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/plugin-compatibility.sh'
