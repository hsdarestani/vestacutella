name: Vesta verify fresh Mahak photo metadata available on demand
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-photo-on-demand-source-audit-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check photo/gallery cloud response and cached coverage read-only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          foreach(['bazara_pictures','bazara_photo_gallery'] as $s){
            echo 'CACHE_'.$s.'_COUNT='.(int)$wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->prefix}$s").PHP_EOL;
            echo 'CACHE_'.$s.'_MAX_ROW_VERSION='.(string)$wpdb->get_var("SELECT MAX(RowVersion) FROM {$wpdb->prefix}$s").PHP_EOL;
          }
          $api=new BazaraApi(true);
          foreach([
            ['fromPictureVersion'=>0,'fromPhotoGalleryVersion'=>0],
            ['fromPictureVersion'=>0,'fromPhotoGalleryVersion'=>0,'fromPhotoGalleryItemVersion'=>0]
          ] as $options) {
            $r=$api->get_all_data('',$options);
            $ok=is_array($r)&&!empty($r['success'])&&is_array($r['message']??null);
            echo 'PHOTO_SOURCE_READ_SUCCESS='.($ok?'yes':'no').PHP_EOL;
            if(!$ok)continue;
            $m=$r['message'];$shape=[];
            foreach($m as $k=>$v)if(preg_match('/picture|photo|gallery/i',(string)$k))$shape[$k]=is_array($v)?count($v):gettype($v);
            echo 'PHOTO_SOURCE_ENTITY_COUNTS='.json_encode($shape).PHP_EOL;
            foreach($m as $k=>$values){
              if(!is_array($values)||!preg_match('/picture|photo|gallery/i',(string)$k))continue;
              $match=0;$idMatch=0;
              foreach($values as $row){
                if(!is_array($row))continue;
                if((int)($row['PictureId']??$row['pictureId']??0)===1887347)$match++;
                if((int)($row['ItemCode']??$row['itemCode']??0)===10755477)$idMatch++;
              }
              echo 'PHOTO_SOURCE_CANARY_MATCH_'.$k.'='.$match.' RELATION_MATCH='.$idMatch.PHP_EOL;
            }
            break;
          }
          echo 'NO_PRODUCT_OR_PICTURE_WRITES=yes'.PHP_EOL;
          PHP
