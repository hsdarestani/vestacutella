name: Vesta verify three misassigned admin orders can be repaired without touching invoices
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-three-verified-admin-orders-dryrun-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
      - name: Preflight PHP source
        run: php -l scripts/repair-vesta-privileged-order-owners-20261117.php
      - name: Read-only preview with existing protected sender left enabled
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i -e VC_PRIV_OWNER_COMMIT=no vc-vesta php -d memory_limit=768M -d display_errors=0' < scripts/repair-vesta-privileged-order-owners-20261117.php | tee plan.log
          grep -Fq 'NO_ERP_FINANCIAL_WRITES=yes' plan.log
          if grep -q '^PRIV_OWNER_REPAIR_SUMMARY=' plan.log;then echo 'SAFE_PREVIEW_EXECUTED=yes';else exit 15;fi
