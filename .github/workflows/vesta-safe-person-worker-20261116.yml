name: Vesta bounded Mahak person worker — dry-run validation before scheduled launch
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-safe-person-worker-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
      - run: php -l scripts/vesta-safe-person-worker-20261116.php
      - name: Read-only bounded customer provisioning candidate plan
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i -e VC_PERSON_MAX_BATCH=5 vc-vesta php -d memory_limit=1024M -d display_errors=0' < scripts/vesta-safe-person-worker-20261116.php
