name: Vesta bounded Mahak person worker — dry-run validation before scheduled launch
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-safe-person-worker-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
      - run: php -l scripts/vesta-safe-person-worker-20261116.php
      - name: Read-only bounded customer provisioning candidate plan
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i -e VC_PERSON_MAX_BATCH=5 vc-vesta php -d memory_limit=1024M -d display_errors=0' < scripts/vesta-safe-person-worker-20261116.php
      - name: Backup, provision five verified persons, then install bounded recurring cron
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'SHELL'
          set -Eeuo pipefail
          backup=/srv/backups/vesta-safe-person-worker-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb-dump -uroot --single-transaction --quick "$MARIADB_DATABASE" wp_users wp_usermeta wp_bazara_persons' | gzip -1 > "$backup/person-data-before.sql.gz"
          gzip -t "$backup/person-data-before.sql.gz"
          sha256sum "$backup/person-data-before.sql.gz" > "$backup/sha256.txt"
          echo 'SAFE_WORKER_PERSON_BACKUP_VERIFIED=yes'
          SHELL
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i -e VC_PERSON_WORKER_COMMIT=yes -e VC_PERSON_MAX_BATCH=5 vc-vesta php -d memory_limit=1024M -d display_errors=0' < scripts/vesta-safe-person-worker-20261116.php | tee person-worker-first-batch.log
          test "$(grep -c '^PERSON_WORKER_CLOUD_VERIFIED' person-worker-first-batch.log)" -eq 5
          grep -Fq 'NO_INVOICE_WRITES=yes' person-worker-first-batch.log
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-safe-person-worker-20261116.php "root@$HOST:/tmp/vesta-safe-person-worker-20261116.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'SHELL'
          set -Eeuo pipefail
          install -m 0644 /tmp/vesta-safe-person-worker-20261116.php /srv/vestacutella/repo/scripts/vesta-safe-person-worker-20261116.php
          docker exec -i vc-vesta php -l < /srv/vestacutella/repo/scripts/vesta-safe-person-worker-20261116.php
          cat >/etc/cron.d/vesta-safe-person-worker <<'CRON'
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          */5 * * * * root flock -n /run/lock/vesta-safe-person-worker.lock timeout 240 bash -c 'docker exec -u www-data -i -e VC_PERSON_WORKER_COMMIT=yes -e VC_PERSON_MAX_BATCH=1 vc-vesta php -d memory_limit=1024M -d display_errors=0 < /srv/vestacutella/repo/scripts/vesta-safe-person-worker-20261116.php' >> /var/log/vesta-safe-person-worker.log 2>&1
          CRON
          chmod 0644 /etc/cron.d/vesta-safe-person-worker
          systemctl is-active --quiet cron
          echo 'ONE_PERSON_PER_FIVE_MINUTES_CRON_ENABLED=yes'
          SHELL
          echo 'SAFE_PERSON_WORKER_STARTED_WITH_FIVE_SUCCESSFUL_CANARIES=yes'
