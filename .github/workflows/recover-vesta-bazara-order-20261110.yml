name: Recover one previously missed Bazara order (guarded)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-vesta-bazara-order-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-vesta-bazara-manual-order-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and anti-duplicate guards
        run: |
          set -euo pipefail
          bash -n scripts/vesta-bazara-replay-order-20261110.sh
          grep -Fq 'ORDER_REPLAY_VERIFIED=yes' scripts/vesta-bazara-replay-order-20261110.sh
          grep -Fq 'LOCAL_ERP_MATCHES' scripts/vesta-bazara-replay-order-20261110.php
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Send exactly one previously missed order, verify local ERP acknowledgment
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          for file in scripts/vesta-bazara-replay-order-20261110.php scripts/vesta-bazara-replay-order-20261110.sh; do
            sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$file" "root@$HOST:/tmp/$(basename "$file")"
          done
          sshpass -e ssh -o ConnectTimeout=12 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/vesta-bazara-replay-order-20261110.sh 105052'
