name: Vesta check photographed Mahak eyebrow pencil price and stock transfer
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-check-photo-mahak-eyebrow-pencil-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check source item by name and screenshot code, Woo price, true warehouse stock, and sync
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          echo 'PENCIL_AUDIT_UTC='.gmdate('c').PHP_EOL;
          $catalog=vmb_catalog(vmb_api());$goods=[];
          $matchingCodes=['92503','93503','94503','92502','93502'];
          foreach(($catalog['Products']??[]) as $g) {
             if(!empty($g['Deleted']))continue;
             $name=(string)($g['Name']??'');$code=(string)($g['ProductCode']??'');
             if((mb_stripos($name,'مداد',0,'UTF-8')!==false && mb_stripos($name,'ابرو',0,'UTF-8')!==false)
                  || in_array($code,$matchingCodes,true)) $goods[]=$g;
          }
          echo 'PENCIL_CLOUD_MATCH_COUNT='.count($goods).PHP_EOL;
          $dsByGood=[];
          foreach(($catalog['ProductDetails']??[]) as $d){
            if(!empty($d['Deleted']))continue;
            $pid=(int)($d['ProductId']??0);
            $dsByGood[$pid][]=$d;
          }
          $rows=[];
          foreach($goods as $g){
            $gid=(int)$g['ProductId'];$code=(string)$g['ProductCode'];$ds=$dsByGood[$gid]??[];
            $matches=[];
            $exactId=(int)wc_get_product_id_by_sku($code);
            $candidateIds=[];
            if($exactId)$candidateIds[]=$exactId;
            $linked=$wpdb->get_col($wpdb->prepare("SELECT post_id FROM {$wpdb->postmeta}
                 WHERE meta_key='mahak_id' AND meta_value=%s LIMIT 20",(string)$gid));
            foreach($linked as $id)$candidateIds[]=(int)$id;
            foreach(array_unique($candidateIds) as $id){
              $p=wc_get_product($id);if(!$p)continue;
              $matches[]=[
                'woo_id'=>$id,'type'=>$p->get_type(),'parent_id'=>$p->get_parent_id(),
                'status'=>$p->get_status(),'sku'=>$p->get_sku(),'name'=>$p->get_name(),
                'mahak_id'=>(int)$p->get_meta('mahak_id',true),
                'mahak_detail_id'=>(int)$p->get_meta('mahak_product_detail_id',true),
                'regular_price'=>$p->get_regular_price(),'price'=>$p->get_price(),
                'stock_qty'=>$p->get_stock_quantity(),'manage_stock'=>$p->get_manage_stock(),
                'stock_status'=>$p->get_stock_status(),'image_id'=>$p->get_image_id()
              ];
            }
            $details=[];
            foreach(array_slice($ds,0,15) as $d){
              $did=(int)$d['ProductDetailId'];
              $assets=$wpdb->get_results($wpdb->prepare(
                 "SELECT StoreId,Count1,Count2,Deleted FROM {$wpdb->prefix}bazara_product_assets
                  WHERE ProductDetailId=%d AND Deleted=0 LIMIT 8",$did),ARRAY_A);
              $details[]=[
                'id'=>$did,'price1'=>$d['Price1']??null,'price2'=>$d['Price2']??null,
                'default_sell_level'=>$d['DefaultSellPriceLevel']??null,
                'count1_detail'=>$d['Count1']??null,'props'=>$d['Properties']??null,
                'warehouse_assets'=>$assets
              ];
            }
            $rows[]=[
              'code'=>$code,'cloud_name'=>$g['Name'],'erp_good_id'=>$gid,
              'detail_count'=>count($ds),'details'=>$details,'woocommerce_records'=>$matches
            ];
          }
          echo 'PENCIL_ITEM_MATCHES='.wp_json_encode($rows,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $local=$wpdb->get_results("SELECT ProductId,ProductCode,ProductName,Deleted FROM {$wpdb->prefix}bazara_products
             WHERE ProductName LIKE '%مداد%' AND ProductName LIKE '%ابرو%' LIMIT 35",ARRAY_A);
          echo 'PENCIL_LOCAL_BAZARA_MATCHES='.wp_json_encode($local,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $auto=get_option('vesta_mhi_auto_last_report',null);
          echo 'PENCIL_AUTO_IMPORT_LAST_REPORT='.wp_json_encode([
            'completed_at'=>$auto['completed_at']??null,
            'new_drafts'=>$auto['new_drafts']??null,
            'completed_existing'=>$auto['completed_existing']??null,
            'errors'=>$auto['errors']??null],JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'PENCIL_AUDIT_READ_ONLY=yes'.PHP_EOL;
          PHP
