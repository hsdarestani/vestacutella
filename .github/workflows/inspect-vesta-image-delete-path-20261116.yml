name: Inspect Vesta image deletion and variation linking before safe patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-vesta-image-delete-path-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Print limited relevant PHP code and current safe sync state
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import re
          root=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara')
          specs=[
            ('classes/class.products.table.php',[(60,140),(287,335)]),
            ('classes/class.bazara.api.php',[(1916,2085)]),
            ('classes/functions.php',[(3220,3250)]),
          ]
          for name, ranges in specs:
            lines=(root/name).read_text(encoding='utf8',errors='replace').splitlines()
            for lo,hi in ranges:
              print('SOURCE_BLOCK',name,lo,hi)
              for i in range(lo-1,min(hi,len(lines))):
                s=lines[i].rstrip()
                if re.search(r'password|secret|token|authorization|api.?key|https?://',s,re.I):s='[REDACTED]'
                print('CODE',i+1,s[:260])
          PY
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0' <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';require '/var/www/html/wp-load.php';
          $opts=get_option('bazara_visitor_settings',[]);
          echo 'PICTURE_SYNC_FLAG='.((string)($opts['chkPicture']??'')?:'disabled').PHP_EOL;
          echo 'PRODUCT_SYNC_FLAG='.((string)($opts['chkProduct']??'')?:'disabled').PHP_EOL;
          echo 'READ_ONLY_NO_CHANGES=yes'.PHP_EOL;
          PHP
