name: Check invoice products in Mahak cloud and Bazara cache read only
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-liora-invoice-products-readonly-20261113.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read accounting catalog for selected invoice names
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          docker exec -i vc-vesta php -d memory_limit=768M -d max_execution_time=170 -d display_errors=0 <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          global $wpdb;
          $api=vmb_api();
          $catalog=vmb_catalog($api);
          $prods=$catalog['Products']??[];
          echo 'CLOUD_PRODUCT_COUNT='.count($prods)."\n";
          $local=$wpdb->prefix.'bazara_products';
          echo 'LOCAL_PRODUCT_COUNT='.(int)$wpdb->get_var("SELECT COUNT(*) FROM `".$local."`")."\n";
          $terms=['شیر اپ','شیرآپ','براش رژگونه درپوش','براش کانسیلر','براش مینی','براش رژگونه','براش کرمپودر','پودر فیکس فشرده','سایه مک','سایه تک رنگ','نوو','NOVO','TَUZ','TUZ','براش رژگونه','درب پوش'];
          foreach($terms as $term){
            $hits=[];
            foreach($prods as $p){
              $p=(array)$p;
              if(!empty($p['Deleted']))continue;
              $name=(string)($p['Name']??'');
              $norm=str_replace(['ي','ك','‌'],['ی','ک',' '],$name);
              if(mb_stripos($norm,$term,0,'UTF-8')!==false){
                $hits[]=array('id'=>$p['ProductId']??0,'code'=>$p['ProductCode']??'','name'=>$name);
                if(count($hits)>=12)break;
              }
            }
            echo 'MATCH '.json_encode($term,JSON_UNESCAPED_UNICODE).' '.json_encode($hits,JSON_UNESCAPED_UNICODE)."\n";
          }
          $ids=array_map(fn($p)=>(int)($p['ProductId']??0),$prods);
          echo 'MAX_PRODUCT_ID='.(count($ids)?max($ids):0)."\n";
          $sorted=$prods;
          usort($sorted,fn($a,$b)=>(int)($b['ProductId']??0)<=>(int)($a['ProductId']??0));
          $latest=[];
          foreach(array_slice($sorted,0,8) as $p){
            $latest[]=array('id'=>$p['ProductId']??0,'code'=>$p['ProductCode']??'','name'=>$p['Name']??'');
          }
          echo 'HIGH_IDS='.json_encode($latest,JSON_UNESCAPED_UNICODE)."\n";
          echo 'NO_WRITES=YES'."\n";
          PHP
          REMOTE
