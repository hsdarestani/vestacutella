name: Inspect remaining accounting uncertainty without resubmission
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-accounting-unresolved-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Independent real recent invoices, bank transfers and queue checks
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d memory_limit=768M -d display_errors=0' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          if(!class_exists('Vesta_Accounting_Reliability'))exit(20);
          $api=new BazaraApi(true);$cloud=Vesta_Accounting_Reliability::cloud($api);
          $s=get_option('bazara_visitor_settings',[]);
          echo 'SEND_BANK_SETTING='.json_encode($s['chkBankOrder']??null)."\n";
          $c=['eligible'=>0,'remote_verified'=>0,'remote_mismatch'=>0,'remote_missing'=>0,'missing_mapping'=>0];
          $ids=$wpdb->get_col("SELECT ID FROM {$wpdb->posts} WHERE post_type='shop_order' AND post_date_gmt>='2026-11-12 00:00:00'");
          foreach($ids as $id){
           $id=(int)$id;$o=wc_get_order($id);if(!vcar_eligible($o))continue;$c['eligible']++;
           $bank=vcar_bank($s,$o->get_payment_method());$rows=$cloud['orders'][$id]??[];
           if(count($rows)!==1){$c['remote_missing']++;$reason=Vesta_Accounting_Reliability::preflight($o,$bank);if($reason==='missing_product_mapping')$c['missing_mapping']++;echo 'RECENT_PENDING='.$id.' REASON='.$reason."\n";continue;}
           $r=$rows[0];$erp=(int)$r['OrderId'];
           $reason=vcar_verify($o,$r,$cloud['details'][$erp]??[],$cloud['receipts'][$erp]??[],$bank,$cloud['transfers']);
           if($reason){$c['remote_mismatch']++;echo 'CANARY_MISMATCH='.$id.' REASON='.$reason."\n";}
           else{$c['remote_verified']++;echo 'CANARY_VERIFIED_ORDER='.$id.' CLOUD_INVOICE='.$erp."\n";}
          }
          echo 'RECENT_EXACT_VERIFICATION='.json_encode($c)."\n";
          echo 'OUTBOX_COUNTS='.json_encode($wpdb->get_results('SELECT state,reason,COUNT(*) n FROM '.Vesta_Accounting_Reliability::table().' GROUP BY state,reason',ARRAY_A))."\n";
          echo 'CATALOG='.json_encode(get_option('vcar_catalog_status'))."\n";
          echo 'HEARTBEAT='.json_encode(get_option('vcar_heartbeat'))."\n";
          echo 'SENDER_ENABLED='.json_encode(get_option('vcar_sender_enabled',false))."\n";
          $t=Vesta_Accounting_Reliability::table();
          foreach($wpdb->get_results("SELECT order_id,state,attempts,submitted_at FROM $t WHERE state IN ('uncertain','sending','pending') ORDER BY order_id DESC LIMIT 20",ARRAY_A) as $q){
            echo 'UNRESOLVED_STATE='.json_encode($q)."\n";
            $err=get_post_meta($q['order_id'],'mahak_error',true);
            echo 'LOCAL_ERROR_ORDER='.(int)$q['order_id'].' TYPE='.gettype($err).' LENGTH='.strlen((string)$err)."\n";
            $v=$err;for($i=0;$i<3&&is_string($v);$i++){$p=json_decode($v,true);if(json_last_error()!==JSON_ERROR_NONE)break;$v=$p;}
            $raw=(string)$err;
            echo 'ERROR_RAW_CLASS_FLAGS='.json_encode(['result_false'=>(bool)preg_match('/Result[^a-zA-Z0-9]*(false|0)/i',$raw),'timeout'=>(bool)preg_match('/timeout|timed out|مهلت/i',$raw),'http_5xx'=>(bool)preg_match('/50[234]/',$raw),'json_valid'=>json_last_error()===JSON_ERROR_NONE])."\n";
            if(!is_array($v)&&preg_match('/"message":"(.*)"\\s*}$/s',$raw,$m)){$candidate=json_decode($m[1],true);if(is_array($candidate))$v=$candidate;}
            $walk=function($v,$path='')use(&$walk){
              if(!is_array($v))return;
              foreach($v as $k=>$x){
                $p=$path.'.'.$k;
                if(is_array($x))$walk($x,$p);
                elseif(preg_match('/^(Result|ErrorCode|Code|EntityId|Success)$/i',(string)$k) && (is_numeric($x)||is_bool($x)))echo 'ERROR_SAFE_FIELD='.$p.' VALUE='.json_encode($x)."\n";
                elseif(preg_match('/message|error/i',(string)$k)&&is_string($x)){
                 $c=[];foreach(['موجودی'=>'stock','شخص'=>'person','کالا'=>'product','تکرار'=>'duplicate','زمان'=>'timeout','stock'=>'stock','person'=>'person','product'=>'product','duplicate'=>'duplicate','timeout'=>'timeout','shipping'=>'shipping','tax'=>'tax','fee'=>'fee','total'=>'total'] as $needle=>$tag)if(stripos($x,$needle)!==false)$c[$tag]=1;
                 echo 'ERROR_MESSAGE_CLASS='.$p.' TAGS='.implode(',',array_keys($c)).' LENGTH='.strlen($x)."\n";
                 $words=['object','reference','not','set','instance','invalid','token','bank','receipt','cheque','database','connection','login','access','permission','exception','client','required','date','year','fiscal','detail','account','amount','format','save','null','entity','already','exists','device','serial','license','limit','transaction','deadlock','unique','key','network','internal','request','try','again','software','sync','server','data','input','خطا','اطلاعات','شناسه','دسترسی','نرم','افزار','ارتباط','سرور','مجوز','تعداد','مقدار','پایگاه','داده','کاربر','حساب','محدود','چک','رسید','بانک','مبلغ','واحد','ثبت','تاریخ','سال','مالی','تسویه','مجدد','سند','فاکتور','موجودی','درخواست','تکراری','نامعتبر','نوع','اجباری','پذیرش','زمان','ذخیره','شماره','ارجاع','پشتیبانی','مجاز'];
                 $safe=[];foreach($words as $word)if(stripos($x,$word)!==false)$safe[]=$word;
                 echo 'ERROR_DICTIONARY_TERMS='.implode(',',$safe)."\n";

                }
              }
            };$walk($v);
            echo 'LOCAL_ACK_ORDER='.(int)$q['order_id'].' ID='.(int)get_post_meta($q['order_id'],'mahak_id',true)."\n";
          }
          echo 'NO_REMOTE_WRITES=yes'."\n";
          PHP
