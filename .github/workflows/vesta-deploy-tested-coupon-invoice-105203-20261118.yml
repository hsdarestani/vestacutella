name: Vesta deploy regression-tested safe coupon validation for existing invoice 105203
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-deploy-tested-coupon-invoice-105203-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-accounting-policy-verified-coupon-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Policy tests including 105203 exact coupon, wrong-line bank and shipping negative cases
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l infra/plugins/vesta-accounting-reliability/vesta-accounting-policy.php
          php tests/accounting-policy-test.php infra/plugins/vesta-accounting-reliability/vesta-accounting-policy.php
          php tests/accounting-outbox-test.php infra/plugins/vesta-accounting-reliability/vesta-accounting-reliability.php
          echo 'HEADER_COUPON_AND_OUTBOX_REGRESSION_TESTS_PASS=yes'
      - name: Stage validated policy and atomically deploy only exact version with live rollback
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/plugins/vesta-accounting-reliability/vesta-accounting-policy.php "root@$HOST:/tmp/vesta-header-coupon-exact-20261117.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-header-coupon-policy-deploy.lock
          flock -n 9
          target=/srv/vestacutella/runtime/vesta/wp-content/mu-plugins/vesta-accounting-policy.php
          test -f "$target"
          backup=/srv/backups/vesta-strict-header-coupon-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$backup"
          cp -p "$target" "$backup/vesta-accounting-policy.php"
          (cd "$backup";sha256sum vesta-accounting-policy.php > SHA256SUMS;sha256sum -c SHA256SUMS)
          echo 'ACCOUNTING_POLICY_BACKUP_CHECKSUM_VERIFIED=yes'
          docker exec -i vc-vesta php -l < /tmp/vesta-header-coupon-exact-20261117.php
          python3 - "$target" /tmp/vesta-header-coupon-exact-20261117.php <<'PY'
          from pathlib import Path
          import sys,difflib
          old=Path(sys.argv[1]).read_text(encoding='utf8')
          new=Path(sys.argv[2]).read_text(encoding='utf8')
          if old==new:print('HEADER_COUPON_POLICY_ALREADY_INSTALLED=yes')
          else:
            diff=list(difflib.unified_diff(old.splitlines(),new.splitlines()))
            if len(diff)>90:raise SystemExit('unrelated_live_policy_drift_abort')
            if 'headerCouponMatch' not in new or 'expectedGross' not in new:raise SystemExit('missing_guard')
            print('EXACT_POLICY_COUPON_GUARD_DIFF_PASS=yes diff_lines='+str(len(diff)))
          PY
          cp -p /tmp/vesta-header-coupon-exact-20261117.php "$target.next"
          chmod --reference="$target" "$target.next"
          chown --reference="$target" "$target.next"
          mv "$target.next" "$target"
          if ! docker exec -i vc-vesta php -l < "$target";then
             cp -p "$backup/vesta-accounting-policy.php" "$target"
             echo 'POLICY_ROLLBACK_SAFELY_COMPLETED=yes';exit 35
          fi
          echo 'STRICT_HEADER_COUPON_VERIFIER_LIVE=yes'
          REMOTE
      - name: Recover exact existing coupon invoice only after independent full financial and person proof
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $id=105203;$o=wc_get_order($id);
          $q=$wpdb->get_row($wpdb->prepare("SELECT state,reason,attempts,remote_id FROM ".Vesta_Accounting_Reliability::table()." WHERE order_id=%d",$id),ARRAY_A);
          if(!$o ||!$q||$q['state']!=='cloud_mismatch'||$q['reason']!=='line_quantity_or_amount'||
             (int)$o->get_meta('mahak_id')!==308569697 ||
             (int)$q['remote_id']!==308569697 || (int)$q['attempts']!==0)exit(41);
          $api=new BazaraApi(true);$cloud=Vesta_Accounting_Reliability::cloud($api);
          $rows=$cloud['orders'][$id]??[];
          if(count($rows)!==1||(int)$rows[0]['OrderId']!==308569697)exit(42);
          $bank=vcar_bank(get_option('bazara_visitor_settings',[]),$o->get_payment_method());
          $err=vcar_verify($o,$rows[0],$cloud['details'][308569697]??[],
             $cloud['receipts'][308569697]??[],$bank,$cloud['transfers'],1);
          $nameError=vcar_identity_guard($o,(int)($rows[0]['PersonId']??0));
          if($err!==''||$nameError!==''||(int)$o->get_discount_total()!==447750||
             (int)$o->get_total()!==2250||(int)$o->get_meta('_vcar_money_multiplier')!==0) {
             echo 'COUPON_INVOICE_NOT_VERIFIED_NO_CHANGES=yes'.PHP_EOL;exit(43);
          }
          $o->update_meta_data('_vcar_money_multiplier',1);$o->save_meta_data();
          $ok=Vesta_Accounting_Reliability::verify($id,$o,$cloud,$bank);
          $state=$wpdb->get_var($wpdb->prepare("SELECT state FROM ".Vesta_Accounting_Reliability::table()." WHERE order_id=%d",$id));
          if(!$ok ||$state!=='verified'||(int)$o->get_meta('mahak_id')!==308569697)exit(44);
          echo 'EXACT_COUPON_ORDER_105203_FULL_CLOUD_BANK_AND_IDENTITY_VERIFIED=yes'.PHP_EOL;
          echo 'EXISTING_ERP_INVOICE_UNCHANGED=308569697 NEW_INVOICE_SUBMISSIONS=0'.PHP_EOL;
          PHP
      - name: Public sites available
        run: |
          set -Eeuo pipefail
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl -LsS --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code";test "$code" = 200
          done