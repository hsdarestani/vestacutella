name: Prepare trusted Vesta Telegram tunnel
on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare-vesta-telegram-tunnel.sh"
      - ".github/workflows/prepare-vesta-telegram-tunnel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Prepare outbound-only SSH key on store, no service changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/prepare-vesta-telegram-tunnel.sh "root@$HOST:/tmp/prepare-vesta-telegram-tunnel.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/prepare-vesta-telegram-tunnel.sh'
