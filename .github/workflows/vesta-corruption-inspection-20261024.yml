name: Vesta corrupt table backup salvage and inspection
on:
  push:
    branches: [main]
    paths: [".github/workflows/vesta-corruption-inspection-20261024.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Save verified noncorrupted SQL backups and inspect failed table
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 65 sshpass -e scp -o ConnectTimeout=18 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-corruption-inspection-20261024.sh "root@$HOST:/tmp/vesta-corruption-inspection-20261024.sh"
          timeout 760 sshpass -e ssh -o ConnectTimeout=18 -o ServerAliveInterval=15 -o ServerAliveCountMax=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/vesta-corruption-inspection-20261024.sh'
