name: Activate and verify the Vesta installer SSH account
on:
  push:
    branches: [main]
    paths: [".github/workflows/activate-vesta-installer-20261107.yml"]
permissions:
  contents: read
concurrency:
  group: vesta-installer-key-enrollment-20261107
  cancel-in-progress: false
jobs:
  enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Install the key and verify that SSH accepts it
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          umask 077
          printf '%s %s\n' "$HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMepyPq2JoyC+n31wd8tBhN707fXYGqkIc0VOaAAbcIC' > "$work/known_hosts"
          ssh_options=(-F /dev/null -o ConnectTimeout=18 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          timeout 100 sshpass -e ssh "${ssh_options[@]}" -T "root@$HOST" 'bash -s' > "$work/installer.pub" <<'REMOTE'
          set -euo pipefail
          umask 077
          account=vesta-installer
          ssh_dir=/home/$account/.ssh
          auth_file=$ssh_dir/authorized_keys
          stage=/run/vesta-key-enrollment-fd1cc789e0cf5c3e
          exec 9>/run/lock/vesta-installer-preparation.lock
          flock -n 9
          test -f "$stage/transport.pem"
          staged_key=
          trap 'if test -n "$staged_key"; then rm -f -- "$staged_key"; fi; rm -rf -- "$stage"' EXIT
          test "$(id -nG "$account")" = "$account"
          test "$(passwd -S "$account" | awk '{print $2}')" = L
          test -d "$ssh_dir" && test ! -L "$ssh_dir"
          test "$(stat -c '%U:%G:%a' "$ssh_dir")" = "$account:$account:700"
          test -f "$auth_file" && test ! -L "$auth_file"
          test ! -s "$auth_file"
          printf '%s' '' | base64 -d | openssl pkeyutl -decrypt -inkey "$stage/transport.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > "$stage/new.pub"
          test "$(wc -l < "$stage/new.pub")" -eq 1
          grep -Eq '^ssh-ed25519 [A-Za-z0-9+/]{68}$' "$stage/new.pub"
          ssh-keygen -lf "$stage/new.pub" >/dev/null
          staged_key=$(mktemp "$ssh_dir/.authorized_keys.XXXXXXXX")
          install -m 600 -o "$account" -g "$account" "$stage/new.pub" "$staged_key"
          mv -T -- "$staged_key" "$auth_file"
          staged_key=
          cmp "$stage/new.pub" "$auth_file"
          test "$(stat -c '%U:%G:%a' "$auth_file")" = "$account:$account:600"
          cat "$auth_file"
          REMOTE
          fingerprint=$(ssh-keygen -E sha256 -lf "$work/installer.pub" | awk '{print $2}')
          if timeout 35 ssh -vv "${ssh_options[@]}" -T -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o PreferredAuthentications=publickey -i "$work/installer.pub" "vesta-installer@$HOST" true > "$work/probe.log" 2>&1; then
            echo 'Unexpected login without a private key'
            exit 1
          fi
          if ! awk -v fp="$fingerprint" '/Server accepts key:/ && index($0, fp) { accepted=1 } END { exit !accepted }' "$work/probe.log"; then
            echo 'The key was written but the external SSH probe did not confirm acceptance'
            exit 1
          fi
          echo 'INSTALLER_SSH_KEY_INSTALLED_AND_ACCEPTED'
