name: Vesta verify legacy admin profile name versus mislinked Mahak customer
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-105554-cloud-name-source-readonly-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check name provenance without exposing any personally identifying information
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M' <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $api=new BazaraApi(true);
          $a=$api->get_all_data('',array('fromPersonVersion'=>0,'fromOrderVersion'=>0));
          if(empty($a['success']))exit(12);
          $p=null;
          foreach(($a['message']['People']??[]) as $c)if((int)($c['PersonId']??0)===12706969){$p=$c;break;}
          if(!$p){echo 'PERSON_NOT_FOUND=yes'.PHP_EOL;exit(13);}
          $name=vcar_identity_normalize_name(($p['FirstName']??'').' '.($p['LastName']??''));
          $u1=get_user_by('id',1);$u2918=get_user_by('id',2918);
          $o203=wc_get_order(105203);$o554=wc_get_order(105554);
          $u1n=$u1?vcar_identity_normalize_name($u1->first_name.' '.$u1->last_name):'';
          $u2918n=$u2918?vcar_identity_normalize_name($u2918->first_name.' '.$u2918->last_name):'';
          $o203n=$o203?vcar_identity_normalize_name($o203->get_billing_first_name().' '.$o203->get_billing_last_name()):'';
          $o554n=$o554?vcar_identity_normalize_name($o554->get_billing_first_name().' '.$o554->get_billing_last_name()):'';
          $res=[
            'mahak_person_id'=>12706969,
            'mahak_person_client_uid'=>(int)($p['PersonClientID']??$p['PersonClientId']??0),
            'mahak_matches_woo_admin_user_1_name'=>($u1n!==''&&$u1n===$name),
            'mahak_matches_order_105203_name'=>($o203n!==''&&$o203n===$name),
            'mahak_matches_order_105554_name'=>($o554n!==''&&$o554n===$name),
            'admin_user_1_profile_name_blank'=>($u1n===''),
            'admin_user_1_role_present'=>(bool)($u1 && array_intersect($u1->roles,['administrator','shop_manager'])),
            'order_105203_user_id'=>$o203?(int)$o203->get_customer_id():null,
            'order_105203_financial_mahak_id'=>$o203?(int)$o203->get_meta('mahak_id'):null,
            'order_105203_name_matches_current_order_105554'=>($o203n!==''&&$o203n===$o554n),
            'customer_2918_name_matches_order_105554'=>($u2918n!==''&&$u2918n===$o554n),
            'mahak_create_date_present'=>!empty($p['CreateDate']),
            'mahak_create_date'=>$p['CreateDate']??null,
            'mahak_update_date'=>$p['UpdateDate']??null
          ];
          echo 'NAME_SOURCE_PROVENANCE='.json_encode($res,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'NO_CUSTOMER_CLOUD_INVOICE_OR_ACCOUNT_MUTATION=yes'.PHP_EOL;
          PHP
