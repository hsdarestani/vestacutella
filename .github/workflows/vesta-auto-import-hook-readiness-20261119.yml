name: Vesta inspect native Bazara product-sync scheduling hook for automatic draft creation
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-auto-import-hook-readiness-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check native actions and merchant data flow read-only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $cfg=get_option('bazara_visitor_settings',[]);$opts=get_option('bazara_options',[]);
          $t=$wpdb->prefix.'actionscheduler_actions';
          echo 'AUTO_IMPORT_HOOK_NATIVE='.json_encode([
             'registered_callback_priority'=>has_action('bazara_run_product_sync'),
             'next_native_scheduled'=>function_exists('as_next_scheduled_action')?as_next_scheduled_action('bazara_run_product_sync'):null,
             'wp_next_native'=>wp_next_scheduled('bazara_run_product_sync'),
             'product_sync'=>(bool)($cfg['chkProduct']??false),
             'new_product_status'=>$cfg['publishStatus']??'unknown',
             'full_photo_sync'=>(bool)($cfg['chkPicture']??false),
             'currency_software'=>$cfg['selectCurrencySoftware']??'unknown',
             'currency_site'=>$cfg['selectCurrencyPlugin']??'unknown',
             'refresh_interval'=>$opts['refresh_interval']??null,
          ]).PHP_EOL;
          echo 'AUTO_IMPORT_HOOK_RECENT='.json_encode($wpdb->get_results("SELECT action_id, status, scheduled_date_gmt, last_attempt_gmt, attempts FROM $t WHERE hook='bazara_run_product_sync' ORDER BY action_id DESC LIMIT 6",ARRAY_A)).PHP_EOL;
          echo 'READ_ONLY_NO_MUTATIONS=yes'.PHP_EOL;
          PHP
