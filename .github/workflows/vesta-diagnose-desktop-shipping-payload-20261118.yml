name: Diagnose Mahak Windows shipping conversion source 105585
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vesta-diagnose-desktop-shipping-payload-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect vendor shipping logic, Woo-to-cloud freight and configured carrier without changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php')
          text=p.read_text('utf-8',errors='replace')
          start=text.find('public function bazara_save_order(')
          end=text.find('    private function get_selected_bank_id(', start)
          if start<0 or end<0:raise SystemExit('VENDOR_SOURCE_BOUNDARIES_CHANGED')
          lines=text[start:end].splitlines()
          terms=re.compile('sendShipping|order_shipping_cost|shippingPerson|sendCost|ShippingMethod|Carrier|Carrying|freight|shipping_method|get_selected_shipping_person_id|product_orders',re.I)
          def scrub(s):
            if re.search(r'(?i)(password|secret|authorization|access.?token|api.?key|url\s*=|credential)',s):return '[REDACTED]'
            return re.sub(r'https?://[^\s\x27"]+','[URL]',s).strip()[:230]
          seen=set()
          for index,line in enumerate(lines):
            if terms.search(line):
              for j in range(max(0,index-3),min(len(lines),index+5)):
                if j in seen:continue
                seen.add(j)
                print('SENDER_SOURCE_OFFSET='+str(j+1)+' '+scrub(lines[j]))
          print('SOURCE_SHIPPING_MARKER='+str('VC_BAZARA_FINANCIAL_PAYLOAD_V1_20261112' in text))
          PY
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1400M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $setting=get_option('bazara_visitor_settings',[]);
          $maps=json_decode(stripslashes($setting['carrierMethods']??''),true);
          $config=[];
          foreach(is_array($maps)?$maps:[] as $m)$config[]=[
            'woocommerce_method'=>preg_replace('/[^a-zA-Z0-9_:-]/','',(string)($m['method']??'')),
            'mahak_carrier_id_is_positive'=>((int)($m['name']??0)>0)];
          echo 'CARRIER_CONFIGURED_METHODS='.json_encode($config).PHP_EOL;
          echo 'SHIPPING_CONFIG_NON_SECRET='.json_encode([
           'carrier_method_count'=>count($config),
           'woo_currency'=>get_woocommerce_currency(),
           'software_currency'=>in_array(($setting['selectCurrencySoftware']??''),['rial','toman'],true)?$setting['selectCurrencySoftware']:'other',
           'plugin_currency'=>in_array(($setting['selectCurrencyPlugin']??''),['rial','toman'],true)?$setting['selectCurrencyPlugin']:'other'
          ]).PHP_EOL;
          $api=new BazaraApi(true);$cloud=Vesta_Accounting_Reliability::cloud($api);
          foreach([105585,105556,105554,105225,105429] as $id){
            $o=wc_get_order($id);if(!$o)continue;
            $rows=$cloud['orders'][$id]??[];$r=count($rows)===1?$rows[0]:null;
            $shipItems=[];
            foreach($o->get_items('shipping') as $item)$shipItems[]=[
              'method_id'=>(string)$item->get_method_id(),
              'instance_id'=>(int)$item->get_instance_id(),
              'amount'=>(float)$item->get_total()
            ];
            $fields=[];
            if($r)foreach(['OrderId','OrderClientId','OrderCode','OrderType','SendCost','CarryingAsExpense','CarrierType','CarrierId','CarrierID','SendPersonId','SendPersonID','Discount','PersonId','ReceiptId'] as $key)
              if(array_key_exists($key,$r))$fields[$key]=$r[$key];
            echo 'SHIPPING_REAL_ORDER='.json_encode([
              'woo_id'=>$id,'woo_total'=>(float)$o->get_total(),
              'woo_goods_net'=>array_sum(array_map(fn($i)=>(float)$i->get_total(),$o->get_items('line_item'))),
              'woo_shipping'=>(float)$o->get_shipping_total(),
              'shipping_methods'=>$shipItems,
              'cloud_order_count'=>count($rows),'cloud_fields'=>$fields
            ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          echo 'NO_ORDER_CUSTOMER_OR_ACCOUNTING_WRITES=yes'.PHP_EOL;
          PHP
          REMOTE
