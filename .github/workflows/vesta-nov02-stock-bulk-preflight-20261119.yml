name: Vesta Nov 2 stock baseline secure reconcile preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-nov02-stock-bulk-preflight-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Audit order volume, stock sync settings, available old backups and create host-only decrypt key
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          echo "RECON_AUDIT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          keydir=/root/.vesta-reconcile
          mkdir -m 0700 -p "$keydir"
          if ! test -s "$keydir/20261102-baseline-private.pem";then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
              -out "$keydir/20261102-baseline-private.pem" 2>/dev/null
            chmod 0600 "$keydir/20261102-baseline-private.pem"
          fi
          openssl pkey -in "$keydir/20261102-baseline-private.pem" \
            -pubout -out "$keydir/20261102-baseline-public.pem" 2>/dev/null
          echo 'RECON_SNAPSHOT_PUBLIC_KEY_PEM_BASE64_START'
          base64 -w0 "$keydir/20261102-baseline-public.pem"
          echo
          echo 'RECON_SNAPSHOT_PUBLIC_KEY_PEM_BASE64_END'
          echo 'RECON_BASELINE_PRIVATE_KEY_SERVER_ONLY=yes'
          echo 'RECON_EARLY_BACKUPS='
          find /srv/backups /srv/vestacutella -maxdepth 3 -type f \
            \( -iname '*2026-11-02*' -o -iname '*20261102*' -o -iname '*2026110[3-9]*' \) \
            -printf '%TY-%Tm-%Td %p %kKB\n' 2>/dev/null | head -50
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(230);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $hpos=class_exists('\Automattic\WooCommerce\Utilities\OrderUtil')
           ?\Automattic\WooCommerce\Utilities\OrderUtil::custom_orders_table_usage_is_enabled():false;
          echo 'RECON_ORDER_STORAGE='.($hpos?'HPOS':'POSTS').PHP_EOL;
          $cutoff='2026-11-02 09:06:00';
          if($hpos){
            $table=$wpdb->prefix.'wc_orders';
            $result=$wpdb->get_results($wpdb->prepare(
              "SELECT status,COUNT(*) n FROM $table WHERE type='shop_order'
               AND date_created_gmt >= %s GROUP BY status ORDER BY n DESC",$cutoff),ARRAY_A);
            $orders=(int)$wpdb->get_var($wpdb->prepare(
              "SELECT COUNT(*) FROM $table WHERE type='shop_order'
               AND date_created_gmt >= %s",$cutoff));
          }else{
            $table=$wpdb->posts;
            $result=$wpdb->get_results($wpdb->prepare(
              "SELECT post_status status,COUNT(*) n FROM $table
               WHERE post_type='shop_order' AND post_date_gmt >= %s
               GROUP BY post_status ORDER BY n DESC",$cutoff),ARRAY_A);
            $orders=(int)$wpdb->get_var($wpdb->prepare(
              "SELECT COUNT(*) FROM $table WHERE post_type='shop_order'
               AND post_date_gmt >= %s",$cutoff));
          }
          echo 'RECON_ORDERS_FROM_20261102='.wp_json_encode([
            'cutoff_utc'=>$cutoff,'count'=>$orders,'by_status'=>$result
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          $settings=get_option('bazara_visitor_settings',[]);
          echo 'RECON_BAZARA_SETTINGS='.wp_json_encode([
            'chkProduct'=>$settings['chkProduct']??null,
            'chkQuantity'=>$settings['chkQuantity']??null,
            'chkRegularPrice'=>$settings['chkRegularPrice']??null,
            'publishStatus'=>$settings['publishStatus']??null,
            'selectCurrencySoftware'=>$settings['selectCurrencySoftware']??null,
            'selectCurrencyPlugin'=>$settings['selectCurrencyPlugin']??null,
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          $tables=$wpdb->get_results("SHOW TABLES LIKE '%accounting_outbox%'");
          echo 'RECON_OUTBOX_TABLE_EXISTS='.(int)($tables!==[]).PHP_EOL;
          $ids=[103259,103247,103201,102969,8112];
          $items=[];
          foreach($ids as $id){
            $p=wc_get_product($id);
            $items[]=['id'=>$id,'exists'=>(bool)$p,'sku'=>$p?$p->get_sku():null,
             'stock'=>$p?$p->get_stock_quantity():null,
             'manage'=>$p?$p->get_manage_stock():null,
             'parent'=>$p?$p->get_parent_id():null,
             'mahak_id'=>$p?(int)$p->get_meta('mahak_id',true):null,
             'mahak_detail_id'=>$p?(int)$p->get_meta('mahak_product_detail_id',true):null];
          }
          echo 'RECON_LIVE_PRODUCT_SAMPLES='.wp_json_encode($items,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'RECON_PREFLIGHT_READONLY_WOO_MAHAK=yes'.PHP_EOL;
          PHP
          REMOTE
