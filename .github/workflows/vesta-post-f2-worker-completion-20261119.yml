name: Vesta verify F2 auto-import worker completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-post-f2-worker-completion-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read finished worker state, new drafts and post-F2 Mahak picture records
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php'; global $wpdb;
          $action=$wpdb->prefix.'actionscheduler_actions';
          echo 'F2_FOLLOWUP_CHECK_AT_UTC='.gmdate('c').PHP_EOL;
          echo 'F2_FOLLOWUP_LAST_AUTO_REPORT='.wp_json_encode(get_option('vesta_mhi_auto_last_report'),JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'F2_FOLLOWUP_AUTO_ACTIONS='.wp_json_encode($wpdb->get_results(
              "SELECT action_id,status,scheduled_date_gmt,last_attempt_gmt,attempts FROM $action WHERE hook='vesta_mhi_auto_tick' ORDER BY action_id DESC LIMIT 5",ARRAY_A)).PHP_EOL;
          echo 'F2_FOLLOWUP_CURRENT_PRODUCTS='.(int)$wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->prefix}bazara_products").PHP_EOL;
          echo 'F2_FOLLOWUP_CURRENT_PHOTOS='.(int)$wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->prefix}bazara_pictures").PHP_EOL;
          echo 'F2_FOLLOWUP_PRODUCTS_CREATED_SINCE_AUTO_INSTALL='.(int)$wpdb->get_var(
               "SELECT COUNT(*) FROM {$wpdb->posts} WHERE post_type='product' AND post_status IN ('draft','publish') AND post_date_gmt >= '2026-11-19 06:00:00'").PHP_EOL;
          echo 'F2_FOLLOWUP_NO_MUTATIONS=yes'.PHP_EOL;
          PHP
