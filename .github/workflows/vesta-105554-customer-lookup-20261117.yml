name: Vesta read-only matching of paid order 105554 customer against Cloud People
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-105554-customer-lookup-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only cloud customer lookup with no names phones email or secret values in logs
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $o=wc_get_order(105554);if(!$o)exit(12);
          $uid=(int)$o->get_customer_id();$user=$uid?get_user_by('id',$uid):false;
          $bill=vcar_identity_normalize_name($o->get_billing_first_name().' '.$o->get_billing_last_name());
          $profile=$user?vcar_identity_normalize_name($user->first_name.' '.$user->last_name):'';
          $phone=vesta_otp_phone((string)$o->get_billing_phone());
          $profilePhone=$uid?vesta_otp_phone((string)get_user_meta($uid,'billing_phone',true)):false;
          $owner=$phone?vesta_otp_existing_user($phone):false;
          $email=(string)$o->get_billing_email();
          $emailUser=$email?get_user_by('email',$email):false;
          $api=new BazaraApi(true);$r=$api->get_all_data('',array('fromPersonVersion'=>0));
          $people=$r['message']['People']??null;
          if(empty($r['success'])||!is_array($people)) {echo 'CLOUD_PEOPLE_READ_UNAVAILABLE=yes'.PHP_EOL;exit(13);}
          $matches=['client'=>[],'phone'=>[],'full_name'=>[]];$phoneNormalizedCount=0;
          foreach($people as $p){
             if(!empty($p['Deleted']))continue;
             $pid=(int)($p['PersonId']??0);
             $client=(int)($p['PersonClientID']??$p['PersonClientId']??0);
             $cp=vesta_otp_phone((string)($p['Mobile']??''));
             $cn=vcar_identity_normalize_name(($p['FirstName']??'').' '.($p['LastName']??''));
             if($client===$uid)$matches['client'][]=['id'=>$pid,'name_matches'=>($cn===$bill),'phone_matches'=>($cp&&$cp===$phone)];
             if($phone && $cp===$phone)$matches['phone'][]=['id'=>$pid,'name_matches'=>($cn===$bill),'client_matches'=>($client===$uid)];
             if($bill!=='' && $cn===$bill) $matches['full_name'][]=['id'=>$pid,'phone_matches'=>($cp&&$cp===$phone),'client_matches'=>($client===$uid)];
          }
          $summary=[
             'order'=>105554,'uid'=>$uid,'account_exists'=>(bool)$user,
             'is_channel_customer'=>($user&&class_exists('Vesta_Channel_Customers'))?Vesta_Channel_Customers::customer($uid):false,
             'billing_name_complete'=>(trim((string)$o->get_billing_first_name())!=='' && trim((string)$o->get_billing_last_name())!==''),
             'profile_name_complete'=>($profile!==''),
             'profile_billing_name_exact'=>($bill!==''&&$bill===$profile),
             'billing_phone_valid'=>(bool)$phone,
             'profile_phone_exact'=>($phone&&$phone===$profilePhone),
             'otp_owner_matches'=>($owner&&!is_wp_error($owner)&&(int)$owner===$uid),
             'email_is_valid'=>($email===''||!!is_email($email)),
             'email_owner_matches'=>($email===''||!$emailUser||(int)$emailUser->ID===$uid),
             'previous_provision_attempt'=>(bool)get_user_meta($uid,'_vesta_person_provision_attempt',true),
             'cloud_matches_by_client'=>$matches['client'],
             'cloud_matches_by_phone'=>$matches['phone'],
             'cloud_name_match_count'=>count($matches['full_name']),
             'cloud_name_matches_with_same_phone'=>count(array_filter($matches['full_name'],fn($p)=>$p['phone_matches'])),
             'cloud_people_total'=>count($people)
          ];
          echo 'ORDER_105554_CUSTOMER_LOOKUP='.json_encode($summary,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'READ_ONLY_NO_PERSON_INVOICE_OR_CUSTOMER_WRITES=yes'.PHP_EOL;
          PHP
