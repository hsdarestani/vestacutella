# 2026-10-19 baseline after Cutella import, before Redis cache tuning.
# Lighthouse after offscreen product rendering: 2026-10-14
# Final Lighthouse verification after 2026-10-14 guarded Owl CSS rollout
name: Public mobile Lighthouse performance
# Verification after additional Vesta WebP images and CLS reservation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-mobile-lighthouse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Browser and Lighthouse
        run: |
          which google-chrome || which chromium || true
          node --version
          npm install -g lighthouse@12 --no-audit --no-fund
      - name: Measure both public homepages from a mobile viewport
        run: |
          for site in vesta-cosmetics.ir cutellashop.ir; do
            echo "=== POST-OPTIMIZATION LIGHTHOUSE MOBILE $site ==="
            timeout 175s lighthouse "https://$site/" --only-categories=performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --form-factor=mobile --screenEmulation.mobile=true \
              --max-wait-for-load=45000 --output=json --output-path="/tmp/$site.json" --quiet || true
            SITE="$site" python3 - <<'PY'
          import json,os
          site=os.environ['SITE']
          try: j=json.load(open('/tmp/'+site+'.json'))
          except Exception as e:
           print('RESULT',site,'audit_unavailable',str(e));raise SystemExit(0)
          a=j.get('audits',{})
          print('RESULT',site,'score',j.get('categories',{}).get('performance',{}).get('score'))
          for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','server-response-time']:
           z=a.get(k,{})
           print('METRIC',site,k,z.get('displayValue'),z.get('numericValue'))
          print('FINAL_URL',j.get('finalDisplayedUrl'),'runtime_error',j.get('runtimeError'))
          for name in ['largest-contentful-paint-element','layout-shifts']:
           zz=a.get(name,{})
           for item in (zz.get('details') or {}).get('items',[])[:3]:
            node=item.get('node') or {}
            print('BOTTLENECK',site,name,node.get('selector'),node.get('snippet','')[:180],item.get('score'))
          PY
          done
      - name: Publish JSON reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vesta-cutella-mobile-lighthouse-after
          path: /tmp/*.ir.json
          if-no-files-found: ignore
          retention-days: 7
