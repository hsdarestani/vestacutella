name: Vesta read product title of completed single-picture Mahak photo import canary
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-identify-photo-canary-product-103201-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only exact Woo product canary name SKU and image ID
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $p=wc_get_product(103201);
          if(!$p)exit(1);
          $v=['woo_id'=>$p->get_id(),'name'=>$p->get_name(),'sku'=>$p->get_sku(),
             'status'=>$p->get_status(),'erp_id'=>(int)get_post_meta(103201,'mahak_id',true),
             'gallery_ids'=>$p->get_gallery_image_ids(),'featured_id'=>$p->get_image_id()];
          echo 'VERIFIED_IMPORTED_PHOTO_PRODUCT='.json_encode($v,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'READ_ONLY=yes'.PHP_EOL;
          PHP