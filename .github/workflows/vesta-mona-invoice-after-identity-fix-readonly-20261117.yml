name: Vesta order 105554 independent cloud invoice and outbox check after identity repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-mona-invoice-after-identity-fix-readonly-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify no duplicate and exact name, shipping and receipt status in cloud
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $id=105554;$o=wc_get_order($id);
          if(!$o || !class_exists('Vesta_Accounting_Reliability') || !class_exists('BazaraApi'))exit(20);
          $state=$wpdb->get_row($wpdb->prepare('SELECT state,reason,attempts,submitted_at,remote_id,next_attempt FROM '.Vesta_Accounting_Reliability::table().' WHERE order_id=%d',$id),ARRAY_A);
          $settings=get_option('bazara_visitor_settings',[]);
          $bank=vcar_bank($settings,$o->get_payment_method());
          $api=new BazaraApi(true);$cloud=Vesta_Accounting_Reliability::cloud($api);
          $rows=$cloud['orders'][$id]??[];
          echo 'MONA_INVOICE_STATUS='.json_encode([
            'woo_order'=>$id,
            'customer_uid'=>(int)$o->get_customer_id(),
            'buyer_erp_person_id'=>(int)get_user_meta(2918,'mahak_id',true),
            'admin_erp_person_id'=>(int)get_user_meta(1,'mahak_id',true),
            'buyer_identity_guard'=>vcar_identity_guard($o)?:'verified',
            'sender_enabled'=>(int)get_option('vcar_sender_enabled',false),
            'preflight_reason'=>Vesta_Accounting_Reliability::preflight($o,$bank)?:'verified',
            'woo_amount'=>(float)$o->get_total(),
            'woo_shipping'=>(float)$o->get_shipping_total(),
            'queue'=>$state,
            'cloud_invoice_count'=>count($rows),
            'woo_local_invoice_id'=>(int)$o->get_meta('mahak_id')
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          foreach($rows as $row){
            $erp=(int)($row['OrderId']??0);
            $finance=vcar_verify($o,$row,$cloud['details'][$erp]??[],$cloud['receipts'][$erp]??[],$bank,$cloud['transfers'],(int)($o->get_meta('_vcar_money_multiplier')?:10));
            echo 'MONA_CLOUD_INVOICE='.json_encode([
              'invoice_id'=>$erp,
              'person_correct'=>(int)($row['PersonId']??0)===(int)get_user_meta(2918,'mahak_id',true),
              'shipping_reported'=>(float)($row['SendCost']??0),
              'invoice_details'=>count($cloud['details'][$erp]??[]),
              'receipt_count'=>count($cloud['receipts'][$erp]??[]),
              'verification'=>$finance?:'verified'
            ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          echo 'READ_ONLY_NO_OUTBOX_ORDER_PERSON_OR_CLOUD_MUTATION=yes'.PHP_EOL;
          PHP
