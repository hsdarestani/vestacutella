name: Vesta examine false shared local invoice and duplicate existing good 70337 without writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-diagnose-legacy-shared-id-and-duplicate-catalog-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect false repeated Mahak local ack and identical existing Woo products
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $m=$wpdb->get_results("SELECT p.post_date,p.post_status,m.post_id FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} m ON m.post_id=p.ID AND m.meta_key='mahak_id' AND m.meta_value='54323444' WHERE p.post_type='shop_order' ORDER BY p.ID DESC",ARRAY_A);
          $stats=['total_orders_with_same_invoice_id'=>count($m),'newest_order_ids'=>array_map(fn($r)=>(int)$r['post_id'],array_slice($m,0,14)),
            'oldest_order_ids'=>array_map(fn($r)=>(int)$r['post_id'],array_slice($m,-14)),
            'earliest_order_date'=>$m?end($m)['post_date']:null,
            'latest_order_date'=>$m?$m[0]['post_date']:null];
          echo 'SHARED_LOCAL_INVOICE_FINGERPRINT='.json_encode($stats).PHP_EOL;
          $duplicate=[];
          foreach([103568,70337] as $id){
            $p=wc_get_product($id);$post=get_post($id);
            $n=0;
            if($p){$orderLines=$wpdb->get_var($wpdb->prepare("SELECT COUNT(DISTINCT oi.order_id) FROM {$wpdb->prefix}woocommerce_order_items oi JOIN {$wpdb->prefix}woocommerce_order_itemmeta m ON m.order_item_id=oi.order_item_id WHERE m.meta_key IN ('_product_id','_variation_id') AND m.meta_value=%s",(string)$id));$n=(int)$orderLines;}
            $duplicate[]=['id'=>$id,'type'=>$p?$p->get_type():null,
             'status'=>$post?$post->post_status:null,'created'=>$post?$post->post_date:null,
             'name'=>$p?$p->get_name():null,'sku'=>$p?$p->get_sku():null,
             'visible'=>$p?$p->is_visible():null,'purchasable'=>$p?$p->is_purchasable():null,
             'stock'=>$p?$p->get_stock_quantity():null,'price'=>$p?$p->get_price():null,
             'parent'=>$p&&$p->is_type('variation')?$p->get_parent_id():0,
             'image'=>$p?$p->get_image_id():0,'erp_product'=>(int)get_post_meta($id,'mahak_id',true),
             'erp_detail'=>(int)get_post_meta($id,'mahak_product_detail_id',true),
             'order_line_references'=>$n];
          }
          echo 'ERP_DETAIL_12183120_WOO_PRODUCT_COLLISION='.json_encode($duplicate,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'ALL_CHECKS_READ_ONLY_NO_PERSONAL_DATA_OUTPUT=yes'.PHP_EOL;
          PHP
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara')
          count=0
          for f in base.rglob('*.php'):
            if f.stat().st_size>3000000:continue
            for idx,line in enumerate(f.read_text(encoding='utf8',errors='replace').splitlines(),1):
              if ('mahak_id' not in line and '54323444' not in line):continue
              if not re.search(r'update_post_meta|add_post_meta|update_meta_data|save_meta_data|54323444',line):continue
              if re.search(r'https?://|token|secret|password|api.?key',line,re.I):continue
              print('MAHAK_ID_VENDOR_WRITER',f.relative_to(base),idx,line.strip()[:215])
              count+=1
              if count>=75:break
            if count>=75:break
          PY
          REMOTE