name: Refresh staging from current DirectAdmin data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-current-data.yml"
      - "scripts/finish-current-refresh.sh"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Finish current data refresh
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/finish-current-refresh.sh "root@$HOST:/tmp/finish-current-refresh.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'chmod +x /tmp/finish-current-refresh.sh && /tmp/finish-current-refresh.sh'

# trigger: current DirectAdmin refresh 2026-10-11

