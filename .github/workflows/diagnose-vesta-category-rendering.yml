name: Diagnose Vesta storefront category navigation
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-vesta-category-rendering.sh
      - .github/workflows/diagnose-vesta-category-rendering.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/diagnose-vesta-category-rendering.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect live category menu
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/diagnose-vesta-category-rendering.sh "root@$HOST:/tmp/diagnose-vesta-category-rendering.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/diagnose-vesta-category-rendering.sh'
