name: Validate live saved Vesta SMTP login only
on:
  push:
    branches: [main]
    paths:
      - scripts/check-vesta-live-credential-20261020.sh
      - .github/workflows/check-vesta-live-credential-20261020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/check-vesta-live-credential-20261020.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check authenticated SMTP connection without sending
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/check-vesta-live-credential-20261020.sh "root@$HOST:/tmp/check-vesta-live-credential-20261020.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/check-vesta-live-credential-20261020.sh'
