name: Safely deploy customer identity checks to Vesta accounting outbox
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-vesta-accounting-identity-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Local PHP policy and identity regression tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l infra/plugins/vesta-accounting-reliability/vesta-accounting-identity.php
          php -l infra/plugins/vesta-accounting-reliability/vesta-accounting-reliability.php
          php tests/accounting-identity-test.php infra/plugins/vesta-accounting-reliability/vesta-accounting-identity.php
          php tests/accounting-policy-test.php infra/plugins/vesta-accounting-reliability/vesta-accounting-policy.php
          php tests/accounting-outbox-test.php infra/plugins/vesta-accounting-reliability/vesta-accounting-reliability.php
      - name: Stage code and atomic production deployment; sender remains disabled
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          remote_stage="/tmp/vesta-identity-${GITHUB_SHA}"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "mkdir -p -m 0700 '$remote_stage'"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/plugins/vesta-accounting-reliability/vesta-accounting-identity.php infra/plugins/vesta-accounting-reliability/vesta-accounting-reliability.php "root@$HOST:$remote_stage/"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "bash -s '$remote_stage'" <<'SHELL'
          set -Eeuo pipefail
          stage=${1:?}
          base=/srv/vestacutella/runtime/vesta/wp-content/mu-plugins
          backup=/srv/backups/vesta-identity-guard-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          test "$(df -Pk /srv | awk 'NR==2{print $4}')" -gt 900000
          for name in vesta-accounting-reliability.php;do cp -p "$base/$name" "$backup/$name";done
          echo "PRODUCTION_BACKUP=$backup"
          docker exec vc-vesta php -l /var/www/html/wp-content/mu-plugins/vesta-accounting-reliability.php
          test -f "$base/vesta-accounting-policy.php"
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          if(get_option('vcar_sender_enabled',false))throw new RuntimeException('SENDER_MUST_BE_PAUSED_FIRST');
          echo 'SENDER_PAUSED_PREFLIGHT=yes'.PHP_EOL;
          PHP
          for name in vesta-accounting-identity.php vesta-accounting-reliability.php;do docker exec -i vc-vesta php -l < "$stage/$name";done
          rollback(){
             rc=$?
             trap - EXIT
             cp -p "$backup/vesta-accounting-reliability.php" "$base/vesta-accounting-reliability.php"
             rm -f "$base/vesta-accounting-identity.php"
             echo IDENTITY_GUARD_CODE_ROLLED_BACK=yes
             exit "$rc"
          }
          trap rollback EXIT
          # Acquire existing sender lock to avoid changing loaded code during a worker pass.
          PID=$(docker inspect -f '{{.State.Pid}}' vc-vesta)
          lock="/proc/$PID/root/tmp/vesta-bazara-order-sync.lock"
          flock -w 60 "$lock" bash -s "$stage" "$base" <<'INNER'
          set -Eeuo pipefail
          stage=$1; base=$2
          for name in vesta-accounting-identity.php vesta-accounting-reliability.php;do
            cp -p "$stage/$name" "$base/.$name.next"
            chmod 0644 "$base/.$name.next"
            mv "$base/.$name.next" "$base/$name"
          done
          INNER
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          if(get_option('vcar_sender_enabled',false) || !function_exists('vcar_identity_guard'))throw new RuntimeException('identity_guard_not_active_or_sender_enabled');
          foreach([105460,105458,105456,105454,105452,105450,105361,105487] as $id){
            $o=wc_get_order($id);$reason=$o?vcar_identity_guard($o):'order_missing';
            echo 'IDENTITY_GUARD_CANARY ORDER='.$id.' REASON='.$reason.PHP_EOL;
          }
          echo 'IDENTITY_GUARD_ACTIVE_NO_ERP_WRITES=yes'.PHP_EOL;
          PHP
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "HOST=$host HTTP=$code"; test "$code" = 200
          done
          trap - EXIT
          echo IDENTITY_GUARD_DEPLOYED_SENDER_PAUSED=yes
          SHELL
