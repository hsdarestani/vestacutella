name: Deploy Vesta Bazaar shipment discount gateway accounting fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-vesta-bazara-finance-payload-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Production guarded payload fix with backup and automatic rollback on failure
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            scripts/deploy-vesta-bazara-financial-payload-20261112.sh \
            "root@$HOST:/tmp/deploy-vesta-bazara-financial-payload-20261112.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'bash /tmp/deploy-vesta-bazara-financial-payload-20261112.sh'
