name: Vesta read-only forensic origin of two washbag stock quantity differences
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-stock-origin-audit-washbag-70299-70300-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check Woo stock ownership history, all order line items and stock change evidence without changing inventory
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);ini_set('display_errors','0');
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $ids=[70298,70299,70300];
          $details=[];
          foreach($ids as $id) {
            $p=wc_get_product($id);$post=get_post($id);
            if(!$p)continue;
            $stockMeta=[];
            foreach($wpdb->get_results($wpdb->prepare("SELECT meta_id,meta_key,meta_value FROM {$wpdb->postmeta} WHERE post_id=%d AND meta_key IN ('_stock','_manage_stock','_stock_status','_low_stock_amount','total_sales','_sku') ORDER BY meta_id",$id),ARRAY_A) as $m){
              $stockMeta[]=['meta_id'=>(int)$m['meta_id'],'key'=>$m['meta_key'],'value'=>$m['meta_value']];
            }
            $details[$id]=['name'=>$p->get_name(),'type'=>$p->get_type(),'manage_stock'=>$p->managing_stock(),
              'stock_managed_by_id'=>method_exists($p,'get_stock_managed_by_id')?$p->get_stock_managed_by_id():null,
              'stock_quantity'=>$p->get_stock_quantity(),'total_sales'=>$p->get_total_sales(),
              'post_created'=>$post->post_date,'post_modified'=>$post->post_modified,
              'sku'=>$p->get_sku(),'stock_meta'=>$stockMeta];
          }
          echo 'WASHBAG_STOCK_OWNERSHIP_AND_META='.json_encode($details,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $query="SELECT oi.order_id,oi.order_item_id,
             MAX(CASE WHEN m.meta_key='_variation_id' THEN m.meta_value END) variation_id,
             MAX(CASE WHEN m.meta_key='_product_id' THEN m.meta_value END) product_id,
             MAX(CASE WHEN m.meta_key='_qty' THEN m.meta_value END) qty,
             MAX(CASE WHEN m.meta_key='_reduced_stock' THEN m.meta_value END) reduced_qty
            FROM {$wpdb->prefix}woocommerce_order_items oi
            JOIN {$wpdb->prefix}woocommerce_order_itemmeta m ON m.order_item_id=oi.order_item_id
            WHERE oi.order_item_type='line_item'
              AND oi.order_item_id IN (SELECT order_item_id FROM {$wpdb->prefix}woocommerce_order_itemmeta
                WHERE meta_key IN ('_variation_id','_product_id')
                AND meta_value IN ('70298','70299','70300'))
            GROUP BY oi.order_id,oi.order_item_id
            ORDER BY oi.order_id";
          $items=$wpdb->get_results($query,ARRAY_A);
          $out=[];
          foreach($items as $item){
            $id=(int)$item['order_id'];$order=wc_get_order($id);
            if(!$order)continue;
            $out[]=['order_id'=>$id,'variation_id'=>(int)$item['variation_id'],
              'product_id'=>(int)$item['product_id'],'quantity'=>(float)$item['qty'],
              'reduced_qty'=>$item['reduced_qty']===null?null:(float)$item['reduced_qty'],
              'order_status'=>$order->get_status(),
              'order_created'=>$order->get_date_created()?$order->get_date_created()->date('Y-m-d'):null,
              'order_paid'=>(bool)$order->get_date_paid(),
              'order_stock_reduced_flag'=>$order->get_meta('_order_stock_reduced'),
              'local_mahak_invoice'=>(int)$order->get_meta('mahak_id')];
          }
          echo 'WASHBAG_ALL_ORDER_LINES_HISTORY='.json_encode($out,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $revisions=[];
          foreach($wpdb->get_results("SELECT ID,post_parent,post_date,post_modified,post_type FROM {$wpdb->posts} WHERE post_type='revision' AND post_parent IN (70298,70299,70300) ORDER BY post_date",ARRAY_A) as $r){
            $revStock=$wpdb->get_results($wpdb->prepare("SELECT meta_key,meta_value FROM {$wpdb->postmeta} WHERE post_id=%d AND meta_key IN ('_stock','_manage_stock','_sku','_stock_status')",$r['ID']),ARRAY_A);
            $revisions[]=['revision_id'=>(int)$r['ID'],'parent'=>(int)$r['post_parent'],'date'=>$r['post_date'],'stock_meta'=>$revStock];
          }
          echo 'WASHBAG_REVISIONS_STOCK_META='.json_encode(array_slice($revisions,-70),JSON_UNESCAPED_UNICODE).PHP_EOL;
          $tables=$wpdb->get_col("SHOW TABLES");
          $stockTables=array_values(array_filter($tables,fn($t)=>(bool)preg_match('/stock|inventory|history|audit|activity|log/i',(string)$t)));
          echo 'POTENTIAL_STOCK_AUDIT_TABLES='.json_encode($stockTables,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $notes=[];
          $noteRows=$wpdb->get_results("SELECT c.comment_ID,c.comment_post_ID,c.comment_date,c.comment_content
             FROM {$wpdb->comments} c
             WHERE c.comment_type='order_note'
             AND c.comment_post_ID IN (SELECT oi.order_id FROM {$wpdb->prefix}woocommerce_order_items oi
               JOIN {$wpdb->prefix}woocommerce_order_itemmeta m ON m.order_item_id=oi.order_item_id
               WHERE m.meta_key IN ('_product_id','_variation_id') AND m.meta_value IN ('70298','70299','70300'))
             ORDER BY c.comment_date LIMIT 150",ARRAY_A);
          foreach($noteRows as $n){
            $content=(string)$n['comment_content'];
            if(!preg_match('/stock|inventory|quantity|موجودی|انبار|کاهش|افزایش|مقدار|تعداد|محصول/iu',$content))continue;
            // Redact arbitrary freeform message and potential personal data. Only
            // keep dates and numeric stock transitions or stock-action classification.
            $numbers=[];
            if(preg_match_all('/(?<!\d)\d{1,3}\s*(?:→|->|to|از|به)\s*\d{1,3}(?!\d)/u',$content,$m))
               $numbers=array_slice($m[0],0,5);
            $notes[]=['order_id'=>(int)$n['comment_post_ID'],'date'=>$n['comment_date'],
              'note_type'=>preg_match('/reduced|کاهش/i',$content)?'stock_reduction':(preg_match('/restored|افزایش|بازگشت/i',$content)?'stock_restoration':'stock_related'),
              'numeric_transitions'=>$numbers];
          }
          echo 'WASHBAG_STOCK_RELATED_ORDER_NOTES='.json_encode($notes,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $opts=get_option('bazara_visitor_settings',[]);
          $flags=[];
          foreach(is_array($opts)?$opts:[] as $k=>$v)
            if(preg_match('/stock|exist|quantity|inventory|^chkproduct$|^chkpicture$|^chkorder$/i',(string)$k))$flags[$k]=is_scalar($v)&&strlen((string)$v)<12?(string)$v:gettype($v);
          echo 'BAZARA_STOCK_AND_PRODUCT_SYNC_FLAGS='.json_encode($flags,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'FORENSIC_WOO_STOCK_AUDIT_READ_ONLY=yes'.PHP_EOL;
          PHP
      - name: See whether old local Vesta database backups from October exist, report names only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'python3 -' <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('/srv/backups')
          if not root.is_dir(): print('VESTA_OLD_LOCAL_BACKUPS_DIRECTORY=missing');raise SystemExit(0)
          found=[]
          for d in root.iterdir():
            try:
              if d.is_dir() and ('vesta' in d.name.lower() or 'vc' in d.name.lower()):
                stamp=datetime.fromtimestamp(d.stat().st_mtime,tz=timezone.utc).strftime('%Y-%m-%d')
                found.append([d.name,stamp])
            except OSError: continue
          found.sort(key=lambda x:x[1])
          print('VESTA_BACKUP_DIR_COUNT=',len(found))
          print('VESTA_EARLIEST_BACKUP_NAMES=',found[:20])
          print('VESTA_OCT_OR_EARLY_NOV_BACKUPS=',[a for a in found if a[1]<'2026-11-08'][-20:])
          PY
