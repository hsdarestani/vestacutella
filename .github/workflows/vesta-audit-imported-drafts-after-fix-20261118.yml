name: Vesta audit incomplete imported Mahak drafts and existing picture assignments
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-audit-imported-drafts-after-fix-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check previous imported drafts for missing prices warehouse assets or photo links
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $rows=$wpdb->get_results($wpdb->prepare("SELECT p.ID,p.post_status,p.post_title
             FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} m ON m.post_id=p.ID
             WHERE p.post_type='product' AND m.meta_key='_vesta_mahak_import_source'
               AND m.meta_value=%s ORDER BY p.ID DESC LIMIT 500",'bazara_existing_product'),ARRAY_A);
          $catalog=vmb_catalog(vmb_api());$goods=[];$details=[];
          foreach($catalog['Products']??[] as $g)if(empty($g['Deleted']))$goods[(int)$g['ProductId']]=$g;
          foreach($catalog['ProductDetails']??[] as $d)if(empty($d['Deleted']))$details[(int)$d['ProductId']][]=$d;
          $report=['imported_products_count'=>count($rows),'incomplete_drafts'=>0,'import_draft_all_fields_complete'=>0,
             'wrong_identity'=>0,'missing_price'=>0,'missing_photo'=>0,'missing_stock'=>0,'asset_rows_present'=>0,
             'eligible_for_safe_completion'=>0,'examples'=>[]];
          foreach($rows as $r){
            $id=(int)$r['ID'];$w=wc_get_product($id);if(!$w)continue;
            $gid=(int)$w->get_meta('mahak_id',true);$did=(int)$w->get_meta('mahak_product_detail_id',true);
            $g=$goods[$gid]??null;$ds=$details[$gid]??[];
            $valid=$g && (string)($g['ProductCode']??'')===$w->get_sku() &&
               (string)($g['Name']??'')!=='' &&
               count($ds)===1 && (int)$ds[0]['ProductDetailId']===$did &&
               $w->is_type('simple');
            $missing=[];
            if($w->get_regular_price()===''){$missing[]='price';$report['missing_price']++;}
            if(!$w->get_manage_stock()||$w->get_stock_quantity()===null){$missing[]='stock';$report['missing_stock']++;}
            if(!$w->get_image_id() && !$w->get_gallery_image_ids()){$missing[]='photo';$report['missing_photo']++;}
            $assets=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->prefix}bazara_product_assets
                WHERE ProductDetailId=%d AND Deleted=0",$did));
            if($assets===1)$report['asset_rows_present']++;
            if(!$valid)$report['wrong_identity']++;
            if($r['post_status']==='draft' && $missing){
              $report['incomplete_drafts']++;
              if($valid)$report['eligible_for_safe_completion']++;
            }elseif(!$missing)$report['import_draft_all_fields_complete']++;
            if(count($report['examples'])<40)
              $report['examples'][]=['woo_id'=>$id,'status'=>$r['post_status'],
                'name'=>$r['post_title'],'sku'=>$w->get_sku(),'good_id'=>$gid,'detail_id'=>$did,
                'identity_unique'=>$valid,'missing'=>$missing,'asset_rows'=>$assets,
                'site_price'=>$w->get_regular_price(),'site_stock'=>$w->get_stock_quantity(),
                'featured'=>(int)$w->get_image_id()];
          }
          echo 'ALL_IMPORTED_DRAFT_COMPLETENESS_AUDIT='.json_encode($report,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'IMPORTED_DRAFT_AUDIT_READ_ONLY=yes'.PHP_EOL;
          PHP
