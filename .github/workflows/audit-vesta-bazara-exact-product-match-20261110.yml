name: Audit exact Bazara name barcode candidates for missing order items
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-vesta-bazara-exact-product-match-20261110.yml"
  workflow_dispatch:
permissions:
  contents:
    read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect SKU alternatives and unique exact normalized title matches
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          db() { docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4'; }
          echo '===== POTENTIAL EXACT NAME MATCHES NO IDENTIFIERS CHANGED ====='
          cat <<'SQL' | db | python3 -c '
          import sys,re,unicodedata,collections,difflib
          def norm(s):
             s=unicodedata.normalize("NFKC",s.strip().casefold())
             s=s.replace("ي","ی").replace("ك","ک").replace("‌"," ").replace("ـ","")
             s=re.sub(r"[\u064b-\u065f]","",s)
             return re.sub(r"\s+"," ",re.sub(r"[^\w\s]"," ",s)).strip()
          w=[];b=[]
          for line in sys.stdin:
             v=line.rstrip("\n").split("\t")
             if len(v)!=3 or v[0]=="origin":continue
             o,i,n=v
             if o=="W":w.append((i,norm(n)))
             elif o=="B":b.append((i,norm(n)))
          for wi,wn in w:
             exact=[bi for bi,bn in b if bn==wn and bn]
             ranked=sorted(((difflib.SequenceMatcher(None,wn,bn).ratio(),bi) for bi,bn in b),reverse=True)[:1] if wn else []
             print("WOO_PARENT",wi,"UNIQUE_EXACT_MATCH",exact[0] if len(exact)==1 else "none","EXACT_COUNT",len(exact),"BEST_MATCH_SCORE",round(ranked[0][0],3) if ranked else 0,"BEST_MATCH_ID",ranked[0][1] if ranked and ranked[0][0]>=.92 else "not_exact")
          '
          SELECT 'W' AS origin, ID AS product_id, CONVERT(REPLACE(REPLACE(post_title,CHAR(10),' '),CHAR(9),' ') USING utf8mb4) COLLATE utf8mb4_general_ci AS name FROM wp_posts
          WHERE ID IN(42801,45079,33045,102249,37746,45887,58867,56377,54591,101870,44556,41893,35112,73091)
          UNION ALL
          SELECT 'B',ProductId,CONVERT(REPLACE(REPLACE(ProductName,CHAR(10),' '),CHAR(9),' ') USING utf8mb4) COLLATE utf8mb4_general_ci FROM wp_bazara_products;
          SQL
          echo '===== ALTERNATE PRODUCT BARCODE META TYPES ====='
          cat <<'SQL' | db
          SELECT meta_key,COUNT(*) AS rows FROM wp_postmeta WHERE post_id IN(42801,45079,33045,102249,37746,45887,58867,56377,54591,101870,44556,41893,35112,73091,
          42807,45092,33051,102250,102253,100023,45900,58872,56381,54598,101872,44569,41902,35120,35117,73200)
          AND meta_key REGEXP 'barcode|ean|gtin|upc|mahak|_sku' GROUP BY meta_key ORDER BY rows DESC;
          SELECT 'REMOTE_BARCODE_NONEMPTY',COUNT(*) FROM wp_bazara_products WHERE barcode IS NOT NULL AND barcode<>'';
          SQL
          echo EXACT_BAZARA_MAPPING_AUDIT_COMPLETE=yes
          REMOTE
