name: Audit missing Vesta Bazara orders read only
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-vesta-bazara-missing-orders-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/audit-vesta-bazara-missing-orders-20261110.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Collect read only live evidence
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' < scripts/audit-vesta-bazara-missing-orders-20261110.sh
      - name: Diagnose exact recent orders and ERP receipts read only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          db() { docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4'; }
          echo '===== CURRENT UNSYNCED RECENT ORDERS ====='
          cat <<'SQL' | db
          SELECT p.ID,p.post_date_gmt,p.post_status,
            MAX(pm.meta_key='mahak_id') AS has_mahak_marker,
            MAX(pm.meta_key='mahak_error') AS has_mahak_error,
            MAX(CASE WHEN pm.meta_key='mahak_error' THEN CHAR_LENGTH(pm.meta_value) ELSE 0 END) AS error_chars,
            EXISTS(SELECT 1 FROM wp_bazara_orders b WHERE b.OrderClientId=p.ID) AS exists_client_reference
          FROM wp_posts p LEFT JOIN wp_postmeta pm ON p.ID=pm.post_id AND pm.meta_key IN('mahak_id','mahak_error')
          WHERE p.post_type='shop_order' AND p.post_date_gmt > UTC_TIMESTAMP()-INTERVAL 12 DAY
          GROUP BY p.ID,p.post_date_gmt,p.post_status ORDER BY p.ID DESC LIMIT 75;
          SELECT
             'BAZARA_REFERENCES_BY_CLIENT_ID',
             COUNT(*),
             COUNT(DISTINCT OrderClientId),
             MIN(OrderClientId),MAX(OrderClientId)
          FROM wp_bazara_orders;
          SELECT
            'ORDER_CURSOR_POSITIVE_MARKER',
            COUNT(*)
          FROM wp_posts p JOIN wp_postmeta pm ON pm.post_id=p.ID AND pm.meta_key='mahak_id'
          WHERE p.post_type='shop_order' AND p.ID>100000;
          SQL
          echo '===== BAZARA API RESPONSE CONTROL FLOW ====='
          python3 - <<'PY'
          p='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php'
          lines=open(p,encoding='utf8',errors='replace').read().splitlines()
          import re
          for start,end in ((3067,3107),(3690,3760),(2605,2755)):
            print('SEGMENT_START',start)
            for i in range(start,end):
              s=lines[i-1].strip()
              if i<2605 or not s:continue
              if start==2605 and not re.search(r'get_orders|left_behind|orders|array_slice|sync_limit|max_id|option|success|result|return',s,re.I):continue
              s=re.sub(r'(?i)(password|token|secret|api[_-]?key)\s*(=>|=)\s*[^,;]+',r'\1\2[REDACTED]',s)
              s=s.replace('http://','[HTTP] ').replace('https://','[HTTPS] ')
              print('PHP_LINE',i,re.sub(r'\s+',' ',s)[:175])
          PY
          echo '===== SANITIZED ERROR CATEGORIES ====='
          cat <<'SQL' | db | python3 -c '
          import sys,re,collections
          def category(s):
             s=s.lower()
             for tag,pattern in [
               ("stock",r"stock|inventory|موجودی"),("authorization",r"auth|unauthorized|token|اعتبار"),
               ("duplicate",r"duplicate|already|تکراری"),("network",r"timeout|connection|ارتباط"),("bad_request",r"validation|invalid|نامعتبر")]:
                 if re.search(pattern,s):return tag
             return "other"
          ct=collections.Counter()
          for line in sys.stdin:
             a=line.rstrip("\n").split("\t")
             if len(a)>1 and a[0].isdigit():ct[(a[0],category(a[1]),len(a[1]))]+=1
          for (oid,cat,size),n in ct.items():print("ORDER",oid,"ERROR_CLASS",cat,"CHARS",size,"N",n)'
          SELECT post_id,meta_value FROM wp_postmeta WHERE meta_key='mahak_error' AND post_id IN (105207,105206,105205,105204,105203,105053,105052) LIMIT 12;
          SQL
          echo SECOND_AUDIT_DONE=yes
          REMOTE
      - name: Diagnose protected PHP failure without replay
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===== SEND STDERR ERROR CLASS ====='
          python3 - <<'PY'
          import re
          p='/srv/backups/vesta-bazara-replay-20261110T143314Z/send-stderr.log'
          s=open(p,encoding='utf8',errors='replace').read()
          print('STDERR_BYTE_COUNT',len(s))
          for line in s.splitlines()[:25]:
             line=re.sub(r'https?://[^\s]+','[URL]',line)
             line=re.sub(r'(password|token|secret)\s*[:=]\s*\S+',r'\1=[REDACTED]',line,flags=re.I)
             line=re.sub(r'[A-Za-z0-9+/_=-]{45,}','[REDACTED]',line)
             print('PHP_ERROR_LINE',line[:330])
          p2='/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php'
          t=open(p2,encoding='utf8',errors='ignore').read()
          print('API_CONSTRUCTOR_DEFINED',bool(re.search(r'function\s+__construct\s*\(',t)))
          PY
          echo '===== VERIFY ORDER STILL NOT SENT ====='
          docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4' <<'SQL'
          SELECT 'order_105052_maha_id',COUNT(*) FROM wp_postmeta WHERE post_id=105052 AND meta_key='mahak_id' AND meta_value<>'';
          SELECT 'order_105052_bazara_local',COUNT(*) FROM wp_bazara_orders WHERE OrderClientId=105052;
          SQL
          REMOTE
      - name: Check whether one-time HTTP cron actually executed and updated ERP
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===== PATCH MARKER AND SYNTAX ====='
          grep -c 'VC_RECENT_BAZARA_CATCHUP_20261110' /srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php
          docker exec vc-vesta php -l /var/www/html/wp-content/plugins/bazara/classes/class.bazara.api.php
          echo '===== NATIVE WP EVENT STATE ====='
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=256M <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['REQUEST_URI']='/wp-cron.php';
          require '/var/www/html/wp-load.php';
          echo "REGISTERED_ACTION_COUNT=".has_action('bazara_run_sending_orders')."\n";
          echo "WP_NEXT_EVENT=".((int)wp_next_scheduled('bazara_run_sending_orders'))."\n";
          PHP
          echo '===== RECENT ACTION SCHEDULER ====='
          docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4' <<'SQL'
          SELECT status,COUNT(*),MAX(last_attempt_gmt) FROM wp_actionscheduler_actions WHERE hook='bazara_run_sending_orders' GROUP BY status;
          SELECT a.action_id,a.status,a.last_attempt_gmt FROM wp_actionscheduler_actions a WHERE a.hook='bazara_run_sending_orders' ORDER BY action_id DESC LIMIT 6;
          SELECT p.ID,COUNT(DISTINCT CASE WHEN pm.meta_key='mahak_id' AND pm.meta_value<>'' THEN pm.meta_id END) as marked,COUNT(DISTINCT b.OrderClientId) as local_ref
          FROM wp_posts p LEFT JOIN wp_postmeta pm ON pm.post_id=p.ID AND pm.meta_key='mahak_id'
          LEFT JOIN wp_bazara_orders b ON b.OrderClientId=p.ID
          WHERE p.ID IN (105052,105053,105204,105205,105206,105207)
          GROUP BY p.ID ORDER BY p.ID;
          SQL
          echo '===== SANITIZED PHP ERROR LOGS ====='
          for f in /srv/vestacutella/runtime/vesta/wp-content/debug.log /srv/vestacutella/runtime/vesta/wp-content/vc-debug.log;do
             if [[ -f "$f" ]];then echo "LOG_PRESENT=yes";grep -E 'VC_BAZARA_CATCHUP order=[0-9]+ ok=(yes|no)' "$f"|tail -8 || true;fi
          done
          docker logs --since 15m vc-vesta 2>&1 | grep -E 'VC_BAZARA_CATCHUP order=[0-9]+ ok=(yes|no)' | tail -8 || true
          echo HTTP_CRON_FOLLOWUP_COMPLETE=yes
          REMOTE
