name: Optimize both live stores

on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize-both-live.sh"
      - ".github/workflows/optimize-both-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload optimized live configs
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/nginx.conf "root@$HOST:/tmp/nginx.conf"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/docker-compose.yml "root@$HOST:/tmp/docker-compose.yml"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/optimize-both-live.sh "root@$HOST:/tmp/optimize-both-live.sh"
      - name: Optimize both stores
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/optimize-both-live.sh'
