name: Verify Vesta CLI mail worker live
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-vesta-cli-mail-worker-20261020.sh
      - .github/workflows/audit-vesta-cli-mail-worker-20261020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/audit-vesta-cli-mail-worker-20261020.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read cron logs and aggregate successful new order mail markers
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/audit-vesta-cli-mail-worker-20261020.sh "root@$HOST:/tmp/audit-vesta-cli-mail-worker-20261020.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/audit-vesta-cli-mail-worker-20261020.sh'
