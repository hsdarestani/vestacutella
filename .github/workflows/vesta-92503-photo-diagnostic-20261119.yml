name: Vesta 92503 photo transfer diagnosis November 19
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-92503-photo-diagnostic-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check Mahak cloud and Bazara photo gallery, Woo image, F2 logs and server-side picture availability
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $p=wc_get_product(103417);$variations=[];
          if(!$p)exit(12);
          foreach($p->get_children() as $id){
            $v=wc_get_product($id);if(!$v)continue;
            $variations[]=['id'=>$id,'image_id'=>$v->get_image_id(),'gallery_ids'=>$v->get_gallery_image_ids(),
              'erp_id'=>$v->get_meta('mahak_id',true),
              'erp_detail'=>$v->get_meta('mahak_product_detail_id',true)];
          }
          echo 'PENCIL_IMAGE_WOO='.wp_json_encode(['woo_id'=>103417,'sku'=>$p->get_sku(),
            'type'=>$p->get_type(),'status'=>$p->get_status(),
            'erp_id'=>(int)$p->get_meta('mahak_id',true),
            'image_id'=>$p->get_image_id(),'gallery'=>$p->get_gallery_image_ids(),
            'variants'=>$variations],JSON_UNESCAPED_UNICODE).PHP_EOL;
          $led=vesta_mhi_cloud_photo_ledger();
          $pic=[];$ids=[];$link=[];$all=0;
          foreach($led['Pictures']??[] as $v)if(empty($v['Deleted'])){$all++;$ids[(int)$v['PictureId']]=$v;}
          foreach($led['PhotoGalleries']??[] as $r){
            if(!is_array($r)||!empty($r['Deleted']))continue;
            $item=(int)($r['ItemCode']??0);$pid=(int)($r['PictureId']??0);
            $link[$item][]=$pid;
            if($item===10684982 || $item===92503)$pic[]=[
              'ItemCode'=>$item,'PictureId'=>$pid,
              'picture_exists'=>isset($ids[$pid]),'picture_url_field_present'=>!empty($ids[$pid]['Url'])];
          }
          echo 'PENCIL_CLOUD_PHOTOS='.wp_json_encode([
            'all_active_picture_count'=>$all,'all_relation_item_codes'=>array_keys($link),
            'relations_for_92503'=>$pic,'cloud_erp_10684982_has_photo'=>!empty($link[10684982]),
            'cloud_code_92503_has_photo'=>!empty($link[92503])
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          $tables=[];
          foreach(['bazara_pictures','bazara_photo_gallery'] as $short){
            $t=$wpdb->prefix.$short;
            $schema=$wpdb->get_col("SHOW COLUMNS FROM $t",0);
            $count=(int)$wpdb->get_var("SELECT COUNT(*) FROM $t");
            $rowv=in_array('RowVersion',$schema,true)?$wpdb->get_var("SELECT MAX(RowVersion) FROM $t"):null;
            $result=['rows'=>$count,'row_version'=>$rowv,'schema'=>$schema];
            if($short==='bazara_photo_gallery' && in_array('ItemCode',$schema,true)){
               $result['for_erp']=$wpdb->get_results($wpdb->prepare("SELECT * FROM $t WHERE ItemCode=%d",10684982),ARRAY_A);
               $result['for_product_code']=$wpdb->get_results($wpdb->prepare("SELECT * FROM $t WHERE ItemCode=%d",92503),ARRAY_A);
            }
            $tables[$short]=$result;
          }
          echo 'PENCIL_BAZARA_PHOTO_CACHE='.wp_json_encode($tables,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $settings=get_bazara_visitor_settings();
          echo 'PENCIL_PICTURE_POLICY='.wp_json_encode([
             'chkPicture'=>$settings['chkPicture']??null,
             'product_sync_enabled'=>$settings['chkProduct']??null,
             'new_status'=>$settings['publishStatus']??null,
             'image_importer_ready'=>function_exists('vesta_mhi_photo_rows')
          ]).PHP_EOL;
          try{
             $plan=vesta_mhi_plan(103417,10684982);
             echo 'PENCIL_PHOTO_IMPORT_PLAN='.wp_json_encode([
               'total'=>$plan['total'],'present'=>$plan['present'],
               'missing_count'=>count($plan['missing']),'reuse_count'=>count($plan['reuse']),
               'elsewhere'=>$plan['elsewhere']
             ]).PHP_EOL;
          }catch(Throwable $e){
             echo 'PENCIL_PHOTO_IMPORT_PLAN_BLOCK='.get_class($e).':'.$e->getMessage().PHP_EOL;
          }
          $auto=get_option('vesta_mhi_auto_last_report');
          echo 'PENCIL_AUTO_LAST_REPORT='.wp_json_encode([
            'completed_at'=>$auto['completed_at']??null,
            'errors'=>$auto['errors']??[],
            'images_added'=>$auto['images_added']??null,
            'blocked'=>$auto['blocked']??null,
            'variable_or_no_detail'=>$auto['variable_or_no_detail']??null
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'PENCIL_DIAGNOSTIC_READ_ONLY=yes'.PHP_EOL;
          PHP
