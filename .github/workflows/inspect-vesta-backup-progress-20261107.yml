name: Inspect Vesta backup progress read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-vesta-backup-progress-20261107.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect archive progress and installer account without changes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 100 sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" '
            echo === BACKUP_PROGRESS ===
            date -u +%Y-%m-%dT%H:%M:%SZ
            df -h /srv/backups | tail -n 1
            find /srv/backups -maxdepth 1 -type d -name "vesta-before-installer-*" -printf "%f\n" | sort | tail -n 3
            for d in /srv/backups/vesta-before-installer-*; do
              test -d "$d" || continue
              echo "BACKUP_DIR=$(basename "$d")"
              find "$d" -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
            done
            if id vesta-installer >/dev/null 2>&1; then echo USER_EXISTS; id -nG vesta-installer; else echo USER_NOT_CREATED_YET; fi
            echo === END ===
          '
