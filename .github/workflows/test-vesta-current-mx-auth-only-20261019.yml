name: Test SMTP auth on current Vesta MX without sending
on:
  push:
    branches: [main]
    paths:
      - scripts/test-vesta-current-mx-auth-only-20261019.sh
      - .github/workflows/test-vesta-current-mx-auth-only-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/test-vesta-current-mx-auth-only-20261019.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass dnsutils
      - name: Validate login with configured credentials at current MX
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/test-vesta-current-mx-auth-only-20261019.sh "root@$HOST:/tmp/test-vesta-current-mx-auth-only-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/test-vesta-current-mx-auth-only-20261019.sh'
