name: Deploy Mahak-to-Woo manual and bot import duplicate-identity safety
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-vesta-existing-mahak-import-identity-20261118.py
      - .github/workflows/deploy-vesta-mahak-existing-import-identity-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-mahak-existing-import-identity-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch code
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass python3 php-cli
          python3 -m py_compile scripts/patch-vesta-existing-mahak-import-identity-20261118.py
      - name: Protected install with backup, php lint, conflict tests and rollback
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            scripts/patch-vesta-existing-mahak-import-identity-20261118.py \
            "root@$HOST:/tmp/patch-vesta-existing-mahak-import-identity-20261118.py"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-mahak-existing-import-identity-deploy.lock
          flock -n 9
          mu=/srv/vestacutella/runtime/vesta/wp-content/mu-plugins
          target="$mu/vesta-mahak-site-import.php"
          backup=/srv/backups/vesta-existing-import-identity-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$backup"
          test -s "$target"
          cp -p "$target" "$backup/vesta-mahak-site-import.php"
          (cd "$backup";sha256sum vesta-mahak-site-import.php > SHA256SUMS;sha256sum -c SHA256SUMS)
          echo 'MAHAK_EXISTING_IMPORT_BACKUP_VERIFIED=yes'
          python3 /tmp/patch-vesta-existing-mahak-import-identity-20261118.py --target "$target"
          rollback(){
            code=$?
            trap - ERR
            cp -p "$backup/vesta-mahak-site-import.php" "$target"
            echo 'MAHAK_EXISTING_IMPORT_IDENTITY_ROLLED_BACK=yes'
            exit "$code"
          }
          trap rollback ERR
          python3 /tmp/patch-vesta-existing-mahak-import-identity-20261118.py --target "$target" --apply
          docker exec vc-vesta php -l /var/www/html/wp-content/mu-plugins/vesta-mahak-site-import.php
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          if(!function_exists('vms_verify_existing_link')||!function_exists('vms_block_unowned_canonical_code'))exit(51);
          $catalog=vmb_catalog(vmb_api());$mehrona=null;$book=null;
          foreach($catalog['Products']??[] as $g){
            if(!empty($g['Deleted']))continue;
            if((string)$g['ProductCode']==='103200')$mehrona=$g;
            if((string)$g['ProductCode']==='103201')$book=$g;
          }
          if(!$mehrona || !$book)exit(52);
          vms_verify_existing_link(103200,'103200',$mehrona);
          $blocked=false;
          try{vms_verify_existing_link(103201,'103201',$book);}
          catch(RuntimeException $e){$blocked=true;}
          if(!$blocked)exit(53);
          $blockedMissingSku=false;
          try{vms_block_unowned_canonical_code('103200',$mehrona);}
          catch(RuntimeException $e){$blockedMissingSku=true;}
          if(!$blockedMissingSku)exit(54);
          echo 'SAFE_EXISTING_IMPORT_VALID_PARENT_ACCEPTED=yes'.PHP_EOL;
          echo 'SAFE_EXISTING_IMPORT_BAD_VARIATION_REJECTED=yes'.PHP_EOL;
          echo 'SAFE_EXISTING_IMPORT_PREEXISTING_CANONICAL_PROTECTED=yes'.PHP_EOL;
          echo 'NO_CATALOG_MEDIA_STOCK_OR_FINANCIAL_WRITES_IN_TEST=yes'.PHP_EOL;
          PHP
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code"
            test "$code" = 200
          done
          trap - ERR
          echo 'MAHAK_EXISTING_IMPORT_IDENTITY_GUARD_DEPLOYED=yes'
          REMOTE
