name: Deploy approved Vesta category groups
on:
  push:
    branches: [main]
    paths:
      - scripts/vesta-final-four-groups.php
      - scripts/deploy-vesta-final-four-groups.sh
      - .github/workflows/deploy-vesta-final-four-groups.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-four-categories
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l scripts/vesta-final-four-groups.php
          bash -n scripts/deploy-vesta-final-four-groups.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Backup and apply final Vesta category restructuring
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-final-four-groups.php "root@$HOST:/tmp/vesta-final-four-groups.php"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/deploy-vesta-final-four-groups.sh "root@$HOST:/tmp/deploy-vesta-final-four-groups.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/deploy-vesta-final-four-groups.sh --apply'
