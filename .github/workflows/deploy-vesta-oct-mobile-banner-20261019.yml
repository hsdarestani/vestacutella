name: Optimize Vesta October mobile hero safely
on:
  push:
    branches: [main]
    paths:
      - infra/plugins/vesta-oct-mobile-banner/vesta-oct-mobile-banner.php
      - scripts/deploy-vesta-oct-mobile-banner-20261019.sh
      - .github/workflows/deploy-vesta-oct-mobile-banner-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-mobile-banner-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and deploy shell
        run: |
          bash -n scripts/deploy-vesta-oct-mobile-banner-20261019.sh
          php -l infra/plugins/vesta-oct-mobile-banner/vesta-oct-mobile-banner.php
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Apply mobile WebP banners with rollback and smoke tests
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null infra/plugins/vesta-oct-mobile-banner/vesta-oct-mobile-banner.php "root@$HOST:/tmp/vc-vesta-oct-banner-webp.php"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/deploy-vesta-oct-mobile-banner-20261019.sh "root@$HOST:/tmp/deploy-vesta-oct-mobile-banner-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/deploy-vesta-oct-mobile-banner-20261019.sh'
