name: Test Vesta legacy login on PHP 7.4

on:
  push:
    branches: [main]
    paths:
      - "scripts/test-vesta-legacy-login-php74.sh"
      - ".github/workflows/test-vesta-legacy-login-php74.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Test legacy login in isolated PHP 7.4 container
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/test-vesta-legacy-login-php74.sh "root@$HOST:/tmp/test-vesta-legacy-login-php74.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/test-vesta-legacy-login-php74.sh'
