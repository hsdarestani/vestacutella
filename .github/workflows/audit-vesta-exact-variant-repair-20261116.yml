name: Audit strict one-to-one Woo variations against existing Mahak details (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-vesta-exact-variant-repair-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass php-cli
      - run: php -l scripts/repair-vesta-storewide-exact-20261114.php
      - name: Read-only full-variant strict unique ERP mapping and collision audit
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' < scripts/repair-vesta-storewide-exact-20261114.php | tee variant-audit.log
          grep -Fq 'DRY_RUN_NO_WRITES=yes' variant-audit.log
          grep -F 'STRICT_ONE_TO_ONE_CANDIDATES=' variant-audit.log
