name: Inspect DigiPay phone validation source
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-digipay-phone-source.sh"
      - ".github/workflows/audit-digipay-phone-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/audit-digipay-phone-source.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect validation and file permission context
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/audit-digipay-phone-source.sh "root@$HOST:/tmp/audit-digipay-phone-source.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/audit-digipay-phone-source.sh'
