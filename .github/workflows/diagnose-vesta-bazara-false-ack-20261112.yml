name: Diagnose Bazaar false-positive order acknowledgment without writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-vesta-bazara-false-ack-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read exact API success conditions and sanitized error structure
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "AUDIT_UTC=$(date -u +%FT%TZ)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php')
          a=p.read_text(encoding='utf8',errors='replace').splitlines()
          for lo,hi in [(3740,3820),(3820,3900)]:
            print('SOURCE_LINES',lo,hi)
            for i in range(lo,hi+1):
              s=a[i-1].rstrip()
              if re.search(r'password|token|api.?key|authorization|secret|http_post',s,re.I):s='[REDACTED]'
              print('PHP_LINE',i,s[:190])
          PY
          echo '===== STRIPPED MAHAK ERROR CLASSIFICATION ====='
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=256M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $raw=(string)get_post_meta(105309,'mahak_error',true);
          echo "MAHAK_ERROR_LENGTH=".strlen($raw)."\n";
          echo "MAHAK_ERROR_SHA256=".hash('sha256',$raw)."\n";
          echo "MAHAK_ERROR_BEFORE_FIRST_CHAR_ORD=".(strlen($raw)>0?ord($raw[0]):0)."\n";
          foreach(['stock','discount','carrier','shipping','SendCost','order','Order','result','Receipt',
            'cheque','BankId','Invalid','failure','fail','تخفیف','ارسال','سفارش','موجودی','خطا','مجوز','اعتبار',
            'Price','amount','success','duplicate'] as $word){
            if(stripos($raw,$word)!==false)echo "ERROR_CONTAINS=".preg_replace('/[^a-zA-Z]/','_',$word)."\n";
          }
          foreach([$raw,trim($raw,'"'),stripslashes($raw)] as $a){
            $d=json_decode($a,true);
            if(!is_array($d))continue;
            echo "ERROR_JSON_DEPTH_1_KEYS=".implode(',',array_map('strval',array_keys($d)))."\n";
            foreach(['Data','Objects','Result','Message','message','success','error','errors'] as $k){
              if(!isset($d[$k]))continue;
              $v=$d[$k];
              if(is_array($v))echo "ERROR_PATH_".$k."_KEYS=".implode(',',array_map('strval',array_keys($v)))."\n";
              else echo "ERROR_PATH_".$k."_TYPE=".gettype($v)."\n";
            }
          }
          echo "READ_ONLY_ERROR_STRUCTURE_CHECK_COMPLETE=yes\n";
          PHP
          REMOTE
