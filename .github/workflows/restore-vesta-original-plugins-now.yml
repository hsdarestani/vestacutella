name: Restore Vesta original plugins

on:
  push:
    branches: [main]
    paths:
      - "scripts/restore-vesta-original-plugins-now.sh"
      - ".github/workflows/restore-vesta-original-plugins-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Restore original Vesta plugins
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/restore-vesta-original-plugins-now.sh "root@$HOST:/tmp/restore-vesta-original-plugins-now.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/restore-vesta-original-plugins-now.sh'
