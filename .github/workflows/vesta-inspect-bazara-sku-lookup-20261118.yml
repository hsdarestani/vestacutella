name: Inspect exact Bazara SKU lookup behavior for safe matching patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-inspect-bazara-sku-lookup-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read SKU functions and product selection blocks (no credentials, no writes)
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import re
          root=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara')
          for path in root.rglob('*.php'):
            if path.stat().st_size>1000000 or 'vendor' in str(path):continue
            lines=path.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'\bfunction\s+(bazara_get_product_by_sku|get_product_by_mahakID|wc_get_product_object_type)\s*\(',line):
                print('DEFINITION',path.relative_to(root),i+1)
                for j in range(max(0,i-2),min(len(lines),i+45)):
                  s=lines[j]
                  if re.search(r'(?i)(password|token|secret|https?://|authorization|api.?key)',s):s='[REDACTED]'
                  print('DEF_LINE',j+1,s[:230])
          PY
