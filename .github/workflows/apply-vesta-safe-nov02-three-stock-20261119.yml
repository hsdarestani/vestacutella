name: Safely correct three verified Vesta 11-Aban Woo stock undercounts
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-vesta-safe-nov02-three-stock-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-production-nov02-stock-and-accounting
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass php-cli
      - name: Syntax and invariants for Woo-only guarded stock restoration
        run: |
          set -Eeuo pipefail
          php -l scripts/vesta-safe-nov02-three-stock-restores-20261119.php
          grep -Fq 'START TRANSACTION' scripts/vesta-safe-nov02-three-stock-restores-20261119.php
          grep -Fq 'FOR UPDATE' scripts/vesta-safe-nov02-three-stock-restores-20261119.php
          grep -Fq 'ROLLBACK' scripts/vesta-safe-nov02-three-stock-restores-20261119.php
      - name: First read-only on production, no stock writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" \
           'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M /dev/stdin' \
           < scripts/vesta-safe-nov02-three-stock-restores-20261119.php \
           | tee preflight.txt
          grep -Fq 'NOV02_SAFE_WOO_STOCK_DRY_RUN_PASS=yes' preflight.txt
      - name: Back up affected tables, verify and execute only exact three Woo adjustments
        env:
          HOST: __HOST__
          SSHPASS: __PASS__
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
             scripts/vesta-safe-nov02-three-stock-restores-20261119.php \
             "root@$HOST:/tmp/vesta-safe-nov02-three-stock-restores.php"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-production-nov02-stock.lock
          flock -n 9
          file=/tmp/vesta-safe-nov02-three-stock-restores.php
          php -l "$file"
          backups=/srv/backups/vesta-nov02-safe-stock-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$backups"
          cp "$file" "$backups/applied-verified-logic.php"
          docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb-dump -uroot --single-transaction --quick "$MARIADB_DATABASE" wp_postmeta wp_wc_product_meta_lookup' | gzip -1 > "$backups/before-postmeta-and-stock.sql.gz"
          gzip -t "$backups/before-postmeta-and-stock.sql.gz"
          (cd "$backups";sha256sum before-postmeta-and-stock.sql.gz > SHA256SUMS;sha256sum -c SHA256SUMS)
          echo 'NOV02_STOCK_BEFORE_DB_BACKUP_VERIFIED=yes'
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M /dev/stdin --apply < "$file" | tee "$backups/applied.log"
          grep -Fq 'NOV02_SAFE_WOO_STOCK_APPLIED_AND_VERIFIED=yes' "$backups/applied.log"
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $target=[102492=>4,69849=>20,24102=>48];
          $seen=[];foreach($target as $id=>$qty){
             $p=wc_get_product($id);
             if(!$p||(int)$p->get_stock_quantity()!==$qty)exit(42);
             $seen[$id]=['sku'=>$p->get_sku(),'qty'=>$p->get_stock_quantity(),
               'mahak_detail'=>$p->get_meta('mahak_product_detail_id',true)];
          }
          $j=get_option('vesta_11aban_stock_safe_repair_20261119_v1');
          if(!is_array($j)||count($j['corrected']??[])!==3)exit(43);
          echo 'NOV02_SAFE_WOO_STOCK_INDEPENDENT_READBACK='.wp_json_encode($seen).PHP_EOL;
          echo 'NOV02_SAFE_WOO_STOCK_THREE_PRODUCT_ACCEPTANCE_PASS=yes'.PHP_EOL;
          PHP
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
             http=$(curl --noproxy '*' -ksS --connect-timeout 6 --max-time 16 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
             echo "NOV02_SITE_HTTP $host=$http";test "$http" = 200
          done
          echo 'NOV02_STOCK_ONLY_VERIFIED_ROWS_CORRECTED=yes'
          echo 'NOV02_NO_MAHAK_INVOICES_OR_STOCK_POSTED=yes'
          REMOTE
