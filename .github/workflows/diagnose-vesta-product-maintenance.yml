name: Diagnose Vesta product maintenance

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose-vesta-product-maintenance.sh"
      - ".github/workflows/diagnose-vesta-product-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Diagnose Vesta product maintenance
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/diagnose-vesta-product-maintenance.sh "root@$HOST:/tmp/diagnose-vesta-product-maintenance.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/diagnose-vesta-product-maintenance.sh'
