name: Inspect Vesta app routing after upstream recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-vesta-app-routing-20261024.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only routing diagnostics
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 50 sshpass -e scp -o ConnectTimeout=14 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/diag-vesta-app-routing-20261024.sh "root@$HOST:/tmp/diag-vesta-app-routing-20261024.sh"
          timeout 100 sshpass -e ssh -o ConnectTimeout=14 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/diag-vesta-app-routing-20261024.sh'
