name: Optimize Cutella guest Dashicons safely
on:
  push:
    branches: [main]
    paths:
      - "scripts/deploy-cutella-guest-dashicons.sh"
      - ".github/workflows/deploy-cutella-guest-dashicons.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-cutella-guest-home
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Apply with rollback and three-domain checks
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/deploy-cutella-guest-dashicons.sh "root@$HOST:/tmp/vc-cutella-dashicons.sh"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "bash /tmp/vc-cutella-dashicons.sh"
