name: Audit exact Bazaar mappings for newest paid orders
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-vesta-recent-erp-mappings-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only identify exact missing product and variant mappings
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M -d max_execution_time=0' \
            < scripts/audit-repair-vesta-recent-bazara-mappings-20261112.php
          echo '===== EIGHT UNMATCHED SKU DETAILS ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M -d max_execution_time=0' \
            < scripts/audit-vesta-8-variant-discrepancies-20261114.php
          echo '===== ACCOUNTING PARITY RECONCILIATION ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M -d max_execution_time=0' \
            < scripts/audit-vesta-erp-verified-orders-20261114.php
          echo '===== ALL ACTIVE STORE VARIATIONS ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M -d max_execution_time=0' \
            < scripts/audit-vesta-all-active-variant-coverage-20261114.php
          echo '===== FULL STORE STRICT EXACT MATCH CLASSIFICATION ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M -d max_execution_time=0' \
            < scripts/audit-vesta-full-exact-erp-mapping-20261114.php
          echo '===== STOREWIDE COLLISION CLASSIFICATION READ ONLY ====='
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 \
            "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M -d max_execution_time=0' \
            < scripts/repair-vesta-storewide-exact-20261114.php

