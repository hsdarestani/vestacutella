name: Vesta one Mahak photo source 1887347 availability and immutable Woo photo preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-image-103201-source-canary-preflight-20261117.yml, scripts/vesta-auto-map-verified-existing-variations-20261117.php]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify exact Mahak pic and URL content type, no writes or image import
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);define('WP_DISABLE_FATAL_ERROR_HANDLER',true);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $item=10755477;$picId=1887347;$wooId=103201;echo 'PHOTO_PREFLIGHT_STAGE=BOOTED'.PHP_EOL;
          $product=wc_get_product($wooId);
          if(!$product || (int)get_post_meta($wooId,'mahak_id',true)!==$item ||
             (int)get_post_meta($wooId,'mahak_product_detail_id',true)<=0||
             !vesta_bazara_image_patch_verified())exit(21);
          echo 'PHOTO_PREFLIGHT_STAGE=PRODUCT_OK'.PHP_EOL;
          $picture=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$wpdb->prefix}bazara_pictures WHERE PictureId=%d AND Deleted=0",$picId),ARRAY_A);
          $relation=$wpdb->get_results($wpdb->prepare("SELECT ItemCode FROM {$wpdb->prefix}bazara_photo_gallery WHERE PictureId=%d AND Deleted=0",$picId),ARRAY_A);
          if(!$picture||count($relation)!==1||(int)$relation[0]['ItemCode']!==$item)exit(22);
          echo 'PHOTO_PREFLIGHT_STAGE=PICTURE_RELATION_OK'.PHP_EOL;
          $name=basename((string)$picture['Url']);$ext=strtolower(pathinfo($name,PATHINFO_EXTENSION));
          if(!$name||!in_array($ext,['jpg','jpeg','png','webp'],true))exit(23);
          echo 'PHOTO_PREFLIGHT_STAGE=FILENAME_OK'.PHP_EOL;
          $api=new BazaraApi(true);$ref=new ReflectionClass($api);
          if(!$ref->hasProperty('img_url'))exit(24);
          $prop=$ref->getProperty('img_url');$prefix=(string)$prop->getValue($api);
          echo 'PHOTO_PREFLIGHT_STAGE=REMOTE_BASE_OK'.PHP_EOL;
          $url=$prefix.$name;
          $parts=wp_parse_url($url);
          if(!$parts||strtolower($parts['scheme']??'')!=='https' || empty($parts['host']))exit(25);
          echo 'PHOTO_PREFLIGHT_STAGE=HTTPS_URL_OK'.PHP_EOL;
          $res=wp_remote_head($url,['timeout'=>20,'redirection'=>2,'sslverify'=>true]);
          if(is_wp_error($res)){echo 'IMAGE_CANARY_SOURCE_HEAD_ERROR=yes'.PHP_EOL;exit(26);}
          $code=(int)wp_remote_retrieve_response_code($res);
          $ct=strtolower((string)wp_remote_retrieve_header($res,'content-type'));
          $length=(string)wp_remote_retrieve_header($res,'content-length');
          echo 'IMAGE_CANARY_103201_SOURCE='.json_encode([
            'picture_id'=>$picId,'erp_item'=>$item,'woo_id'=>$wooId,
            'existing_featured_image_id'=>(int)$product->get_image_id(),
            'existing_gallery_count'=>method_exists($product,'get_gallery_image_ids')?count($product->get_gallery_image_ids()):null,
            'picture_already_marked_synced'=>!empty($picture['isSync']),
            'remote_http_code'=>$code,'content_type'=>$ct,'content_length_reported'=>$length,
            'extension'=>$ext,'image_preservation_patch_verified'=>true
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          if($code!==200 || strpos($ct,'image/')!==0)exit(27);
          echo "IMAGE_CANARY_SOURCE_READY_NO_IMAGE_WRITES=yes\n";
          PHP
