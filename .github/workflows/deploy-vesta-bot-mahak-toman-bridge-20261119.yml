name: Deploy Mahak bot Toman product bridge with backup and safe review
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-vesta-bot-mahak-toman-bridge-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-mahak-accounting-product-bridge-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Prepare pinned old/new source and syntax validation
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          curl -fsSL --retry 3 --connect-timeout 10 \
           https://raw.githubusercontent.com/hsdarestani/ordersvesta/65421aa299508f33c70c53d1464b9a467faa831d/wordpress/mu-plugins/vesta-mahak-product-bridge.php \
           -o /tmp/vesta-bridge-known-previous.php
          curl -fsSL --retry 3 --connect-timeout 10 \
           https://raw.githubusercontent.com/hsdarestani/ordersvesta/8a304ba5f71523ce288c89a3bbdf9fb876eb281d/wordpress/mu-plugins/vesta-mahak-product-bridge.php \
           -o /tmp/vesta-bridge-explicit-toman.php
          php -l /tmp/vesta-bridge-explicit-toman.php
          grep -Fq "'price_toman'" /tmp/vesta-bridge-explicit-toman.php
      - name: Deploy only if previous bridge matches reviewed source
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/vesta-bridge-known-previous.php /tmp/vesta-bridge-explicit-toman.php \
            "root@$HOST:/tmp/"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/vesta-mahak-product-bridge-deploy.lock; flock -n 9
          mu=/srv/vestacutella/runtime/vesta/wp-content/mu-plugins
          file="$mu/vesta-mahak-product-bridge.php"
          backup=/srv/backups/vesta-mahak-product-bridge-toman-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -m 0700 -p "$backup"
          test -s "$file"
          if cmp -s "$file" /tmp/vesta-bridge-explicit-toman.php;then
            echo 'MAHAK_TOMAN_BRIDGE_ALREADY_INSTALLED=yes'
          else
            if ! cmp -s "$file" /tmp/vesta-bridge-known-previous.php;then
              echo 'MAHAK_TOMAN_BRIDGE_UNREVIEWED_LIVE_DIFFERENCE=yes'
              exit 35
            fi
            cp -p "$file" "$backup/previous-bridge.php"
            cp /tmp/vesta-bridge-explicit-toman.php "$mu/.vesta-mahak-product-bridge.next"
            chown --reference="$file" "$mu/.vesta-mahak-product-bridge.next"
            chmod 644 "$mu/.vesta-mahak-product-bridge.next"
            mv "$mu/.vesta-mahak-product-bridge.next" "$file"
            echo 'MAHAK_TOMAN_BRIDGE_UPDATED=yes'
          fi
          rollback(){
            rc=$?;trap - ERR
            if test -s "$backup/previous-bridge.php";then
              cp -p "$backup/previous-bridge.php" "$file"
              echo 'MAHAK_TOMAN_BRIDGE_ROLLED_BACK=yes'
            fi
            exit "$rc"
          }
          trap rollback ERR
          docker exec vc-vesta php -l /var/www/html/wp-content/mu-plugins/vesta-mahak-product-bridge.php
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=512M <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $c=get_option('bazara_visitor_settings',[]);
          if(($c['selectCurrencySoftware']??'')!=='toman' ||
             ($c['selectCurrencyPlugin']??'')!=='toman')exit(41);
          if(!function_exists('vmb_submit')||!function_exists('vmb_status')||!function_exists('vmb_template')||!function_exists('vesta_mcb_stage'))exit(42);
          $out=vmb_template(['template_code'=>'8079']);
          if((string)($out['code']??'')!=='8079')exit(43);
          echo 'MAHAK_SITE_CURRENCY_TOMAN_VERIFIED=yes'.PHP_EOL;
          echo 'MAHAK_NEW_PRICE_INPUT_TOMAN_CONTRACT_READY=yes'.PHP_EOL;
          echo 'MAHAK_PRODUCT_TEMPLATE_READ_ONLY_VERIFIED=yes'.PHP_EOL;
          echo 'NO_PRODUCT_OR_ACCOUNTING_WRITES=yes'.PHP_EOL;
          PHP
          for h in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            c=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 20 \
               --resolve "$h:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$h/")
            echo "SITE=$h HTTP=$c";test "$c" = 200
          done
          trap - ERR
          echo 'MAHAK_TOMAN_BRIDGE_PRODUCTION_ACCEPTED=yes'
          REMOTE
