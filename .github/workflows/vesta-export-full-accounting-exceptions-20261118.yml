name: Export all unresolved Vesta accounting outbox rows (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vesta-export-full-accounting-exceptions-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Export sanitized full production queue without accounting writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          test -n "$HOST"
          test -n "$SSHPASS"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP' > vesta-unresolved-accounting-20261118.csv
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';
          $_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          global $wpdb;
          if(!class_exists('Vesta_Accounting_Reliability')){fwrite(STDERR,"ACCOUNTING_PLUGIN_MISSING\n");exit(20);}
          $table=Vesta_Accounting_Reliability::table();
          $rows=$wpdb->get_results("SELECT order_id,state,reason,remote_id,attempts,submitted_at FROM $table WHERE state<>'verified' ORDER BY order_id DESC",ARRAY_A);
          if(!is_array($rows)||count($rows)<1000){fwrite(STDERR,"OUTBOX_INCOMPLETE\n");exit(21);}
          $out=fopen('php://output','w');
          fputcsv($out,['order_id','state','reason','cloud_invoice_id','attempts','previously_submitted']);
          foreach($rows as $row){
            $state=preg_replace('/[^A-Za-z0-9_-]/','_',substr((string)$row['state'],0,80));
            $reason=preg_replace('/[^A-Za-z0-9_-]/','_',substr((string)$row['reason'],0,100));
            $submitted=!empty($row['submitted_at']) && $row['submitted_at']!=='0000-00-00 00:00:00';
            fputcsv($out,[(int)$row['order_id'],$state,$reason,(int)$row['remote_id'],(int)$row['attempts'],$submitted?1:0]);
          }
          fclose($out);
          PHP
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          p=Path("vesta-unresolved-accounting-20261118.csv")
          with p.open(newline="", encoding="utf-8") as f:
              reader=csv.DictReader(f)
              expected=["order_id","state","reason","cloud_invoice_id","attempts","previously_submitted"]
              assert reader.fieldnames==expected, "Invalid CSV header (possible PHP error)"
              counts=Counter()
              seen=set()
              total=0
              for row in reader:
                  assert row["order_id"].isdigit() and int(row["order_id"])>0
                  assert row["order_id"] not in seen,"Duplicate Woo order"
                  seen.add(row["order_id"])
                  assert row["state"] and row["state"].replace("_","").replace("-","").isalnum()
                  assert row["reason"].replace("_","").replace("-","").isalnum()
                  for key in ("cloud_invoice_id","attempts","previously_submitted"):
                      assert row[key].isdigit(),f"Invalid numeric field {key}"
                  counts[(row["state"],row["reason"])]+=1
                  total+=1
              assert total>=1000, f"Incomplete export: {total}"
          summary=["# Vesta complete unresolved accounting outbox snapshot",
                   "",
                   "Production read-only export. No invoice, customer, catalog, stock, or order mutations.",
                   f"Total unresolved rows: **{total}**.",
                   "",
                   "| State | Reason | Count |",
                   "|---|---|---:|"]
          for (state,reason),count in sorted(counts.items(), key=lambda x: (-x[1],x[0])):
              summary.append(f"| {state} | {reason or '(none)'} | {count} |")
          Path("vesta-unresolved-accounting-summary-20261118.md").write_text("\n".join(summary)+"\n", encoding="utf-8")
          print("FULL_UNRESOLVED_COUNT="+str(total))
          for (state,reason),count in sorted(counts.items()):
              print("UNRESOLVED_COUNT state="+state+" reason="+reason+" n="+str(count))
          PY
          cat vesta-unresolved-accounting-summary-20261118.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain private sanitized export and summary
        uses: actions/upload-artifact@v4
        with:
          name: vesta-complete-unresolved-accounting-20261118
          path: |
            vesta-unresolved-accounting-20261118.csv
            vesta-unresolved-accounting-summary-20261118.md
          if-no-files-found: error
          retention-days: 30
