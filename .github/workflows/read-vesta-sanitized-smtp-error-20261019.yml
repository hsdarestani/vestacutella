name: Inspect sanitized Vesta SMTP failure
on:
  push:
    branches: [main]
    paths:
      - scripts/read-vesta-sanitized-smtp-error-20261019.sh
      - .github/workflows/read-vesta-sanitized-smtp-error-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/read-vesta-sanitized-smtp-error-20261019.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect one redacted SMTP error
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/read-vesta-sanitized-smtp-error-20261019.sh "root@$HOST:/tmp/read-vesta-sanitized-smtp-error-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/read-vesta-sanitized-smtp-error-20261019.sh'
