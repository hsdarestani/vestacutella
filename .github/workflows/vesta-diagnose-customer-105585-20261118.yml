name: Diagnose Vesta customer registration for Woo order 105585 (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vesta-diagnose-customer-105585-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect Woo account, ERP person and sync guard without customer or financial writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          global $wpdb;
          $id=105585; $o=wc_get_order($id);
          if(!$o){echo "ORDER_NOT_FOUND=yes\n"; exit(0);}
          $uid=(int)$o->get_customer_id();$u=$uid?get_user_by('id',$uid):false;
          $phone=vesta_otp_phone((string)$o->get_billing_phone());
          $profilePhone=$uid?vesta_otp_phone((string)get_user_meta($uid,'billing_phone',true)):false;
          $owner=$phone?vesta_otp_existing_user($phone):false;
          $bill=vcar_identity_normalize_name($o->get_billing_first_name().' '.$o->get_billing_last_name());
          $profile=$u?vcar_identity_normalize_name($u->first_name.' '.$u->last_name):'';
          $old=$uid?(int)get_user_meta($uid,'mahak_id',true):0;
          $attempt=$uid?(string)get_user_meta($uid,'_vesta_person_provision_attempt',true):'';
          $cloudLink=$uid?(int)get_user_meta($uid,'_vesta_erp_cloud_verified_person_id',true):0;
          $outbox=$wpdb->get_row($wpdb->prepare("SELECT state,reason,remote_id,attempts,submitted_at FROM ".Vesta_Accounting_Reliability::table()." WHERE order_id=%d",$id),ARRAY_A);
          $api=new BazaraApi(true);$resp=$api->get_all_data('',array('fromPersonVersion'=>0));
          if(!is_array($resp)||empty($resp['success'])||!is_array($resp['message']['People']??null)){
            echo 'CLOUD_PEOPLE_READ_FAILED=yes'.PHP_EOL;exit(12);
          }
          $sameClient=[];$samePhone=[];$exact=[];$byLink=[];
          foreach($resp['message']['People'] as $p){
            if(!empty($p['Deleted']))continue;
            $client=(int)($p['PersonClientID']??$p['PersonClientId']??0);
            $mob=vesta_otp_phone((string)($p['Mobile']??''));
            $personName=vcar_identity_normalize_name(($p['FirstName']??'').' '.($p['LastName']??''));
            if($uid>0&&$client===$uid)$sameClient[]=$p;
            if($phone&&$mob===$phone)$samePhone[]=$p;
            if($phone&&$mob===$phone&&$bill!==''&&$personName===$bill)$exact[]=$p;
            if($old>0&&(int)($p['PersonId']??0)===$old)$byLink[]=$p;
          }
          $sameClientNamePhoneOk=count($sameClient)===1 &&
            vesta_otp_phone((string)($sameClient[0]['Mobile']??''))===$phone &&
            vcar_identity_normalize_name(($sameClient[0]['FirstName']??'').' '.($sameClient[0]['LastName']??''))===$bill;
          $out=['order'=>$id,'woo_status'=>$o->get_status(),'paid'=>!!$o->get_date_paid(),
            'order_created_at'=>$o->get_date_created()?$o->get_date_created()->date('Y-m-d H:i:s'):'',
            'financial_outbox_state'=>$outbox['state']??'absent',
            'financial_outbox_reason'=>$outbox['reason']??'',
            'financial_outbox_remote_id'=>(int)($outbox['remote_id']??0),
            'has_woo_account'=>$uid>0,'woo_user_exists'=>(bool)$u,
            'channel_customer'=>$uid>0&&class_exists('Vesta_Channel_Customers')?Vesta_Channel_Customers::customer($uid):false,
            'billing_name_present'=>$bill!=='','profile_name_matches_checkout'=>$bill!==''&&$bill===$profile,
            'billing_phone_present'=>(bool)$phone,'profile_phone_matches_checkout'=>$phone&&$profilePhone===$phone,
            'verified_phone_owner_is_account'=>is_numeric($owner)&&$uid>0&&(int)$owner===$uid,
            'existing_mahak_link_present'=>$old>0,'existing_mahak_link_is_in_cloud'=>count($byLink)===1,
            'cloud_verified_person_link_present'=>$cloudLink>0,
            'person_provision_attempt_reserved'=>$attempt!=='',
            'cloud_person_by_woo_account_id_count'=>count($sameClient),
            'cloud_person_same_phone_count'=>count($samePhone),
            'cloud_person_exact_name_phone_count'=>count($exact),
            'cloud_person_account_identity_valid'=>$sameClientNamePhoneOk,
            'eligible_financial_order'=>vcar_eligible($o)];
          echo 'CUSTOMER_ORDER_DIAGNOSTIC='.json_encode($out,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'READ_ONLY_NO_PERSON_NO_ORDER_NO_INVOICE_NO_STOCK_WRITES=yes'.PHP_EOL;
          PHP
