name: Audit Bazaar product variation mappings read only
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-vesta-bazara-variation-mappings-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect mapped parent, child, and Bazara product detail data
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          db() { docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4'; }
          echo '===== PARENT AND VARIATION MAPPING ====='
          cat <<'SQL' | db
          SELECT p.ID,p.post_parent,p.post_type,
            COALESCE(MAX(CASE WHEN m.meta_key='mahak_product_detail_id' THEN m.meta_value END),'') AS mahak_detail,
            COALESCE(MAX(CASE WHEN m.meta_key='mahak_id' THEN m.meta_value END),'') AS mahak_product,
            COALESCE(MAX(CASE WHEN m.meta_key='_sku' THEN m.meta_value END),'') AS sku
          FROM wp_posts p
          LEFT JOIN wp_postmeta m ON m.post_id=p.ID AND m.meta_key IN('mahak_product_detail_id','mahak_id','_sku')
          WHERE p.ID IN(42807,42801,45092,45079,33051,33045,102250,102253,102249,100023,37746,45900,45887,58872,58867,101269,81885,56381,56377,54598,54591,101872,101870,44569,44556,100273,41902,41893,35120,35117,35112,73200,73091)
          GROUP BY p.ID,p.post_parent,p.post_type ORDER BY p.post_parent,p.ID;
          SELECT 'MAPPED_PARENT_UNMAPPED_VARIATIONS', COUNT(*)
          FROM wp_posts c JOIN wp_posts p ON p.ID=c.post_parent
          JOIN wp_postmeta m ON m.post_id=p.ID AND m.meta_key='mahak_product_detail_id' AND m.meta_value<>''
          LEFT JOIN wp_postmeta v ON v.post_id=c.ID AND v.meta_key='mahak_product_detail_id' AND v.meta_value<>''
          WHERE c.post_type='product_variation' AND v.meta_id IS NULL;
          SQL
          echo '===== REMOTE CATALOG TABLE SHAPES ====='
          cat <<'SQL' | db
          SHOW COLUMNS FROM wp_bazara_products;
          SHOW COLUMNS FROM wp_bazara_product_details;
          SELECT 'CACHED_DETAIL_ROWS',COUNT(*) FROM wp_bazara_product_details;
          SELECT 'CACHED_PRODUCT_ROWS',COUNT(*) FROM wp_bazara_products;
          SQL
          echo '===== VARIATION SIBLING COUNTS ====='
          cat <<'SQL' | db
          SELECT post_parent,COUNT(*) AS variations FROM wp_posts WHERE post_type='product_variation' AND post_parent IN(42801,45079,33045,102249,37746,45887,58867,56377,54591,101870,44556,41893,35112,73091) GROUP BY post_parent ORDER BY post_parent;
          SQL
          echo '===== SIBLINGS WITH EXISTING MAPPING ====='
          cat <<'SQL' | db
          SELECT c.post_parent, COUNT(*) as mapped_siblings, COUNT(DISTINCT m.meta_value) distinct_detail_ids
          FROM wp_posts c JOIN wp_postmeta m ON m.post_id=c.ID AND m.meta_key='mahak_product_detail_id' AND m.meta_value<>''
          WHERE c.post_type='product_variation' AND c.post_parent IN(42801,45079,33045,102249,37746,45887,58867,56377,54591,101870,44556,41893,35112,73091)
          GROUP BY c.post_parent;
          SQL
          echo VARIATION_AUDIT_COMPLETE=yes
          REMOTE
      - name: Match exact child SKUs to Bazara cached product and detail IDs
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          db() { docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4'; }
          echo '===== MATCH RATES OF EXACT VARIATION IDENTIFIERS ====='
          cat <<'SQL' | db
          SELECT p.ID,p.post_parent,
            (SELECT COUNT(*) FROM wp_bazara_products b WHERE b.Post_ID=p.ID) AS match_post_id,
            (SELECT COUNT(*) FROM wp_bazara_products b WHERE b.sku=CAST(p.ID AS CHAR)) AS match_sku,
            (SELECT COUNT(*) FROM wp_bazara_products b WHERE b.ProductCode=p.ID) AS match_product_code,
            (SELECT COUNT(*) FROM wp_bazara_products b WHERE b.Post_ID=p.post_parent) AS parent_match_post_id
          FROM wp_posts p WHERE p.ID IN (42807,45092,33051,102250,102253,100023,45900,58872,56381,54598,101872,44569,41902,35120,35117,73200)
          ORDER BY p.ID;
          SELECT 'CACHED_POST_IDS_NONZERO',COUNT(*) FROM wp_bazara_products WHERE Post_ID IS NOT NULL AND Post_ID>0;
          SELECT 'ALL_MAPPED_WOO_PRODUCT_DETAILS',COUNT(DISTINCT post_id) FROM wp_postmeta WHERE meta_key='mahak_product_detail_id' AND meta_value<>'';
          SQL
          echo '===== EXACT MATCHED CACHED BAZARA PRODUCT DETAILS ====='
          cat <<'SQL' | db
          SELECT b.ProductId,b.Post_ID,b.sku,b.ProductCode,COUNT(DISTINCT d.ProductDetailId) AS available_details,
            MIN(d.ProductDetailId) AS possible_detail_id
          FROM wp_bazara_products b LEFT JOIN wp_bazara_product_details d ON d.ProductId=b.ProductId
          WHERE b.Post_ID IN(42807,45092,33051,102250,102253,100023,45900,58872,56381,54598,101872,44569,41902,35120,35117,73200,
                             42801,45079,33045,102249,37746,45887,58867,56377,54591,101870,44556,41893,35112,73091)
             OR b.sku IN ('42807','45092','33051','102250','102253','100023','45900','58872','56381','54598','101872','44569','41902','35120','35117','73200')
             OR b.ProductCode IN (42807,45092,33051,102250,102253,100023,45900,58872,56381,54598,101872,44569,41902,35120,35117,73200)
          GROUP BY b.ProductId,b.Post_ID,b.sku,b.ProductCode ORDER BY b.ProductId LIMIT 60;
          SQL
          echo VARIATION_MATCH_AUDIT_DONE=yes
          REMOTE
