name: Check configured Telegram recipient format
on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-vesta-telegram-recipient-format.sh"
      - ".github/workflows/inspect-vesta-telegram-recipient-format.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Inspect sanitized format only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/inspect-vesta-telegram-recipient-format.sh "root@$HOST:/tmp/inspect-vesta-telegram-recipient-format.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/inspect-vesta-telegram-recipient-format.sh'
