name: Audit Vesta order financial parity without writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-vesta-order-finance-parity-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Compare 600 latest Woo orders with accurate accounting totals
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" \
            'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=384M -d max_execution_time=0' \
            < scripts/audit-vesta-bazara-financial-parity-20261112.php
