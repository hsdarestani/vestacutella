name: Provision private read-only Vesta phpMyAdmin access
on:
  push:
    branches: [main]
    paths: [".github/workflows/provision-vesta-phpmyadmin-20261109.yml"]
permissions:
  contents: read
concurrency:
  group: vesta-phpmyadmin-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Provision and smoke-test phpMyAdmin on the Vesta host
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          work=$(mktemp -d)
          tunnel_pid=
          trap 'if test -n "$tunnel_pid"; then kill "$tunnel_pid" 2>/dev/null || true; fi; rm -rf -- "$work"' EXIT
          printf '%s %s\n' "$HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMepyPq2JoyC+n31wd8tBhN707fXYGqkIc0VOaAAbcIC' > "$work/known_hosts"
          ssh_options=(-F /dev/null -o ConnectTimeout=18 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          timeout 540 sshpass -e ssh "${ssh_options[@]}" -T "root@$HOST" 'bash -s' <<'VESTA_PMA_REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          export LC_ALL=C
          
          container=vc-vesta-phpmyadmin
          network=vestacutella-backend
          db_container=vc-db-vesta
          db_name=vestacos_m
          db_user=vesta_pma_support
          installer=vesta-installer
          port=18081
          image=phpmyadmin:5.2.3-apache
          backup=/srv/backups/vesta-before-installer-20261107T072902Z
          url="http://127.0.0.1:$port"
          exec 9>/run/lock/vesta-phpmyadmin-provision.lock
          flock -n 9
          work=$(mktemp -d /run/vesta-phpmyadmin-provision.XXXXXXXX)
          container_created=false
          user_created=false
          completed=false
          
          sql() {
            docker exec -i "$db_container" sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb --protocol=socket -uroot --batch --skip-column-names'
          }
          cleanup() {
            status=$?
            trap - EXIT
            if ! "$completed"; then
              if "$user_created"; then
                printf "DROP USER IF EXISTS '%s'@'%s';\n" "$db_user" "$client_ip" | sql >/dev/null || echo 'ROLLBACK_DATABASE_ACCOUNT_FAILED'
              fi
              if "$container_created"; then
                docker rm -f "$container" >/dev/null || echo 'ROLLBACK_CONTAINER_FAILED'
              fi
            fi
            rm -rf -- "$work"
            exit "$status"
          }
          trap cleanup EXIT
          
          die() {
            echo "ERROR: $*" >&2
            exit 1
          }
          check_store() {
            curl --noproxy '*' -ksS --connect-timeout 4 --max-time 15 --resolve vesta-cosmetics.ir:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://vesta-cosmetics.ir/
          }
          test -s "$backup/SHA256SUMS" && test -s "$backup/vesta-mariadb.sql.gz" && test -s "$backup/vesta-wordpress.tar.gz" || die 'Verified Vesta backup files missing'
          test "$(docker inspect -f '{{.State.Health.Status}}' "$db_container")" = healthy || die 'Vesta database is not healthy'
          test "$(check_store)" = 200 || die 'Vesta storefront preflight failed'
          docker network inspect "$network" >/dev/null
          test -z "$(docker ps -aq --filter "name=^/$container$")" || die 'phpMyAdmin container name already in use'
          test -z "$(ss -Hltn "sport = :$port")" || die 'Loopback port already in use'
          test "$(id -nG "$installer")" = "$installer" && test -s "/home/$installer/.ssh/authorized_keys" || die 'Installer SSH identity missing'
          read -r client_address _ server_address server_port <<< "$SSH_CONNECTION"
          sshd -T -C "user=$installer,host=$client_address,addr=$client_address,laddr=$server_address,lport=$server_port" > "$work/sshd.conf"
          grep -Eq '^allowtcpforwarding (yes|local)$' "$work/sshd.conf" && grep -Fxq 'disableforwarding no' "$work/sshd.conf" || die 'Installer SSH local forwarding not permitted'
          grep -Fxq 'permitopen any' "$work/sshd.conf" || grep -Eq "^permitopen .*127[.]0[.]0[.]1:$port( |$)" "$work/sshd.conf" || die 'Installer SSH target not permitted'
          
          docker_version=$(docker version --format '{{.Server.Version}}')
          docker_major=$(cut -d. -f1 <<< "$docker_version")
          test "$docker_major" -ge 28 || die "Docker $docker_version is too old for this loopback binding"
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          test "$(df -Pk "$docker_root" | awk 'END {print $4}')" -ge 1048576 || die 'Insufficient Docker disk space'
          test "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" -ge 786432 || die 'Insufficient available RAM'
          test "$(printf "SELECT COUNT(*) FROM mysql.user WHERE User='%s';\n" "$db_user" | sql)" = 0 || die 'Support database username already exists'
          test "$(printf "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='%s';\n" "$db_name" | sql)" = 1 || die 'Vesta database name could not be verified'
          echo "VESTA_PMA_PREFLIGHT_OK docker=$docker_version"
          
          printf '%s' '' | base64 -d > "$work/delivery.der"
          openssl rand -hex 24 | tr -d '\n' > "$work/password"
          test "$(wc -c < "$work/password")" = 48
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey "$work/delivery.der" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/password" -out "$work/delivery.enc"
          password_hash=$(openssl dgst -sha1 -binary < "$work/password" | openssl dgst -sha1 -binary | od -An -v -tx1 | tr -d ' \n' | tr '[:lower:]' '[:upper:]')
          [[ "$password_hash" =~ ^[A-F0-9]{40}$ ]] || die 'Password hash generation failed'
          
          timeout 240 docker pull "$image"
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          docker run --pull never --detach --name "$container" --network "$network" \
            --restart unless-stopped --memory 256m --memory-swap 320m --cpus 0.5 --pids-limit 128 \
            --security-opt no-new-privileges:true --log-opt max-size=5m --log-opt max-file=2 \
            --publish "127.0.0.1:$port:80" --env "PMA_HOST=$db_container" --env PMA_PORT=3306 --env 'PMA_VERBOSE=Vesta' "$image_id" >/dev/null
          container_created=true
          test "$(docker port "$container" 80/tcp)" = "127.0.0.1:$port" || die 'Unexpected phpMyAdmin port binding'
          client_ip=$(docker inspect -f "{{(index .NetworkSettings.Networks \"$network\").IPAddress}}" "$container")
          [[ "$client_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || die 'Could not identify the phpMyAdmin container IP'
          
          for attempt in {1..25}; do
            if curl --noproxy '*' -fsS --max-time 4 -c "$work/cookies" "$url/index.php?route=/" -o "$work/login" 2>/dev/null && grep -Fq 'name="pma_username"' "$work/login"; then
              break
            fi
            sleep 2
          done
          test -s "$work/login" && grep -Fq 'name="pma_username"' "$work/login" || die 'phpMyAdmin login form unavailable'
          echo 'VESTA_PMA_LOGIN_FORM_OK'
          
          printf "CREATE USER '%s'@'%s' IDENTIFIED BY PASSWORD '*%s';\n" "$db_user" "$client_ip" "$password_hash" | sql >/dev/null 2>"$work/create.error" || die 'Database account creation failed'
          user_created=true
          printf "GRANT SELECT, SHOW VIEW ON %s.* TO '%s'@'%s';\n" "$db_name" "$db_user" "$client_ip" | sql >/dev/null || die 'Vesta read-only grant failed'
          grantee_sql="CONCAT(QUOTE('$db_user'),'@',QUOTE('$client_ip'))"
          schema_grants=$(printf "SELECT GROUP_CONCAT(CONCAT(TABLE_SCHEMA,':',PRIVILEGE_TYPE) ORDER BY TABLE_SCHEMA,PRIVILEGE_TYPE) FROM information_schema.SCHEMA_PRIVILEGES WHERE GRANTEE=%s AND IS_GRANTABLE='NO';\n" "$grantee_sql" | sql)
          test "$schema_grants" = "$db_name:SELECT,$db_name:SHOW VIEW" || die 'Unexpected database privileges'
          global_grants=$(printf "SELECT COUNT(*) FROM information_schema.USER_PRIVILEGES WHERE GRANTEE=%s AND PRIVILEGE_TYPE<>'USAGE';\n" "$grantee_sql" | sql)
          test "$global_grants" = 0 || die 'Unexpected global privileges'
          echo 'VESTA_PMA_READ_ONLY_GRANTS_VERIFIED'
          
          token=$(python3 - "$work/login" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          
          class LoginToken(HTMLParser):
              token = ""
          
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "input" and attrs.get("name") == "token":
                      self.token = attrs.get("value", "")
          
          parser = LoginToken()
          parser.feed(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(parser.token)
          PY
          )
          curl --noproxy '*' -fsSL --max-time 30 -b "$work/cookies" -c "$work/cookies" \
            --data-urlencode "pma_username=$db_user" --data-urlencode "pma_password@$work/password" \
            --data-urlencode "token=$token" --data-urlencode 'server=1' --data-urlencode 'lang=en' \
            "$url/index.php?route=/" -o "$work/session" || die 'phpMyAdmin login request failed'
          grep -Eq '[[:space:]]pmaAuth-1[[:space:]]' "$work/cookies" && grep -Eq 'id="(pma_navigation|serverinfo)"' "$work/session" && grep -Fq "$db_name" "$work/session" || die 'phpMyAdmin login or database visibility was not confirmed'
          test "$(check_store)" = 200 || die 'Vesta storefront post-check failed'
          completed=true
          echo 'VESTA_PMA_HTTP_LOGIN_VERIFIED'
          echo 'VESTA_STOREFRONT_HTTP_200'
          printf 'VESTA_PMA_ENCRYPTED_PASSWORD='
          base64 -w0 "$work/delivery.enc"
          printf '\nVESTA_PMA_PROVISION_COMPLETE\n'
          VESTA_PMA_REMOTE
          if timeout 6 bash -c 'exec 3<>/dev/tcp/$1/18081' _ "$HOST" 2>/dev/null; then
            echo 'ERROR: external TCP access to phpMyAdmin was possible'
            exit 1
          fi
          echo 'VESTA_PMA_EXTERNAL_PORT_UNREACHABLE'
          timeout 65 sshpass -e ssh "${ssh_options[@]}" -NT -o ExitOnForwardFailure=yes -L 127.0.0.1:18081:127.0.0.1:18081 "root@$HOST" > "$work/tunnel.log" 2>&1 &
          tunnel_pid=$!
          for attempt in {1..15}; do
            if curl --noproxy '*' -fsS --max-time 4 'http://127.0.0.1:18081/index.php?route=/' -o "$work/login" 2>/dev/null && grep -Fq 'name="pma_username"' "$work/login"; then
              echo 'VESTA_PMA_SSH_TUNNEL_VERIFIED'
              exit 0
            fi
            sleep 2
          done
          echo 'ERROR: tunnel smoke test failed'
          exit 1
