name: Safely provision verified Vesta Woo customer in Mahak (single-person canary)
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-person-provision-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
      - name: Syntax check
        run: php -l scripts/provision-vesta-mahak-person-20261116.php
      - name: Dry-run strict cloud/mobile/identity prerequisites without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i -e VC_PERSON_ORDER_ID=105456 vc-vesta php -d memory_limit=1024M -d display_errors=0' < scripts/provision-vesta-mahak-person-20261116.php
      - name: Back up and provision five remaining unique new customer persons, fail closed per order
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'SHELL'
          set -Eeuo pipefail
          backup=/srv/backups/vesta-person-registration-batch-$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p -m 0700 "$backup"
          docker exec vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb-dump -uroot --single-transaction --quick "$MARIADB_DATABASE" wp_users wp_usermeta wp_bazara_persons' | gzip -1 > "$backup/person-data-before.sql.gz"
          gzip -t "$backup/person-data-before.sql.gz"
          sha256sum "$backup/person-data-before.sql.gz" > "$backup/sha256.txt"
          echo "PERSON_PROVISION_BATCH_BACKUP_VERIFIED=yes LOCATION=$backup"
          SHELL
          for id in 105456 105454 105452 105450 105361;do
            echo "BEGIN_PERSON_IDENTITY_REPAIR=$id"
            sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" "docker exec -i -e VC_PERSON_ORDER_ID=$id -e VC_PERSON_COMMIT=yes -e VC_PERSON_BACKUP_VERIFIED=yes vc-vesta php -d memory_limit=1024M -d display_errors=0" < scripts/provision-vesta-mahak-person-20261116.php | tee "person-$id.log"
            grep -Fq "PERSON_CREATED_AND_READBACK_VERIFIED ORDER=$id" "person-$id.log"
          done
          echo 'FIVE_ADDITIONAL_PERSONS_CLOUD_VERIFIED=yes'
