name: Repair Vesta cron canonical host safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-vesta-cron-http-context.yml"
      - "scripts/repair-vesta-cron-http-context.sh"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vc-vesta-cron-origin-context
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded cron repair
        run: |
          set -euo pipefail
          bash -n scripts/repair-vesta-cron-http-context.sh
          grep -Fq 'http_cron_smoke=' scripts/repair-vesta-cron-http-context.sh
          grep -Fq 'RESTORED_OLD_CRON' scripts/repair-vesta-cron-http-context.sh
      - name: Install remote connection tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Apply canonical-host cron repair with rollback
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/repair-vesta-cron-http-context.sh "root@$HOST:/tmp/repair-vesta-cron-http-context.sh"
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/repair-vesta-cron-http-context.sh'
      - name: Verify production services after repair
        run: |
          set -euo pipefail
          for hostname in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir; do
            code=$(curl -LfsS --connect-timeout 10 --max-time 35 -o /dev/null -w '%{http_code}' "https://$hostname/")
            echo "$hostname HTTP=$code"
            test "$code" = 200
          done
