name: Repair Vesta migrated product images
on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-vesta-imported-media-permissions.sh"
      - ".github/workflows/fix-vesta-imported-media-permissions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/fix-vesta-imported-media-permissions.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Fix imported image access and verify public originals
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/fix-vesta-imported-media-permissions.sh "root@$HOST:/tmp/fix-vesta-imported-media-permissions.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/fix-vesta-imported-media-permissions.sh'
