name: Diagnose and controlled-repair Vesta card-to-card Woo customer ownership
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-card-owner-repair-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
      - name: Validate source without production changes
        run: php -l scripts/repair-vesta-card-owner-20261116.php
      - name: Read-only plan, sender must be paused
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d memory_limit=768M -d display_errors=0' < scripts/repair-vesta-card-owner-20261116.php
