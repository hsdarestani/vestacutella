name: Vesta new accounting epoch - pause old sync and capture Woo stock truth
on:
  push:
    branches: [main]
    paths:
      - scripts/vesta-new-accounting-epoch-20261119.php
      - .github/workflows/vesta-new-accounting-epoch-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-accounting-outbox-production
  cancel-in-progress: false
jobs:
  start-new-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-time epoch tool
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass
          php -l scripts/vesta-new-accounting-epoch-20261119.php
      - name: Mark new epoch, pause legacy ERP sync and export opening stock to private host
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          stage="/tmp/vesta-accounting-epoch-${GITHUB_SHA}.php"
          opts="-o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e scp $opts scripts/vesta-new-accounting-epoch-20261119.php "root@$HOST:$stage"
          sshpass -e ssh $opts "root@$HOST" "STAGE='$stage' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          source=/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php
          grep -Fq 'VCAR_DURABLE_start_sync_orders' "$source"
          grep -Fq 'VCAR_DURABLE_bazara_save_order' "$source"
          test -s /srv/vestacutella/runtime/vesta/wp-content/mu-plugins/vesta-accounting-reliability.php
          docker exec -i vc-vesta php -l < "$STAGE"
          private=/root/vesta-accounting-new-epoch
          mkdir -p -m 0700 "$private"
          test ! -e "$private/opening-woo-catalog.csv"
          docker exec -i -u www-data vc-vesta php -d display_errors=0 -d memory_limit=1024M < "$STAGE" > "$private/opening-woo-catalog.csv.partial"
          test "$(wc -l < "$private/opening-woo-catalog.csv.partial")" -gt 1000
          mv "$private/opening-woo-catalog.csv.partial" "$private/opening-woo-catalog.csv"
          chmod 0600 "$private/opening-woo-catalog.csv"
          echo "NEW_EPOCH_PRIVATE_STOCK_FILE=$private/opening-woo-catalog.csv"
          echo "STOCK_EXPORT_ROWS=$(($(wc -l < "$private/opening-woo-catalog.csv")-1))"
          docker exec -i vc-vesta php -d display_errors=0 <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $epoch=get_option('vcar_new_accounting_epoch',[]);
          $s=get_option('bazara_visitor_settings',[]);
          if(empty($epoch['epoch_utc']) || get_option('vcar_sender_enabled',true) ||
             !get_option('vesta_mhi_auto_disabled',false) ||
             !empty($s['chkProduct']) || !empty($s['chkQuantity']) || !empty($s['chkPrice']) ||
             !empty($s['chkRegularPrice']) || !empty($s['chkPicture']))
            throw new RuntimeException('new_epoch_cutover_gate_failed');
          echo "NEW_ACCOUNTING_EPOCH_CONFIRMED=".wp_json_encode($epoch,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo "OLD_SENDER_STOPPED=yes".PHP_EOL;
          echo "OLD_ERP_STOCK_IMPORT_STOPPED=yes".PHP_EOL;
          echo "NEW_ERP_TARGET_NOT_YET_CONFIGURED=yes".PHP_EOL;
          PHP
          for host in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir;do
            code=$(curl --noproxy '*' -ksS --connect-timeout 8 --max-time 25 --resolve "$host:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$host/")
            echo "SITE=$host HTTP=$code";test "$code" = 200
          done
          REMOTE
