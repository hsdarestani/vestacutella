name: Diagnose Vesta VPN 523 origin routes
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-vesta-vpn-523-20261024.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SSH read-only route and firewall audit
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 50 sshpass -e scp -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/diag-vesta-vpn-523-20261024.sh "root@$HOST:/tmp/diag-vesta-vpn-523.sh"
          timeout 85 sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/diag-vesta-vpn-523.sh'
