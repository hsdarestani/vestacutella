name: Compute Vesta Bazaar unique variation matches (read-only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-vesta-bazara-unique-variation-match-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/audit-vesta-bazara-unique-variation-match-20261110.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Validate unique exact color/model matches without writes
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' < scripts/audit-vesta-bazara-unique-variation-match-20261110.sh
