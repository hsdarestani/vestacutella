name: External HTTP uptime check for Vesta services
# Manual independent-network incident recheck on 2026-10-26
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/external-http-uptime-check-20261024.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vesta-external-watch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check three storefronts from an independent network
        shell: bash
        run: |
          failed=0
          for domain in vesta-cosmetics.ir cutellashop.ir app.vesta-cosmetics.ir; do
            echo "=== EXTERNAL $domain ==="
            healthy=0
            for attempt in 1 2; do
              code=$(curl -4 -sS --connect-timeout 7 --max-time 18 -o /dev/null -w '%{http_code}' "https://$domain/" 2>/dev/null) || code=000
              echo "ATTEMPT=$attempt DOMAIN=$domain EDGE_HTTP=$code"
              case "$code" in
                200|301|302) healthy=1; break ;;
              esac
              sleep 8
            done
            if [ "$healthy" = 0 ]; then
              origin_code=$(curl -4 -k -sS --connect-timeout 6 --max-time 16 --resolve "$domain:443:193.177.242.64" -o /dev/null -w '%{http_code}' "https://$domain/" 2>/dev/null) || origin_code=000
              echo "::error::DOMAIN=$domain EDGE_HTTP=$code DIRECT_ORIGIN_HTTP=$origin_code"
              case "$origin_code" in
                200|301|302) echo "CAUSE_HINT=edge or routing; reboot of VPS would be inappropriate" ;;
                *) echo "CAUSE_HINT=origin unavailable; inspect VPS incident journal" ;;
              esac
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "EXTERNAL_ALL_HEALTHY"
