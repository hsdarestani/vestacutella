name: Inspect exact Bazaar remote GET and ERP order status fields
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-vesta-bazara-remote-get-20261111.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only inspect API input and ERP visibility fields
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php')
          a=p.read_text(encoding='utf8',errors='replace').splitlines()
          for start,end in ((55,155),(240,310),(370,415)):
            print('===== CODE',start,end,'=====')
            for i in range(start,end+1):
              s=a[i-1].strip()
              if re.search(r'pass|secret|token|key|auth|base64|curl',s,re.I):
                if re.search(r'\$(token|pass|secret|key|auth)',s,re.I):continue
              s=re.sub(r'https?://\S+','[REMOTE_ENDPOINT]',s)
              print('CODE',i,s[:180])
          PY
          echo '===== LIVE ERP SCOPE AND ORDERS ONLY (NON-SENSITIVE KEYS) ====='
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=256M <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $o=get_option('bazara_visitor_settings',[]);
          foreach(['radioCustomer','chkGuestCustomer','chkShippingOrder','chkBankOrder','chkSyncOrders','chkOrders','chkOrdersFromSite','OrderType','order_id_greater_than'] as $k){
            if(!is_array($o)||!array_key_exists($k,$o))continue;
            if(!is_scalar($o[$k]))continue;
            echo 'OPTION_'.$k.'='.preg_replace('/[^0-9a-zA-Z_-]/','',(string)$o[$k])."\n";
          }
          PHP
          echo REMOTE_GET_INSPECTION_FINISHED=yes
          REMOTE
