name: Enable Vesta phpMyAdmin data edits after database backup
on:
  push:
    branches: [main]
    paths: [".github/workflows/enable-vesta-pma-data-writes-20261109.yml"]
permissions:
  contents: read
concurrency:
  group: vesta-phpmyadmin-provision
  cancel-in-progress: false
jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Back up Vesta and verify database edit privileges
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          known_hosts=$(mktemp)
          trap 'rm -f -- "$known_hosts"' EXIT
          printf '%s %s\n' "$HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMepyPq2JoyC+n31wd8tBhN707fXYGqkIc0VOaAAbcIC' > "$known_hosts"
          timeout 570 sshpass -e ssh -F /dev/null -T -o ConnectTimeout=18 -o ServerAliveInterval=15 -o ServerAliveCountMax=5 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o "UserKnownHostsFile=$known_hosts" -o GlobalKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'VESTA_REMOTE'
          set -Eeuo pipefail
          umask 077
          export LC_ALL=C
          db=vestacos_m
          db_container=vc-db-vesta
          pma=vc-vesta-phpmyadmin
          db_user=vesta_pma_support
          expected_before=vestacos_m:SELECT,vestacos_m:SHOW_VIEW
          expected_after=vestacos_m:DELETE,vestacos_m:INSERT,vestacos_m:SELECT,vestacos_m:SHOW_VIEW,vestacos_m:UPDATE
          changed=false
          completed=false
          exec 9>/run/lock/vesta-phpmyadmin-provision.lock
          flock -n 9
          
          sql() {
            docker exec -i "$db_container" sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb --protocol=socket -uroot --batch --skip-column-names'
          }
          rollback() {
            status=$?
            trap - EXIT
            if "$changed" && ! "$completed"; then
              if printf "REVOKE INSERT, UPDATE, DELETE ON %s.* FROM '%s'@'%s';\n" "$db" "$db_user" "$client_ip" | sql >/dev/null; then
                echo 'VESTA_PMA_PREVIOUS_GRANTS_RESTORED'
              else
                echo 'ERROR: VESTA_PMA_GRANT_ROLLBACK_FAILED' >&2
              fi
            fi
            exit "$status"
          }
          trap rollback EXIT
          
          die() {
            echo "ERROR: $*" >&2
            exit 1
          }
          check_http() {
            curl --noproxy '*' -fsS --max-time 12 -o /dev/null 'http://127.0.0.1:18081/index.php?route=/' &&
            curl --noproxy '*' -fksS --max-time 15 --resolve vesta-cosmetics.ir:443:127.0.0.1 -o /dev/null https://vesta-cosmetics.ir/
          }
          client_ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "vestacutella-backend").IPAddress}}' "$pma")
          [[ "$client_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || die 'phpMyAdmin container IP unavailable'
          test "$(docker inspect -f '{{.State.Health.Status}}' "$db_container")" = healthy || die 'Vesta database is not healthy'
          test "$(docker port "$pma" 80/tcp)" = '127.0.0.1:18081' || die 'phpMyAdmin binding changed'
          test "$(printf "SELECT COUNT(*) FROM mysql.user WHERE User='%s' AND Host='%s';\n" "$db_user" "$client_ip" | sql)" = 1 || die 'Existing Vesta support account not found'
          test "$(printf "SELECT COUNT(*) FROM mysql.user WHERE User='%s';\n" "$db_user" | sql)" = 1 || die 'Unexpected duplicate Vesta support account'
          grantee="CONCAT(QUOTE('$db_user'),'@',QUOTE('$client_ip'))"
          schema_grants() {
            printf "SELECT GROUP_CONCAT(CONCAT(TABLE_SCHEMA,':',REPLACE(PRIVILEGE_TYPE,' ','_')) ORDER BY TABLE_SCHEMA,PRIVILEGE_TYPE) FROM information_schema.SCHEMA_PRIVILEGES WHERE GRANTEE=%s;\n" "$grantee" | sql
          }
          check_scope() {
            test "$(printf "SELECT COUNT(*) FROM information_schema.USER_PRIVILEGES WHERE GRANTEE=%s AND PRIVILEGE_TYPE<>'USAGE';\n" "$grantee" | sql)" = 0 &&
            test "$(printf "SELECT COUNT(*) FROM information_schema.SCHEMA_PRIVILEGES WHERE GRANTEE=%s AND IS_GRANTABLE='YES';\n" "$grantee" | sql)" = 0
          }
          check_scope || die 'Unexpected global or delegable privileges'
          check_http || die 'Vesta or phpMyAdmin preflight HTTP check failed'
          before=$(schema_grants)
          if test "$before" = "$expected_after"; then
            completed=true
            echo 'VESTA_PMA_DATA_WRITES_ALREADY_VERIFIED'
            exit 0
          fi
          test "$before" = "$expected_before" || die 'Unexpected initial privileges'
          
          root=/srv/backups
          test "$(df -Pk "$root" | awk 'END {print $4}')" -ge 2097152 || die 'Insufficient backup disk space'
          backup=$(mktemp -d "$root/vesta-before-pma-write-$(date -u +%Y%m%dT%H%M%SZ).XXXXXXXX")
          printf '%s\n' "$before" > "$backup/previous-phpmyadmin-privileges.txt"
          timeout 450 docker exec "$db_container" sh -c 'test "$MARIADB_DATABASE" = vestacos_m && MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb-dump -uroot --databases "$MARIADB_DATABASE" --single-transaction --quick --hex-blob --routines --events --triggers' | gzip -1 > "$backup/vesta-mariadb.sql.gz.partial"
          gzip -t "$backup/vesta-mariadb.sql.gz.partial"
          test "$(stat -c '%s' "$backup/vesta-mariadb.sql.gz.partial")" -gt 25000 || die 'Database backup unexpectedly small'
          mv -- "$backup/vesta-mariadb.sql.gz.partial" "$backup/vesta-mariadb.sql.gz"
          (cd "$backup" && sha256sum vesta-mariadb.sql.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "VESTA_DB_BACKUP_VERIFIED=$backup"
          
          printf "GRANT INSERT, UPDATE, DELETE ON %s.* TO '%s'@'%s';\n" "$db" "$db_user" "$client_ip" | sql >/dev/null
          changed=true
          test "$(schema_grants)" = "$expected_after" || die 'Final permissions do not match the expected Vesta privileges'
          check_scope || die 'Unexpected global or delegable privileges after change'
          check_http || die 'Vesta or phpMyAdmin post-change HTTP check failed'
          completed=true
          echo 'VESTA_PMA_DATA_WRITES_VERIFIED=SELECT,SHOW_VIEW,INSERT,UPDATE,DELETE'
          echo 'VESTA_AND_PHPMYADMIN_HTTP_VERIFIED'
          VESTA_REMOTE
