name: Inspect exact Mahak variant template data and stock document route schema
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-mahak-bot-variation-model-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect existing active variant parent and detail write model; no mutations
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1000M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(240);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $cat=vmb_catalog(vmb_api());
          $ids=[10755492,10684982];
          foreach($ids as $id){
            foreach(($cat['Products']??[]) as $p)if((int)($p['ProductId']??0)===$id){
              echo 'VARIANT_TEMPLATE_PARENT='.wp_json_encode([
                'ProductId'=>$p['ProductId']??null,'ProductClientId'=>$p['ProductClientId']??null,
                'ProductCode'=>$p['ProductCode']??null,'Name'=>$p['Name']??null,
                'Type'=>$p['Type']??null,'Category'=>$p['ProductCategoryId']??null,
                'UnitCode'=>$p['UnitCode']??null,'UnitName'=>$p['UnitName']??null,
                'UnitName2'=>$p['UnitName2']??null,'UnitRatio'=>$p['UnitRatio']??null
              ],JSON_UNESCAPED_UNICODE).PHP_EOL;
            }
            foreach(($cat['ProductDetails']??[]) as $d){
              if((int)($d['ProductId']??0)!==$id||!empty($d['Deleted']))continue;
              echo 'VARIANT_TEMPLATE_DETAIL='.wp_json_encode([
                'ProductDetailId'=>$d['ProductDetailId']??null,
                'ProductDetailCode'=>$d['ProductDetailCode']??null,
                'ProductDetailClientId'=>$d['ProductDetailClientId']??null,
                'ProductId'=>$d['ProductId']??null,'ProductClientId'=>$d['ProductClientId']??null,
                'Properties'=>$d['Properties']??null,'Properties2'=>$d['Properties2']??null,
                'Barcode'=>$d['Barcode']??null,'Price1'=>$d['Price1']??null,
                'DefaultSellPriceLevel'=>$d['DefaultSellPriceLevel']??null,
                'Count1'=>$d['Count1']??null,'Count2'=>$d['Count2']??null,
                'Deleted'=>$d['Deleted']??null
              ],JSON_UNESCAPED_UNICODE).PHP_EOL;
            }
          }
          echo 'VARIANT_MODEL_READ_ONLY=yes'.PHP_EOL;
          PHP
