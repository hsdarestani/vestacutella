name: Audit Vesta toolbar and mail delivery
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-vesta-toolbar-cache-and-mail-delivery-20261019.sh
      - .github/workflows/audit-vesta-toolbar-cache-and-mail-delivery-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/audit-vesta-toolbar-cache-and-mail-delivery-20261019.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect WordPress toolbar and sender DNS, without edits
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/audit-vesta-toolbar-cache-and-mail-delivery-20261019.sh "root@$HOST:/tmp/audit-vesta-toolbar-cache-and-mail-delivery-20261019.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/audit-vesta-toolbar-cache-and-mail-delivery-20261019.sh'
