name: Vesta safely inspect existing Bazara person update capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-person-api-capability-audit-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Reflect Mahak and Bazara person methods and order 105554 mismatch read-only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          if(!class_exists('BazaraApi')){echo 'BAZARA_CLASS_ABSENT=yes'.PHP_EOL;exit(23);}
          $rc=new ReflectionClass('BazaraApi');
          echo 'BAZARA_API_CLASS_FILE='.basename($rc->getFileName()).PHP_EOL;
          $ms=[];foreach($rc->getMethods() as $method){
            if(!preg_match('/person|customer|user|save|update|insert|register|send|sync|data|login/i',$method->getName()))continue;
            $ms[]=['name'=>$method->getName(),'parameters'=>$method->getNumberOfParameters(),'defined_in'=>$method->getDeclaringClass()->getName()];
          }
          echo 'BAZARA_API_RELEVANT_METHODS='.json_encode($ms,JSON_UNESCAPED_UNICODE).PHP_EOL;
          global $wpdb;
          $a=$wpdb->get_row($wpdb->prepare("SELECT PersonId,PersonClientID,FirstName,LastName,Mobile FROM {$wpdb->prefix}bazara_persons WHERE PersonId=%d AND Deleted=0",12706969),ARRAY_A);
          if(!$a){echo 'LOCAL_PERSON_CACHE_MISSING=yes'.PHP_EOL;exit(0);}
          $o=wc_get_order(105554);$ph=vesta_otp_phone((string)$o->get_billing_phone());
          $pName=vcar_identity_normalize_name($a['FirstName'].' '.$a['LastName']);
          $oName=vcar_identity_normalize_name($o->get_billing_first_name().' '.$o->get_billing_last_name());
          echo 'PERSON_105554_LOCAL_EVIDENCE='.json_encode([
             'person_id'=>(int)$a['PersonId'],'erp_client_uid'=>(int)$a['PersonClientID'],
             'same_phone'=>($ph && vesta_otp_phone((string)$a['Mobile'])===$ph),
             'name_matches_checkout'=>$pName===$oName,
             'cloud_invoice_exists_for_order_105554'=>(int)$o->get_meta('mahak_id')>0,
             'customer_otp_user'=>(int)$o->get_customer_id(),
             'existing_bazara_person_count_with_same_phone'=>(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->prefix}bazara_persons WHERE Deleted=0 AND (Mobile=%s OR Mobile=%s)",(string)$a['Mobile'],(string)$a['Mobile'])),
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'PERSON_API_AUDIT_NO_WRITES=yes'.PHP_EOL;
          PHP
