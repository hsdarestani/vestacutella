name: Inspect Vesta image backup progress
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-vesta-image-backup-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read backup progress without modifying the site
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e ssh -o ConnectTimeout=18 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'd=$(find /srv/backups -maxdepth 1 -type d -name "vesta-before-mahak-images-*" | sort | tail -1); test -n "$d"; echo "BACKUP=$d"; date -u; du -sh /srv/vestacutella/runtime/vesta; du -h "$d"/*; df -h /srv/backups; if test -f "$d/VERIFIED_UTC"; then cat "$d/VERIFIED_UTC"; cat "$d/tar-warnings.txt"; else echo BACKUP_IN_PROGRESS; fi'
