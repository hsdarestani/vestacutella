name: Verify automatic Bazaar order delivery after repair (read-only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vesta-bazara-automatic-delivery-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check server cron, Bazaar schedule, new order acknowledgments and mapping gaps
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "AUDIT_TIME_UTC=$(date -u +%FT%TZ)"
          echo "CRON_DAEMON=$(systemctl is-active cron)"
          echo "WP_CRON_HOST_LINES=$(grep -c 'vesta-wp-cron.lock' /etc/cron.d/vestacutella-wp-cron || true)"
          echo "PATCH_PRESENT=$(grep -c 'VC_RECENT_BAZARA_CATCHUP_20261110' /srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php || true)"
          echo "BOUNDED_ONE_ORDER=$(grep -c 'array_slice($orders, 0, 1)' /srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php || true)"
          echo '===== CORE SYNC CONFIG ====='
          docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=256M <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $options=get_option('bazara_visitor_settings',[]);
          foreach(['order_id_greater_than','left_behind_sync_limit'] as $key){
           echo "BAZARA_".$key."=".((int)($options[$key]??0))."\n";
          }
          echo "HISTORICAL_DEFERRED=".(get_option('vc_bazara_defer_historical_backfill',true)?'yes':'no')."\n";
          echo "BAZARA_HOOK_REGISTERED=".(has_action('bazara_run_sending_orders')?'yes':'no')."\n";
          echo "WP_NEXT_SCHEDULED=".((int)wp_next_scheduled('bazara_run_sending_orders'))."\n";
          if(function_exists('as_next_scheduled_action')){
           $next=as_next_scheduled_action('bazara_run_sending_orders');
           echo "AS_NEXT_SCHEDULED=".((int)$next)."\n";
          }else echo "AS_NEXT_SCHEDULED=not_registered\n";
          PHP
          db() { docker exec -i vc-db-vesta sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb -uroot -D "$MARIADB_DATABASE" --batch --raw --default-character-set=utf8mb4'; }
          echo '===== RECENT BAZARA ACTION HISTORY ====='
          cat <<'SQL' | db
          SELECT action_id,hook,status,scheduled_date_gmt,last_attempt_gmt
          FROM wp_actionscheduler_actions WHERE hook='bazara_run_sending_orders'
          ORDER BY action_id DESC LIMIT 12;
          SQL
          echo '===== NEW WOO ORDERS AFTER PREVIOUS REPAIR ====='
          cat <<'SQL' | db
          SELECT p.ID,p.post_date_gmt,p.post_status,
            COALESCE(MAX(CASE WHEN pm.meta_key='mahak_id' THEN CAST(pm.meta_value AS SIGNED) END),0) AS ack,
            (SELECT COUNT(*) FROM wp_bazara_orders b WHERE b.OrderClientId=p.ID) AS local_receipts
          FROM wp_posts p LEFT JOIN wp_postmeta pm ON pm.post_id=p.ID AND pm.meta_key='mahak_id'
          WHERE p.post_type='shop_order' AND p.ID>=105207
          GROUP BY p.ID,p.post_date_gmt,p.post_status
          ORDER BY p.ID DESC LIMIT 30;
          SQL
          echo '===== ELIGIBLE UNSENT ORDERS AND AGE ====='
          cat <<'SQL' | db
          SELECT COUNT(DISTINCT p.ID) AS pending_count,
            MIN(p.ID) AS oldest_unsent_id,
            MIN(p.post_date_gmt) AS oldest_created_utc,
            MAX(p.post_date_gmt) AS latest_created_utc
          FROM wp_posts p
          WHERE p.post_type='shop_order'
          AND p.post_date_gmt >= '2026-11-08 00:00:00'
          AND p.post_status IN ('wc-completed','wc-processing','wc-processing5','wc-pws-packaged','wc-pws-shipping','wc-arrival-shipment')
          AND NOT EXISTS(SELECT 1 FROM wp_postmeta pm WHERE pm.post_id=p.ID AND pm.meta_key='mahak_id' AND CAST(pm.meta_value AS SIGNED)>0)
          AND NOT EXISTS(SELECT 1 FROM wp_bazara_orders b WHERE b.OrderClientId=p.ID);
          SQL
          echo '===== UNMAPPED PRODUCTS IN ELIGIBLE UNSENT ORDER ITEMS ====='
          cat <<'SQL' | db
          SELECT oi.order_id,COUNT(DISTINCT oi.order_item_id) line_items,
          SUM(CASE WHEN p.ID IS NOT NULL AND NOT EXISTS(SELECT 1 FROM wp_postmeta pm WHERE pm.post_id=p.ID AND pm.meta_key='mahak_product_detail_id' AND pm.meta_value<>'' ) THEN 1 ELSE 0 END) AS unmapped_items
          FROM wp_woocommerce_order_items oi
          JOIN wp_woocommerce_order_itemmeta im ON im.order_item_id=oi.order_item_id AND im.meta_key='_variation_id'
          LEFT JOIN wp_posts p ON p.ID=CAST(im.meta_value AS UNSIGNED) AND p.post_type='product_variation'
          WHERE oi.order_item_type='line_item' AND oi.order_id IN (
            SELECT op.ID FROM wp_posts op WHERE op.post_type='shop_order'
            AND op.post_date_gmt>='2026-11-08 00:00:00'
            AND op.post_status IN ('wc-completed','wc-processing','wc-processing5','wc-pws-packaged','wc-pws-shipping','wc-arrival-shipment')
            AND NOT EXISTS(SELECT 1 FROM wp_postmeta pm WHERE pm.post_id=op.ID AND pm.meta_key='mahak_id' AND CAST(pm.meta_value AS SIGNED)>0))
          GROUP BY oi.order_id ORDER BY oi.order_id DESC LIMIT 20;
          SQL
          echo VERIFY_AUTO_DELIVERY_READ_ONLY_COMPLETE=yes
          REMOTE
