name: Vesta find exact Mehrona Woo product in Mahak catalog and detect ID collision
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-find-real-mehrona-erp-id-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Find suspect Woo and Mahak goods by names and identifiers read only
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1536M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);set_time_limit(0);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $p=wc_get_product(103201);
          if($p){
            $parent=$p->is_type('variation')?wc_get_product($p->get_parent_id()):null;
            echo 'WOO_TARGET='.json_encode(['id'=>$p->get_id(),'name'=>$p->get_name(),
              'sku'=>$p->get_sku(),'parent_id'=>$parent?$parent->get_id():0,
              'parent_name'=>$parent?$parent->get_name():'',
              'erp_id'=>(int)$p->get_meta('mahak_id',true),
              'erp_detail_id'=>(int)$p->get_meta('mahak_product_detail_id',true)],
              JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          $goods=vmb_catalog(vmb_api())['Products']??[];
          $results=[];foreach($goods as $g){
            if(!empty($g['Deleted']))continue;
            $name=(string)($g['Name']??'');$code=(string)($g['ProductCode']??'');
            if(mb_stripos($name,'مهرونا',0,'UTF-8')!==false ||
               mb_stripos($name,'Mehrona',0,'UTF-8')!==false ||
               mb_stripos($name,'blush',0,'UTF-8')!==false ||
               mb_stripos($name,'رژگونه',0,'UTF-8')!==false ||
               mb_stripos($name,'کتاب آرایشی',0,'UTF-8')!==false ||
               $code==='103201')$results[]=['product_id'=>(int)($g['ProductId']??0),'code'=>$code,'name'=>$name];
          }
          echo 'CLOUD_MATCHING_GOODS='.json_encode($results,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $local=$wpdb->get_results("SELECT ProductId,ProductCode,ProductName,Deleted FROM {$wpdb->prefix}bazara_products
            WHERE ProductName LIKE '%مهرونا%' OR ProductName LIKE '%رژگونه%' OR ProductCode='103201' LIMIT 30",ARRAY_A);
          echo 'LOCAL_CACHE_MATCHING_GOODS='.json_encode($local,JSON_UNESCAPED_UNICODE).PHP_EOL;
          $like='%کتاب آرایشی%';$site=$wpdb->get_results($wpdb->prepare(
            "SELECT ID,post_title,post_type,post_status FROM {$wpdb->posts}
            WHERE post_type IN ('product','product_variation') AND post_title LIKE %s LIMIT 12",$like),ARRAY_A);
          echo 'WOO_BOOK_NAME_MATCHES='.json_encode($site,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'READ_ONLY_IDENTITIES_NO_MUTATIONS=yes'.PHP_EOL;
          PHP
