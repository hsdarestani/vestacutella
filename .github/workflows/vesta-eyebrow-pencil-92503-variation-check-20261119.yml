name: Vesta verify eyebrow pencil 92503 Woo variation price and 36 stock
on:
  push:
    branches: [main]
    paths: [.github/workflows/vesta-eyebrow-pencil-92503-variation-check-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read Woo 103417 variants, stock and price, underlying Mahak detail IDs
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $p=wc_get_product(103417);
          if(!$p)exit(5);
          echo 'EYEBROW_PARENT='.wp_json_encode([
             'id'=>$p->get_id(),'type'=>$p->get_type(),'status'=>$p->get_status(),
             'title'=>$p->get_name(),'sku'=>$p->get_sku(),
             'price'=>$p->get_price(),'regular_price'=>$p->get_regular_price(),
             'stock_qty'=>$p->get_stock_quantity(),'manage_stock'=>$p->get_manage_stock(),
             'stock_status'=>$p->get_stock_status(),
             'child_ids'=>method_exists($p,'get_children')?$p->get_children():[],
             'mahak_id'=>(int)$p->get_meta('mahak_id',true),
             'mahak_detail_id'=>(int)$p->get_meta('mahak_product_detail_id',true)
          ],JSON_UNESCAPED_UNICODE).PHP_EOL;
          $rows=[];
          foreach((method_exists($p,'get_children')?$p->get_children():[]) as $id){
            $v=wc_get_product($id);if(!$v)continue;
            $rows[]=[
               'id'=>$id,'type'=>$v->get_type(),'status'=>$v->get_status(),
               'sku'=>$v->get_sku(),'attributes'=>$v->get_attributes(),
               'regular_price'=>$v->get_regular_price(),'price'=>$v->get_price(),
               'manage_stock'=>$v->get_manage_stock(),'stock_qty'=>$v->get_stock_quantity(),
               'stock_status'=>$v->get_stock_status(),'mahak_id'=>(int)$v->get_meta('mahak_id',true),
               'mahak_detail_id'=>(int)$v->get_meta('mahak_product_detail_id',true),
               'prop_id'=>(int)$v->get_meta('prop_id',true)
            ];
          }
          echo 'EYEBROW_WOO_CHILDREN='.wp_json_encode($rows,JSON_UNESCAPED_UNICODE).PHP_EOL;
          echo 'EYEBROW_READ_ONLY=yes'.PHP_EOL;
          PHP
