name: Safely switch slow Vesta Ubuntu archive mirror
on:
  push:
    branches: [main]
    paths: [".github/workflows/vesta-safe-apt-mirror-switch-20261024.yml"]
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/vesta-ubuntu-fast-mirror-switch-20261024.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Switch only at safe apt download stage
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -e
          test -n "$HOST" && test -n "$SSHPASS"
          timeout 60 sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/vesta-ubuntu-fast-mirror-switch-20261024.sh "root@$HOST:/tmp/vesta-ubuntu-fast-mirror-switch-20261024.sh"
          timeout 320 sshpass -e ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/vesta-ubuntu-fast-mirror-switch-20261024.sh'
