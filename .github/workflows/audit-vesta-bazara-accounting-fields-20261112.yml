name: Audit Vesta Bazaar shipping, receipts, discounts, gateways
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-vesta-bazara-accounting-fields-20261112.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect accounting payload and last paid orders without customer data
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 "root@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "AUDIT_UTC=$(date -u +%FT%TZ)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/srv/vestacutella/runtime/vesta/wp-content/plugins/bazara/classes/class.bazara.api.php')
          a=p.read_text(encoding='utf8',errors='replace').splitlines()
          def redact(s):
            if re.search(r'(password|token|secret|authorization|api.key|bearer|http_post|login_url)',s,re.I):return '[REDACTED POSSIBLE SECRET]'
            return re.sub(r'https?://[^\'"\s]+','[URL]',s).rstrip()[:215]
          for start,end in ((2850,2895),(2973,2997),(3067,3130),(3185,3270),(3271,3549),(3550,3670),(3671,3752),(3809,3850)):
            print('====== SECTION',start,end,'======')
            for i in range(start,end+1):
              s=a[i-1]
              if start==3271 and end==3549 and not re.search(r'\b(price|discount|amount|quantity|total|tax|shipping|Charge|orderDetails|orderDetail|unit_price|Price|Discount|total_row|$)\b',s,re.I):continue
              print(i,redact(s))
          print('SOURCE_CODE_LINE_COUNT',len(a))
          PY
          echo '===== NON-SENSITIVE SAMPLED ORDER FINANCIALS ====='
          docker exec -i vc-vesta php -d memory_limit=384M -d display_errors=0 <<'PHP'
          <?php
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          global $wpdb;
          $ids=$wpdb->get_col("SELECT ID FROM {$wpdb->posts} WHERE post_type='shop_order' AND ID>105000 ORDER BY ID DESC LIMIT 50");
          $count=0;
          foreach($ids as $id){
            $o=wc_get_order($id);
            if(!$o || !in_array($o->get_status(),['processing','completed'],true))continue;
            echo "ORDER_FINANCIAL ID=$id PAYMENT=".$o->get_payment_method().
              " PAID_DATE=".($o->get_date_paid()?$o->get_date_paid()->date('Y-m-d'):'none').
              " CURRENCY=".$o->get_currency()." STATUS=".$o->get_status().
              " SUBTOTAL=".$o->get_subtotal().
              " DISCOUNT=".$o->get_discount_total().
              " DISCOUNT_TAX=".$o->get_discount_tax().
              " SHIPPING=".$o->get_shipping_total().
              " SHIPPING_TAX=".$o->get_shipping_tax().
              " TAX=".$o->get_total_tax().
              " TOTAL=".$o->get_total().
              " COUPONS=".count($o->get_items('coupon')).
              " FEES=".count($o->get_items('fee')).
              " ITEM_COUNT=".count($o->get_items('line_item')).
              " ERP_ACK=".(int)$o->get_meta('mahak_id')."\n";
            foreach($o->get_items('fee') as $f) echo "ORDER_FEE ID=$id AMOUNT=".$f->get_total()." TAX=".$f->get_total_tax()."\n";
            if(++$count>=22)break;
          }
          $opt=get_option('bazara_visitor_settings',[]);
          foreach(['selectCurrencySoftware','selectCurrencyPlugin','chkShippingOrder','chkBankOrder','chkLastOrderID','radioCustomer','CarrierCurrencyType'] as $k){
             if(isset($opt[$k]) && is_scalar($opt[$k]))echo "OPTION_$k=".preg_replace('/[^a-z0-9_-]/i','',(string)$opt[$k])."\n";
          }
          $active=get_option('active_plugins',[]);
          foreach($active as $plugin)if(preg_match('/snap|digipay|toro|azki|tapsi|install|credit|woo|bazara|pay|wallet|saman|zarin|idpay|nextpay|sepehr|novin|persian/i',$plugin)){
             echo "ACTIVE_GATEWAY_OR_WOO_PLUGIN=".preg_replace('/[^a-z0-9.\/_-]/i','',$plugin)."\n";
          }
          PHP
          echo READ_ONLY_FINANCE_AUDIT_DONE=yes
          REMOTE
