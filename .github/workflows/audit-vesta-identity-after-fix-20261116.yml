name: Read-only audit of repaired Woo customer accounts and ERP person provisioning
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-vesta-identity-after-fix-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check new Woo account integrity, Mahak cached Person IDs, match evidence, and invoice states
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=768M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $ids=[105460,105458,105456,105454,105452,105450,105361];
          $peopleTable=$wpdb->prefix.'bazara_persons';
          $columns=$wpdb->get_col("SHOW COLUMNS FROM $peopleTable",0);
          echo 'PERSON_COLUMNS='.implode(',',array_values(array_filter($columns,fn($c)=>preg_match('/person|mobile|phone|email|first|last|deleted/i',$c)))).PHP_EOL;
          $s=['repaired'=>0,'guard_ok'=>0,'person_missing'=>0,'person_valid'=>0];
          $api=new BazaraApi(true);$cloud=Vesta_Accounting_Reliability::cloud($api);
          foreach($ids as $id){
            $o=wc_get_order($id);if(!$o)continue;
            $uid=(int)$o->get_customer_id();$mid=(int)get_user_meta($uid,'mahak_id',true);
            $why=vcar_identity_guard($o);
            $rows=$cloud['orders'][$id]??[];
            $erp= count($rows)===1 ? $rows[0] : null;
            $cloudPerson=(int)($erp['PersonId']??0);
            $hasNote=$o->get_meta('_vesta_identity_repaired_at')!=='';
            $s['repaired']+=(int)$hasNote;$s['guard_ok']+=(int)($why==='');
            $s[$mid?'person_valid':'person_missing']++;
            echo 'REPAIRED_ACCOUNT ORDER='.$id.' WOO_UID='.$uid.' PERSON_ID='.$mid.' ERP_PERSON_PRESENT='.(int)($mid>0).
              ' REMOTE_PERSON_MATCHES_NEW='.(int)($mid>0&&$cloudPerson===$mid).
              ' REPAIR_NOTE='.(int)$hasNote.' GUARD='.$why.
              ' ACCOUNT_OWNER_EQUAL_LEGACY='.(int)($uid===3055).PHP_EOL;
          }
          echo 'CURRENT_REPAIR_STATUS='.json_encode($s).PHP_EOL;
          echo 'ACCOUNTING_SENDER_ENABLED='.(int)get_option('vcar_sender_enabled',false).PHP_EOL;
          echo 'READ_ONLY_NO_PERSON_CREATES=yes'.PHP_EOL;
          PHP
      - name: Check cloud person identities, duplicates and safe single-user provisioning readiness
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';
          $_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';global $wpdb;
          $api=new BazaraApi(true);
          $r=$api->get_all_data('',array('fromPersonVersion'=>0));
          $m=is_array($r)?($r['message']??[]):[];
          $people=$m['People']??$m['Persons']??null;
          echo 'CLOUD_PEOPLE_PRESENT='.(int)is_array($people).' COUNT='.(is_array($people)?count($people):-1).' TOP_LEVEL_KEYS='.(is_array($m)?implode(',',array_keys($m)):'none').PHP_EOL;
          $ids=[105460,105458,105456,105454,105452,105450,105361];
          $table=$wpdb->prefix.'bazara_persons';
          $found=0;$ambiguous=0;
          foreach($ids as $id){
            $o=wc_get_order($id);if(!$o)continue;
            $uid=(int)$o->get_customer_id();$phone=vesta_otp_phone($o->get_billing_phone());
            $foundInCache=$wpdb->get_results($wpdb->prepare("SELECT PersonId,PersonClientID,FirstName,LastName,Mobile FROM $table WHERE PersonClientID=%d AND Deleted=0",$uid));
            $fromCloud=[]; $phoneMatches=0;
            if(is_array($people))foreach($people as $p){
              if(!empty($p['Deleted']))continue;
              if((int)($p['PersonClientId']??$p['PersonClientID']??-1)===$uid)$fromCloud[]=$p;
            }
            echo 'PERSON_DUPLICATE_CHECK ORDER='.$id.' WOO_UID='.$uid.' CACHE_CLIENT_MATCHES='.count($foundInCache).
              ' CLOUD_CLIENT_MATCHES='.count($fromCloud).
              ' WORDPRESS_MAHAK='.(int)get_user_meta($uid,'mahak_id',true).
              ' PERSON_CACHE_FRESH='.(int)is_array($people).PHP_EOL;
            $found+=count($fromCloud);$ambiguous+=(int)(count($fromCloud)>1 || count($foundInCache)>1);
          }
          echo 'PERSON_PROVISION_PREFLIGHT_EXISTING_CLOUD='.$found.' AMBIGUOUS='.$ambiguous.' NO_REMOTE_WRITES=yes'.PHP_EOL;
          PHP
      - name: Check pre-existing Mahak person with same verified mobile to avoid duplicate person creation
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'docker exec -i vc-vesta php -d display_errors=0 -d memory_limit=1024M' <<'PHP'
          <?php
          error_reporting(E_ERROR|E_PARSE);
          $_SERVER['HTTP_HOST']='vesta-cosmetics.ir';$_SERVER['SERVER_NAME']='vesta-cosmetics.ir';$_SERVER['HTTPS']='on';$_SERVER['SERVER_PORT']='443';$_SERVER['REQUEST_URI']='/';
          require '/var/www/html/wp-load.php';
          $api=new BazaraApi(true);
          $r=$api->get_all_data('',array('fromPersonVersion'=>0));
          $people=$r['message']['People']??[];
          $ids=[105460,105458,105456,105454,105452,105450,105361];
          foreach($ids as $id){
             $o=wc_get_order($id);$uid=(int)$o->get_customer_id();
             $phone=vesta_otp_phone($o->get_billing_phone());
             $bname=vcar_identity_normalize_name($o->get_billing_first_name().' '.$o->get_billing_last_name());
             $mobile=[];$sameName=0;
             foreach($people as $p){
                if(!empty($p['Deleted']))continue;
                $m=vesta_otp_phone((string)($p['Mobile']??$p['mobile']??''));
                if($m && $phone && $m===$phone){$mobile[]=(int)($p['PersonId']??0);$n=vcar_identity_normalize_name(($p['FirstName']??'').' '.($p['LastName']??''));$sameName+=(int)($n===$bname);}
             }
             echo 'PERSON_MOBILE_COLLISION ORDER='.$id.' UID='.$uid.' CLOUD_MOBILE_MATCHES='.count($mobile).' SAME_NAME_MATCHES='.$sameName.PHP_EOL;
          }
          echo 'PERSON_MOBILE_COLLISION_READONLY=yes'.PHP_EOL;
          PHP
