name: Diagnose Vesta HTTP versus CLI SMTP auth
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnostic/vesta-http-cron-mail-probe-20261020.php
      - scripts/run-vesta-http-cron-mail-probe-20261020.sh
      - .github/workflows/run-vesta-http-cron-mail-probe-20261020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l scripts/diagnostic/vesta-http-cron-mail-probe-20261020.php
          bash -n scripts/run-vesta-http-cron-mail-probe-20261020.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Trace effective PHPMailer settings in real WP-Cron HTTP context
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/diagnostic/vesta-http-cron-mail-probe-20261020.php "root@$HOST:/tmp/vesta-http-cron-mail-probe-20261020.php"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null scripts/run-vesta-http-cron-mail-probe-20261020.sh "root@$HOST:/tmp/run-vesta-http-cron-mail-probe-20261020.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST" 'bash /tmp/run-vesta-http-cron-mail-probe-20261020.sh'
